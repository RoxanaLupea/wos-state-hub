  const hasTwoLines = segments.length > 0 || insideParts.length > 0 || partsMode || phaseParts.length > 0;
  const stripeParts = bar.stripes || [];

  // What is lit: the tapped part of this event, or a part drawn on this bar. A selected day alone lights no bars
  // (the day itself is tinted).
  let light = '';
  const selection = app.selection;
  if (selection && selection.key) {
    let span = null;
    if (!selection.key || selection.key === bar.key) span = { start: Math.max(selection.start, piece.start), end: Math.min(selection.end, piece.end) };
    insideParts.forEach(function (part) {
      if (selection.key === part.key) span = { start: part.startMinute, end: part.endMinute };
    });
    if (span && span.end > span.start) light = '<span class="bar-light" data-start-minute="' + span.start + '" data-end-minute="' + span.end + '"></span>';
  }

  let lineTwo = '';
  segments.forEach(function (segment) {
    const isLit = !!(selection && selection.key === bar.key && selection.start <= segment.start && selection.end >= segment.end);
    if (!segment.isFirst && segment.start > piece.start) lineTwo += barMarkMarkup(segment.start, 'divider', segment.name + ' starts');
    lineTwo += '<span class="bar-segment' + (isLit ? ' lit' : '') + '" data-start-minute="' + segment.start + '" data-end-minute="' + segment.end + '">' +
      '<span class="bar-segment-name" data-short="' + escapeHtml(segment.shortName) + '">' + escapeHtml(segment.name) + '</span></span>';
  });
  (partsMode ? [] : insideParts).forEach(function (part) {
    const partName = eventDisplayName(part.eventType, part.label);
    if (part.startMinute > piece.start) lineTwo += barMarkMarkup(part.startMinute, 'divider', partName + ' starts');
    if (part.endMinute < piece.end) lineTwo += barMarkMarkup(part.endMinute, 'divider', partName + ' ends');
    lineTwo += '<span class="bar-inside" role="button" tabindex="0" data-open-event="' + escapeHtml(part.key) + '" data-start-minute="' + part.startMinute + '" data-end-minute="' + part.endMinute + '"' +
      ' title="' + escapeHtml(partName + ' · ' + spanText(part.startMinute, part.endMinute)) + '">' + eventIconMarkup(part.eventType) + '</span>';
  });
  // A bar of an event's parts (SvS): line 1 has the event's name, then each part (Preparation, Battle, Field Triage)
  // in capitals between white lines; line 2 has what is inside each part: the named days, the short part in it
  // (Castle Battle, its logo when the name does not fit) or the part's second line (Troop Revival).
  // The first part starts after the name; when it does not fit there, the name becomes the short name (SvS).
  let lineOne = '';
  if (partsMode) {
    const mainShort = mainOfParts.shortName || mainOfParts.name;
    const partName = function (eventType) {
      const name = eventType.shortName || eventType.name;
      const own = name.indexOf(mainShort + ' ') === 0 ? name.slice(mainShort.length + 1) : name;
      return own.charAt(0).toUpperCase() + own.slice(1);
    };
    const parts = [{ bar: bar, start: piece.start, end: chainParts.length ? chainParts[0].start : piece.end, insideParts: insideParts }].concat(chainParts);
    parts.forEach(function (part, index) {
      const what = eventDisplayName(part.bar.eventType, '');
      if (index > 0) lineOne += barMarkMarkup(part.start, 'part-line', what + ' starts') + barMarkMarkup(part.start, 'divider', what + ' starts');
      lineOne += '<span class="bar-part' + (index === 0 ? ' first-part' : '') + '" role="button" tabindex="0" data-open-event="' + escapeHtml(part.bar.key) + '" data-start-minute="' + part.start + '" data-end-minute="' + part.end + '"' +
        ' title="' + escapeHtml(what + ' · ' + spanText(part.bar.startMinute, part.bar.endMinute)) + '">' + escapeHtml(partName(part.bar.eventType)) + '</span>';
      if (index === 0) return;   // the first part's line 2 is its named days (segments)
      const inside = part.insideParts || [];
      const below = inside.length ? inside.map(function (one) { return eventDisplayName(one.eventType, one.label); }).join(' · ') : part.bar.eventType.barSubtitle || '';
      if (!below) return;
      const first = inside[0];
      lineTwo += '<span class="bar-segment' + (first ? ' bar-chain' : '') + '"' + (first ? ' role="button" tabindex="0" data-open-event="' + escapeHtml(first.key) + '"' : '') +
        ' data-start-minute="' + part.start + '" data-end-minute="' + part.end + '"' +
        (first ? ' title="' + escapeHtml(below + ' · ' + spanText(first.startMinute, first.endMinute)) + '"' : '') +
        '><span class="bar-segment-name">' + escapeHtml(below) + '</span>' +
        (first ? '<span class="bar-chain-logo">' + eventIconMarkup(first.eventType) + '</span>' : '') + '</span>';
    });
  }
  // Parts open only at certain times (Tundra Arms League's predictions). In a week with a single phase (Elimination,
  // Championship), the phase goes on line 1 after the name and line 2 shows the openings: the part's logo and label on
  // each opening (Champion Prediction "×16"), or the part's logo where each opening ends (Match Prediction).
  const openingMarks = [];
  stripeParts.forEach(function (part) {
    (partOpenings(part) || []).forEach(function (opening) {
      if (part.eventType.windowMark === 'label') {
        if (opening.end > piece.start && opening.start < piece.end) openingMarks.push({ part: part, opening: opening, labelled: true });
      } else if (opening.end > piece.start && opening.end <= piece.end) {
        openingMarks.push({ part: part, opening: opening, labelled: false });
      }
    });
  });
  const phaseOnLineOne = phaseParts.length === 1 && openingMarks.length > 0;
  if (phaseOnLineOne) {
    lineOne += '<span class="bar-part first-part phase-line-one" data-start-minute="' + piece.start + '" data-end-minute="' + piece.end + '">' + escapeHtml(phaseParts[0].name) + '</span>';
    openingMarks.forEach(function (mark) {
      const opening = mark.opening;
      const what = eventDisplayName(mark.part.eventType, '') + (opening.label ? ' ' + opening.label : '');
      // A logo where an opening ends sits at its end (in the 7 hours before it).
      const start = mark.labelled ? Math.max(opening.start, piece.start) : Math.max(piece.start, opening.end - 7 * 60);
      const end = mark.labelled ? Math.min(opening.end, piece.end) : opening.end;
      lineTwo += '<span class="bar-segment opening-mark' + (mark.labelled ? '' : ' at-end') + '" data-start-minute="' + start + '" data-end-minute="' + end + '"' +
        ' title="' + escapeHtml(what + ' · ' + spanText(opening.start, opening.end)) + '"><span class="bar-segment-name opening-mark-inside">' +
        eventIconMarkup(mark.part.eventType) + (mark.labelled ? escapeHtml(opening.label) : '') + '</span></span>';
    });
  }
  // A bar of an event's phases (Tundra Arms League): the event's name on line 1, its phases on line 2 between white
  // lines, like named days. Tapping the bar opens the event on the day tapped.
  (phaseOnLineOne ? [] : phaseParts).forEach(function (part, index) {
    if (index > 0) lineTwo += barMarkMarkup(part.start, 'divider', part.name + ' starts');
    lineTwo += '<span class="bar-segment" data-start-minute="' + part.start + '" data-end-minute="' + part.end + '">' +
      '<span class="bar-segment-name">' + escapeHtml(part.name) + '</span></span>';
  });
  if (subtitle) lineTwo += '<span class="bar-sub">' + escapeHtml(subtitle) + '</span>';
  const logo = eventIconMarkup(mainOfParts || bar.eventType);

  // Parts beside the event (Trade Route, Treasure Hunt Drill, Emporium of Enigma): one line each under the bar.
  // A part open only at certain times (predictions) is drawn only while it is open, without a logo or a white line at
  // its end (its openings are marked on line 2).
  const stripes = stripeParts.map(function (part, index) {
    const partName = eventDisplayName(part.eventType, '');
    const openings = partOpenings(part);
    const color = escapeHtml(part.eventType.color || '#E8D9A8');
    if (openings) {
      return openings.map(function (opening) {
        return '<span class="bar-stripe" style="background:' + color + ';bottom:' + (-6 - 5 * index) + 'px" data-start-minute="' + opening.start + '" data-end-minute="' + opening.end + '"></span>';
      }).join('');
    }
    return '<span class="bar-stripe" style="background:' + color + ';bottom:' + (-6 - 5 * index) + 'px" data-start-minute="' + part.startMinute + '" data-end-minute="' + part.endMinute + '"></span>' +
      // Its logo where it ends, only in the week it ends. A part without its own picture shows its drawn icon,
      // not its event's logo again.
      (part.endMinute <= piece.end ? '<span class="bar-stripe-end" data-end-minute="' + part.endMinute + '"' + (part.endMinute === piece.end ? ' data-at-bar-end="yes"' : '') + ' title="' + escapeHtml(partName + ' · ' + spanText(part.startMinute, part.endMinute)) + '">' +
        (part.eventType.imageFile || part.eventType.iconUrl ? eventIconMarkup(part.eventType) : svgIcon(part.eventType.icon)) + '</span>' : '') +
      (part.endMinute < piece.end ? barMarkMarkup(part.endMinute, 'end-mark', partName + ' ends') : '');
  }).join('');

  // Every bar with a second line has the big logo beside both lines and the same height: a phase or second name
  // (Tundra Arms League, Field Triage), named days (SvS preparation, Alliance Showdown) or a part on line 2 (SvS Battle's Castle).
  const sideLogo = !!subtitle || hasTwoLines;
  const classes = ['bar', 'clickable'];
  if (sideLogo) classes.push('phase-lines');
  if (hasTwoLines) classes.push('two-lines', 'day-lines');
  if (partsMode) classes.push('parts-bar');
  if (stripeParts.length) classes.push('has-trail');
  // White lines on the bar for steps marked for it.
  let stepMarks = '';
  if (!bar.count && !partsMode) {
    for (let dayNumber = 0; dayNumber <= (bar.lengthDays || 1); dayNumber++) {
      stepsForDay(bar.eventType.id, dayNumber).forEach(function (step) {
        if (step.barMark !== 'yes' || !step.startTimeUtc) return;
        const minute = (bar.startDay + dayNumber - 1) * MINUTES_PER_DAY + minutesFromTime(step.startTimeUtc);
        if (minute > piece.start && minute < piece.end) stepMarks += barMarkMarkup(minute, 'end-mark', step.label);
      });
    }
  }
  if (bar.isCancelled) classes.push('cancelled');
  return '<div class="' + classes.join(' ') + '" style="' + style + '" title="' + escapeHtml(fullName + (bar.isCancelled ? ' (cancelled)' : '')) + '"' +
    ' data-trail-count="' + stripeParts.length + '" data-lane="' + lane + '" data-first-column="' + piece.firstColumn + '" data-last-column="' + piece.lastColumn + '"' +
    ' data-left-fraction="' + piece.leftFraction.toFixed(5) + '" data-right-fraction="' + piece.rightFraction.toFixed(5) + '"' +
    ' data-event-type="' + escapeHtml(bar.eventType.id) + '" data-short-name="' + escapeHtml(mainOfParts ? mainOfParts.shortName || mainOfParts.name : shortName) + '"' +
    ' data-open-event="' + escapeHtml(bar.key) + '" data-day="' + (weekStart + piece.firstColumn) + '" role="button" tabindex="0">' +
    light +
    (sideLogo ? '<span class="bar-side-icon">' + logo + '</span>' : '') +
    lineOne +
    '<span class="bar-head">' + (sideLogo ? '' : logo) + (bar.isCancelled ? '<span class="cancelled-mark" aria-label="Cancelled">✕</span>' : '') +
    // A bar carrying the other parts (SvS) is named after the whole event.
    '<span class="bar-label">' + escapeHtml(mainOfParts ? mainOfParts.name.replace(/\s*\([^)]*\)\s*$/, '') : bar.eventType.name) + '</span>' + countText + timeText + '</span>' +
    lineTwo + stripes + stepMarks + '</div>';
}

// How much of a line or bar a hint colour takes before its own colour (Field Triage: a hint of SvS Battle's red).
const HINT_SHARE = 22;

// The three shades of a bar: deep (behind the logo), the event's colour, and light (at the end, from its second colour).
// An event whose timeline colour fades ("#CF7F86>#5FB8A8") starts with a hint of the first colour (hint).
function barFadeColors(eventType) {
  const first = hexToHsl(eventType.color || '#AFC8F5');
  const second = hexToHsl(eventType.colorEnd || eventType.color || '#AFC8F5');
  const top = Math.max(first.lightness, second.lightness);
  const timeline = timelineColors(eventType, eventType.color || '#AFC8F5');
  return {
    hint: timeline.isFade ? timeline.start : '',
    dark: hslToHex(first.hue, first.saturation, top - 0.20),
    middle: hslToHex(first.hue, first.saturation, top - 0.06),
    light: hslToHex(second.hue, second.saturation, top + 0.10)
  };
}

// The colour at a point of an event's fade (0 = start, deep; 1 = end, light), the same fade as its bar:
// deep at the start, the event's colour at 40%, light at the end.
function fadeColorAt(eventType, position) {
  const fade = barFadeColors(eventType);
  const at = Math.min(1, Math.max(0, position));
  const from = at <= 0.4 ? fade.dark : fade.middle, to = at <= 0.4 ? fade.middle : fade.light;
  const share = at <= 0.4 ? at / 0.4 : (at - 0.4) / 0.6;
  const a = hexToRgb(from), b = hexToRgb(to);
  const mix = function (x, y) { return Math.round(x + (y - x) * share); };
  return 'rgb(' + mix(a.red, b.red) + ',' + mix(a.green, b.green) + ',' + mix(a.blue, b.blue) + ')';
}

// A piece of line fading between two points of an event's fade.
function fadePiece(eventType, from, to) {
  return 'linear-gradient(' + fadeColorAt(eventType, from) + ',' + fadeColorAt(eventType, to) + ')';
}

// Moves each bar's edges to its real start and end times inside its first and last day, and places what is
// drawn on it (named days, lines, parts, the lit part) at their real times. Bars are as wide as their times:
// a short one shrinks its logo to fit.
function layoutBars(panel) {
  panel.querySelectorAll('.week-row').forEach(function (row) {
    const barsGrid = row.querySelector('.bars');
    const dayBoxes = row.querySelectorAll('.day-box');
    if (!barsGrid || dayBoxes.length !== 7) return;
    const gridLeft = barsGrid.getBoundingClientRect().left;
    const columns = Array.prototype.map.call(dayBoxes, function (box) {
      const rect = box.getBoundingClientRect();
      return { left: rect.left - gridLeft, right: rect.right - gridLeft };
    });
    const weekStart = Number(barsGrid.getAttribute('data-week-start'));
    const xOfMinute = function (minute) {
      const shown = shownMinute(minute);
      const column = Math.min(6, Math.max(0, Math.floor(shown / MINUTES_PER_DAY) - weekStart));
      const fraction = Math.min(1, Math.max(0, (shown - (weekStart + column) * MINUTES_PER_DAY) / MINUTES_PER_DAY));
      return columns[column].left + fraction * (columns[column].right - columns[column].left);
    };
    barsGrid.querySelectorAll('.bar').forEach(function (bar) {
      const first = columns[Number(bar.getAttribute('data-first-column'))];
      const last = columns[Number(bar.getAttribute('data-last-column'))];
      const leftFraction = Number(bar.getAttribute('data-left-fraction'));
      const rightFraction = Number(bar.getAttribute('data-right-fraction'));
      // 1 px of space where a bar starts or ends inside a day, so bars that follow each other do not touch.
      const left = first.left + leftFraction * (first.right - first.left) + (leftFraction > 0 ? 1 : 0);
      const right = Math.max(left + 2, last.left + rightFraction * (last.right - last.left) - (rightFraction < 1 ? 1 : 0));
      bar.style.marginLeft = (left - first.left) + 'px';
      bar.style.marginRight = (last.right - right) + 'px';
      const width = right - left;

      // A bar narrower than its logo: the logo shrinks to fit.
      const logo = bar.querySelector('.bar-head .event-icon, .bar-side-icon .event-icon');
      bar.classList.remove('tiny');
      if (logo) {
        logo.style.width = logo.style.height = '';
        logo.style.removeProperty('--logo-size');
        const logoSize = logo.getBoundingClientRect().width;
        if (width < logoSize + 6) {
          bar.classList.add('tiny');
          const size = Math.max(6, Math.floor(width - 4));
          logo.style.width = logo.style.height = size + 'px';
          logo.style.setProperty('--logo-size', size + 'px');
        }
      }

      const inBar = function (x) { return Math.min(right, Math.max(left, x)); };
      // With the big logo beside both lines, line 2 starts after the logo: the first day gets the rest of the space.
      const afterLogo = bar.classList.contains('day-lines') && !bar.classList.contains('too-narrow') && !bar.classList.contains('tiny') ?
        left + parseFloat(window.getComputedStyle(bar).paddingLeft) - 4 : left;
      // Named days, parts on the same hours, the lit part and Trade Route's line: from their start to their end.
      bar.querySelectorAll('.bar-segment, .bar-inside, .bar-light, .bar-stripe, .bar-part').forEach(function (element) {
        const isLineTwo = element.classList.contains('bar-segment') || element.classList.contains('bar-inside') || element.classList.contains('bar-part');
        const to = inBar(xOfMinute(Number(element.getAttribute('data-end-minute'))));
        const from = Math.min(to, Math.max(inBar(xOfMinute(Number(element.getAttribute('data-start-minute')))), isLineTwo ? afterLogo : left));
        // A part's tap area stops 3 px before its white lines, so the lines can still be pointed at.
        const inset = element.classList.contains('bar-inside') ? Math.min(3, Math.max(0, (to - from - 8) / 2)) : 0;
        element.style.left = (from - left + inset) + 'px';
        element.style.width = Math.max(0, to - from - 2 * inset) + 'px';
        // The lit part follows the bar's round corners where it reaches its ends.
        if (element.classList.contains('bar-light')) {
          const corner = window.getComputedStyle(bar).borderTopLeftRadius;
          const leftCorner = from <= left + 0.5 ? corner : '0', rightCorner = to >= right - 0.5 ? corner : '0';
          element.style.borderRadius = leftCorner + ' ' + rightCorner + ' ' + rightCorner + ' ' + leftCorner;
        }
      });
      placeFirstPart(bar);
      // A part's logo on line 2 fits between its two lines.
      bar.querySelectorAll('.bar-inside .event-icon').forEach(function (icon) {
        const holder = icon.parentElement;
        const size = Math.max(6, Math.min(holder.clientHeight, parseFloat(holder.style.width) - 2));
        icon.style.width = icon.style.height = size + 'px';
        icon.style.setProperty('--logo-size', size + 'px');
      });
      // The white lines: only those inside the bar.
      bar.querySelectorAll('.bar-mark').forEach(function (mark) {
        const x = xOfMinute(Number(mark.getAttribute('data-minute')));
        mark.style.display = x > left + 1 && x < right - 1 ? '' : 'none';
        mark.style.left = (x - left) + 'px';
      });
      // Trade Route's logo sits just before the line where it ends.
      bar.querySelectorAll('.bar-stripe-end').forEach(function (endIcon) {
        // A part ending with the bar has its logo at the bar's end.
        const endX = endIcon.getAttribute('data-at-bar-end') ? right : xOfMinute(Number(endIcon.getAttribute('data-end-minute')));
        const isInside = endX > left && endX <= right + 1;
        endIcon.style.display = isInside ? '' : 'none';
        endIcon.style.left = Math.max(2, endX - left - endIcon.offsetWidth - 4) + 'px';
      });
    });
  });
}

// SvS: the first part on line 1 starts after the event's name (layoutBars sets where it would start by its time).
function placeFirstPart(bar) {
  const first = bar.querySelector('.bar-part.first-part');
  const label = bar.querySelector('.bar-head .bar-label');
  if (!first || !label) return;
  if (first.dataset.baseLeft === undefined || first.dataset.laidOut !== first.style.left) {
    first.dataset.baseLeft = parseFloat(first.style.left) || 0;
    first.dataset.baseWidth = parseFloat(first.style.width) || 0;
  }
  const baseLeft = Number(first.dataset.baseLeft), baseRight = baseLeft + Number(first.dataset.baseWidth);
  const nameRight = label.getBoundingClientRect().right - bar.getBoundingClientRect().left + 6;
  const left = Math.min(baseRight, Math.max(baseLeft, nameRight));
  first.style.left = left + 'px';
  first.style.width = (baseRight - left) + 'px';
  first.dataset.laidOut = first.style.left;
}

// Names that do not fit:
// - named days under a bar: always the game's names, cut with "…" where one does not fit (by the page's style);
// - a bar's name: the event's short name ("Foundry") when the name does not fit on that bar; cut with "…" when even
//   that does not fit, and only the logo when not even 4 letters fit.
function fitBarLabels(panel) {
  const canvas = fitBarLabels.canvas || (fitBarLabels.canvas = document.createElement('canvas'));
  const context = canvas.getContext('2d');
  // Measured to the fraction of a pixel (scrollWidth rounds, and a name 0.4 px too long would still show "…").
  const fits = function (element) {
    const style = window.getComputedStyle(element);
    context.font = style.fontWeight + ' ' + style.fontSize + ' ' + style.fontFamily;
    const room = element.getBoundingClientRect().width - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    return element.scrollWidth <= element.clientWidth && context.measureText(element.textContent).width <= room + 0.25;
  };
  panel.querySelectorAll('.bars').forEach(function (barsGrid) {
    const bars = Array.prototype.slice.call(barsGrid.querySelectorAll('.bar'));
    // A short part on line 2 (Castle Battle) whose name does not fit shows its logo instead.
    barsGrid.querySelectorAll('.bar-chain').forEach(function (part) {
      part.classList.toggle('logo-only', !!part.querySelector('.bar-chain-logo') && !fits(part.querySelector('.bar-segment-name')));
    });
    // A white line or a part's logo on line 1 never sits on the name: it is hidden there (it stays in the timeline).
    bars.forEach(function (bar) {
      const label = bar.querySelector('.bar-head .bar-label');
      if (!label || bar.classList.contains('too-narrow') || bar.classList.contains('tiny')) return;
      const nameRight = label.getBoundingClientRect().right + 3;
      bar.querySelectorAll('.bar-mark.end-mark, .bar-stripe-end').forEach(function (onLineOne) {
        if (onLineOne.style.display === 'none') return;
        if (onLineOne.getBoundingClientRect().left < nameRight) onLineOne.style.display = 'none';
      });
    });
    // Openings on line 2 (Tundra Arms League): a label whose logo does not fit shows without it; a logo at an
    // opening's end is hidden where it would sit on the big logo; and nothing on line 1 sits on the phase's name.
    bars.forEach(function (bar) {
      bar.querySelectorAll('.opening-mark:not(.at-end) .opening-mark-inside').forEach(function (inside) {
        const icon = inside.querySelector('.event-icon, svg');
        if (icon && inside.scrollWidth > inside.clientWidth + 0.5) icon.style.display = 'none';
      });
      const sideIcon = bar.querySelector('.bar-side-icon');
      if (sideIcon) {
        const sideRight = sideIcon.getBoundingClientRect().right + 2;
        bar.querySelectorAll('.opening-mark.at-end .event-icon, .opening-mark.at-end svg').forEach(function (icon) {
          if (icon.getBoundingClientRect().left < sideRight) icon.style.display = 'none';
        });
      }
      const phase = bar.querySelector('.phase-line-one');
      if (!phase) return;
      const range = document.createRange();
      range.selectNodeContents(phase);
      const text = range.getBoundingClientRect();
      bar.querySelectorAll('.bar-mark.end-mark, .bar-stripe-end').forEach(function (onLineOne) {
        const box = onLineOne.getBoundingClientRect();
        if (box.right > text.left - 3 && box.left < text.right + 3) onLineOne.style.display = 'none';
      });
    });
    // SvS: when the first part does not fit after the full name, the name becomes the short name.
    bars.forEach(function (bar) {
      const first = bar.querySelector('.bar-part.first-part');
      const label = bar.querySelector('.bar-head .bar-label');
      if (!first || !label || fits(first)) return;
      label.textContent = bar.getAttribute('data-short-name');
      placeFirstPart(bar);
    });
    bars.forEach(function (bar) {
      const label = bar.querySelector('.bar-head .bar-label');
      // A bar whose line 1 shows its parts (SvS) has no name to fit.
      if (!label || bar.classList.contains('tiny') || label.closest('.bar-head[hidden]')) return;
      if (fits(label)) return;
      label.textContent = bar.getAttribute('data-short-name');
      if (fits(label)) return;
      const style = window.getComputedStyle(label);
      context.font = style.fontWeight + ' ' + style.fontSize + ' ' + style.fontFamily;
      const fourLetters = context.measureText(label.textContent.slice(0, 4) + '…').width;
      if (label.clientWidth < fourLetters) bar.classList.add('too-narrow');
    });
  });
}

// Each row of bars is as tall as its tallest bar (bars with 2 lines are taller), plus room for a line under a bar.
// Every bar in a row gets the height of the tallest one, so a row never mixes heights (a one-line bar keeps its
// line in the middle).
function sizeLanes(panel) {
  panel.querySelectorAll('.bars').forEach(function (barsGrid) {
    const heights = [];
    const barHeights = [];
    const allBars = barsGrid.querySelectorAll('.bar');
    allBars.forEach(function (bar) {
      const lane = Number(bar.getAttribute('data-lane'));
      barHeights[lane] = Math.max(barHeights[lane] || 0, bar.offsetHeight);
      const trails = Number(bar.getAttribute('data-trail-count')) || 0;
      const needed = bar.offsetHeight + (trails ? BAR_TRAIL_SPACE + 5 * (trails - 1) : 0);
      heights[lane] = Math.max(heights[lane] || 0, needed);
    });
    allBars.forEach(function (bar) {
      const lane = Number(bar.getAttribute('data-lane'));
      if (bar.offsetHeight < barHeights[lane]) bar.style.height = barHeights[lane] + 'px';
    });
    const usual = barsGrid.querySelector('.bar:not(.two-lines):not(.phase-lines)');
    const usualHeight = usual ? usual.offsetHeight : 24;
    const rows = [];
    for (let lane = 0; lane < heights.length; lane++) rows.push((heights[lane] || usualHeight) + 'px');
    barsGrid.style.gridTemplateRows = rows.join(' ');
  });
}

// Shows the time of a white line on a bar (a tap again hides it). Only one shows at a time.
function showMarkTime(mark) {
  const wasShown = mark.classList.contains('show-time');
  document.querySelectorAll('.bar-mark.show-time').forEach(function (other) {
    other.classList.remove('show-time');
    other.closest('.bar').classList.remove('raised');
  });
  if (wasShown) return;
  mark.classList.add('show-time');
  mark.closest('.bar').classList.add('raised');
}

/* ---------- Year view ---------- */

// The year view shows only the big state events, as lines with the event's logo to their left where each run starts
// (and where it first shows in a month it runs into): [name, colours along the whole run, the event whose logo it
// shows, the events that count as it]. Colours come from the logos: SvS blue (preparation) to red (battle) to teal
// (Field Triage); Transfer mostly the map's warm yellow, its route's red and a sky blue (not SvS's blue) at the end;
// Tyrant deep to icy blue; Tundra Arms League warm gold to light gold. Parts and phases count as their main event.
const YEAR_VIEW_EVENTS = [
  { name: 'SvS', colors: '#3F7FE6 0%, #4F82DE 55%, #E04A4A 75%, #5FB8A8 100%', logoEventId: 'svs-prep',
    ids: ['svs', 'svs-matchmaking', 'svs-prep', 'svs-battle', 'castle-battle', 'svs-triage'] },
  { name: 'Tyrant', colors: '#2F5FC8 0%, #A9E3F5 100%', logoEventId: 'tyrant', ids: ['tyrant'] },
  { name: 'TAL', colors: '#D49A2E 0%, #F2D98C 100%', logoEventId: 'hellfire', ids: ['hellfire'] },
  { name: 'Transfer', colors: '#E2C77E 0%, #E2C77E 55%, #D9554A 78%, #5AB4E8 100%', logoEventId: 'transfer', ids: ['transfer'] }
];

// Which of the year view's events an event belongs to (itself or the main event it is part of), or null.
function yearViewEventOf(eventType) {
  return YEAR_VIEW_EVENTS.filter(function (entry) {
    return entry.ids.indexOf(eventType.id) !== -1 || entry.ids.indexOf(eventType.partOf) !== -1;
  })[0] || null;
}

// Each year-view event's runs: { entry, startDay, endDay, occurrences }. Days next to each other make one run.
function yearViewRuns(fromDay, toDay) {
  const daysByEntry = YEAR_VIEW_EVENTS.map(function () { return {}; });
  const occurrencesByEntry = YEAR_VIEW_EVENTS.map(function () { return []; });
  buildOccurrences(fromDay - 1, toDay + 1).forEach(function (occurrence) {
    const entry = yearViewEventOf(occurrence.eventType);
    if (!entry || occurrence.isCancelled) return;
    const index = YEAR_VIEW_EVENTS.indexOf(entry);
    occurrencesByEntry[index].push(occurrence);
    const days = shownDaysOf(occurrence);
    for (let day = days.first; day <= days.last; day++) daysByEntry[index][day] = true;
  });
  const runs = [];
  daysByEntry.forEach(function (days, index) {
    let run = null;
    Object.keys(days).map(Number).sort(function (a, b) { return a - b; }).forEach(function (day) {
      if (run && day === run.endDay + 1) run.endDay = day;
      else { run = { entry: YEAR_VIEW_EVENTS[index], startDay: day, endDay: day, occurrences: [] }; runs.push(run); }
    });
  });
  runs.forEach(function (run) {
    const index = YEAR_VIEW_EVENTS.indexOf(run.entry);
    run.occurrences = occurrencesByEntry[index].filter(function (occurrence) {
      const days = shownDaysOf(occurrence);
      return days.last >= run.startDay && days.first <= run.endDay;
    }).sort(compareOccurrences);
  });
  return runs;
}

function renderYearView(year) {
  const yearStart = dayFromParts(year, 0, 1);
  const yearEnd = dayFromParts(year + 1, 0, 1) - 1;
  const runs = yearViewRuns(yearStart, yearEnd);
  const today = todayDay();

  let html = '<div class="year-grid">';
  for (let month = 0; month < 12; month++) {
    const firstOfMonth = dayFromParts(year, month, 1);
    const lastOfMonth = dayFromParts(year, month + 1, 1) - 1;
    html += '<div class="mini-month"><button type="button" class="mini-month-title" data-open-month="' + firstOfMonth + '">' + MONTH_NAMES[month] + '</button>';
    html += '<div class="grid7 mini-weekdays">' + WEEKDAY_SHORT.map(function (name) { return '<span class="mini-weekday">' + name.charAt(0) + '</span>'; }).join('') + '</div>';
    // One row per week: the dates, then a line per event running that week (in the legend's order).
    const firstMonday = firstOfMonth - partsFromDay(firstOfMonth).weekday;
    for (let monday = firstMonday; monday <= lastOfMonth; monday += 7) {
      html += '<div class="mini-week"><div class="grid7">';
      for (let day = monday; day < monday + 7; day++) {
        if (day < firstOfMonth || day > lastOfMonth) { html += '<span></span>'; continue; }
        const weekday = day - monday;
        html += '<button type="button" class="mini-day' + (weekday > 4 ? ' weekend' : '') + (day === today ? ' today' : '') + '" data-day="' + day + '" aria-label="' + escapeHtml(formatDayLong(day)) + '">' +
          partsFromDay(day).date + '</button>';
      }
      html += '</div>';
      const weekStart = Math.max(monday, firstOfMonth), weekEnd = Math.min(monday + 6, lastOfMonth);
      YEAR_VIEW_EVENTS.forEach(function (entry) {
        const pieces = runs.filter(function (run) { return run.entry === entry && run.endDay >= weekStart && run.startDay <= weekEnd; });
        if (!pieces.length) return;
        html += '<div class="year-lane">' + pieces.map(function (run) {
          const from = Math.max(run.startDay, weekStart), to = Math.min(run.endDay, weekEnd);
          const pieceDays = to - from + 1, runDays = run.endDay - run.startDay + 1;
          // The logo, left of the line, where the run starts and where it first shows in a month it ran into.
          const showsLogo = from === run.startDay || from === firstOfMonth;
          const eventType = app.lookups.eventTypesById[entry.logoEventId];
          // The run's colours go along the whole run: this piece shows its own stretch of them.
          const fill = '<span class="year-line-fill" style="left:' + (-(from - run.startDay) * 100 / pieceDays) + '%;width:' + (runDays * 100 / pieceDays) + '%;' +
            'background:linear-gradient(90deg,' + entry.colors + ')"></span>';
          const isPicked = app.yearPick === entry.name + '|' + run.startDay;
          return '<button type="button" class="year-line' + (from === run.startDay ? ' starts' : '') + (to === run.endDay ? ' ends' : '') + (showsLogo ? ' with-logo' : '') + (isPicked ? ' picked' : '') + '"' +
            ' data-year-run="' + escapeHtml(entry.name + '|' + run.startDay) + '"' +
            ' style="left:calc(' + (from - monday) + ' * 100% / 7);width:calc(' + pieceDays + ' * 100% / 7)"' +
            ' title="' + escapeHtml(entry.name + ' · ' + formatDayShort(run.startDay) + (run.endDay > run.startDay ? ' – ' + formatDayShort(run.endDay) : '')) + '">' +
            (showsLogo && eventType ? '<span class="year-line-logo">' + eventIconMarkup(eventType) + '</span>' : '') +
            '<span class="year-line-track">' + fill + '</span></button>';
        }).join('') + '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  }
  html += '</div><div class="year-legend">' + YEAR_VIEW_EVENTS.map(function (entry) {
    const eventType = app.lookups.eventTypesById[entry.logoEventId];
    return '<span class="year-legend-item">' + (eventType ? '<span class="year-line-logo">' + eventIconMarkup(eventType) + '</span>' : '') +
      '<span class="year-legend-line" style="background:linear-gradient(90deg,' + entry.colors + ')"></span>' + escapeHtml(entry.name) + '</span>';
  }).join('') + '</div>';
  return html;
}

// The year view's side panel: each of the 4 events, running now or next, and the steps of the picked one (its parts
// and phases with their dates, nothing more).
function renderYearOverview() {
  const now = nowMinute(), today = todayDay();
  const runs = yearViewRuns(today - 400, today + 400);
  const runStart = function (run) { return run.occurrences.length ? run.occurrences[0].startMinute : run.startDay * MINUTES_PER_DAY; };
  const runEnd = function (run) { return run.occurrences.reduce(function (latest, occurrence) { return Math.max(latest, occurrence.endMinute); }, runStart(run)); };
  const runName = function (run) { return run.entry.name + '|' + run.startDay; };
  // Each event's run now, else its next one.
  const shownRuns = YEAR_VIEW_EVENTS.map(function (entry) {
    const mine = runs.filter(function (run) { return run.entry === entry; });
    return mine.filter(function (run) { return runStart(run) <= now && runEnd(run) > now; })[0] ||
      mine.filter(function (run) { return runStart(run) > now; })[0] || null;
  });
  let picked = app.yearPick ? runs.filter(function (run) { return runName(run) === app.yearPick; })[0] : null;
  if (!picked) picked = shownRuns.filter(function (run) { return run && runStart(run) <= now; })[0] ||
    shownRuns.filter(Boolean).sort(function (a, b) { return runStart(a) - runStart(b); })[0] || null;

  let html = '<section class="day-section glass year-overview"><h3>Now and next</h3>' + shownRuns.map(function (run, index) {
    const entry = YEAR_VIEW_EVENTS[index];
    const eventType = app.lookups.eventTypesById[entry.ids[0]] || app.lookups.eventTypesById[entry.logoEventId];
    const logoType = app.lookups.eventTypesById[entry.logoEventId] || eventType;
    if (!run) return '';
    const isRunning = runStart(run) <= now;
    const steps = yearRunSteps(run);
    const currentStep = steps.filter(function (step) { return step.minute <= now; }).pop();
    const status = isRunning ? 'Now' + (currentStep ? ': ' + currentStep.name : '') + ' · until ' + formatDayShort(shownDayOf(runEnd(run) - 1))
      : 'Next: ' + formatDayShort(shownDayOf(runStart(run))) + ' – ' + formatDayShort(shownDayOf(runEnd(run) - 1));
    return '<button type="button" class="year-overview-row' + (picked === run ? ' picked' : '') + '" data-year-run="' + escapeHtml(runName(run)) + '">' +
      (logoType ? eventBadgeMarkup(logoType, 'list') : '') + '<span class="year-overview-text"><b>' + escapeHtml(eventType ? eventType.name.replace(/\s*\([^)]*\)\s*$/, '') : entry.name) + '</b>' +
      '<span>' + escapeHtml(status) + '</span></span></button>';
  }).join('') + '</section>';

  if (picked) {
    const steps = yearRunSteps(picked);
    const currentStep = runStart(picked) <= now && runEnd(picked) > now ? steps.filter(function (step) { return step.minute <= now; }).pop() : null;
    const eventType = app.lookups.eventTypesById[picked.entry.ids[0]] || app.lookups.eventTypesById[picked.entry.logoEventId];
    html += '<section class="day-section glass year-steps"><h3>' + escapeHtml(eventType ? eventType.name.replace(/\s*\([^)]*\)\s*$/, '') : picked.entry.name) + '</h3>' +
      '<span class="event-note">' + escapeHtml(formatDayShort(picked.startDay) + ' – ' + formatDayShort(picked.endDay)) + '</span>' +
      '<ol class="year-step-list">' + steps.map(function (step) {
        return '<li class="' + (step === currentStep ? 'now' : '') + '"><span class="year-step-when">' + escapeHtml(formatDayShort(shownDayOf(step.minute)) + (clockText(step.minute) === '00:00' ? '' : ' · ' + clockText(step.minute))) + '</span>' +
          '<span class="year-step-name">' + escapeHtml(step.name) + (step === currentStep ? ' <em>now</em>' : '') + '</span></li>';
      }).join('') + '</ol></section>';
  }
  return html;
}

// The steps of a year-view run: each event in it (SvS matchmaking, preparation, Battle, Castle Battle, Field Triage),
// or each phase of an event with phases (Tyrant, Tundra Arms League, State Transfer), with its start.
function yearRunSteps(run) {
  const steps = [];
  run.occurrences.forEach(function (occurrence) {
    const phases = (app.lookups.phasesByEventType[occurrence.eventType.id] || []).map(function (phase) {
      const span = phaseMinutes(occurrence, phase);
      return span ? { minute: span.start, name: phase.name } : null;
    }).filter(Boolean);
    if (phases.length) steps.push.apply(steps, phases);
    else steps.push({ minute: occurrence.startMinute, name: eventDisplayName(occurrence.eventType, occurrence.label) });
  });
  return steps.sort(function (a, b) { return a.minute - b.minute; });
}

/* ---------- Day details ---------- */

function renderDayPanel() {
  const panel = document.getElementById('dayPanel');
  if (app.view === 'year') {
    panel.innerHTML = '<button type="button" class="day-back" data-close-day>' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Back</button>' +
      renderYearOverview();
    return;
  }
  if (isGroupKey(app.openEventKey)) {
    panel.innerHTML = renderGroupPanel(app.openEventKey);
    return;
  }
  if (app.openEventKey) {
    const occurrence = findOccurrenceByKey(app.openEventKey, app.selectedDay);
    if (occurrence) {
      panel.innerHTML = renderEventPanel(occurrence, app.selectedDay);
      return;
    }
    app.openEventKey = '';
  }
  panel.innerHTML = renderDayTimeline(app.selectedDay);
}

// A grouped alliance bar ("Bear ×4"): each alliance's time of that event on that day ("DVL BT1 · 12:00"). Ticking a
// time follows it: then only the followed times show in the calendar, as the logo at their time. Admins change a time
// in place with the pencil beside it (for every date of that alliance time).
function renderGroupPanel(groupKey) {
  const parts = groupKey.split('|');
  const eventType = app.lookups.eventTypesById[parts[1]];
  const day = Number(parts[2]);
  if (!eventType) return renderDayTimeline(day);
  const window = dayWindow(day);
  const times = buildOccurrences(day - 1, day + 1).filter(function (occurrence) {
    return occurrence.eventType.id === eventType.id && !isStateWide(occurrence) && occurrence.allianceIds.some(allianceIsShown) &&
      occurrence.startMinute < window.end && occurrence.endMinute > window.start && showsOnDay(occurrence, day);
  }).sort(function (a, b) {
    // Main alliances (upper-case tags) before their academies, then by trap number: DVL BT1, DVL BT2, dvl BT1, dvl BT2.
    const nameA = allianceTimeName(a), nameB = allianceTimeName(b);
    return (nameA < nameB ? -1 : nameA > nameB ? 1 : 0) || a.startMinute - b.startMinute;
  });
  let html = '<button type="button" class="back-link" data-back-to-day>' +
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>' +
    'Back</button>';
  html += '<section class="day-section glass event-page" style="' + tintedPanelStyle(eventType.color || '#AFC8F5') + '">' +
    '<div class="event-page-head">' + eventBadgeMarkup(eventType, 'large') +
    '<div class="event-page-title"><h2>' + escapeHtml(eventType.name) + '</h2>' +
    '<span class="event-note">' + escapeHtml(formatDayShort(day)) + '</span></div></div>' +
    '<p class="event-info-line">Tick the times you follow. Only those show in your calendar, at their time.</p>' +
    '<div class="time-list">' + times.map(function (occurrence) {
      const isFollowed = app.followedTimes.indexOf(occurrence.scheduleId) !== -1;
      const isEditing = app.data.isAdmin && app.editingTime === occurrence.scheduleId;
      const schedule = app.lookups.schedulesById[occurrence.scheduleId] || {};
      const timeHtml = isEditing ?
        '<input class="text-input time-input" type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" value="' + escapeHtml(schedule.startTimeUtc || '00:00') + '" data-time-input="' + escapeHtml(occurrence.scheduleId) + '" aria-label="Time (UTC)">' :
        '<span class="time-value">' + escapeHtml(clockText(occurrence.startMinute)) + '</span>';
      return '<div class="time-row' + (isFollowed ? ' followed' : '') + '">' +
        '<button type="button" class="time-follow" data-follow-time="' + escapeHtml(occurrence.scheduleId) + '" aria-pressed="' + isFollowed + '">' +
        '<span class="filter-box' + (isFollowed ? ' on' : '') + '" aria-hidden="true">' + (isFollowed ? '✓' : '') + '</span>' +
        '<span class="time-name">' + escapeHtml(allianceTimeName(occurrence)) + '</span></button>' + timeHtml +
        (app.data.isAdmin && !isEditing ? pencilButton('data-edit-time="' + escapeHtml(occurrence.scheduleId) + '"', 'Change this time') : '') + '</div>';
    }).join('') + '</div>' +
    (app.data.isAdmin && app.editingTime ? '<p class="event-note">Times are UTC and apply to every date of that alliance time.</p>' : '') +
    '</section>';
  return html;
}

// The day's timeline: all-day items at the top (the longest first), then a row for each time something starts.
// Tapping an item with something to show opens that event on this day.
function renderDayTimeline(day) {
  const window = dayWindow(day);
  const allOccurrences = buildOccurrences(day - 1, day + 1).filter(function (occurrence) {
    return occurrence.startMinute < window.end && occurrence.endMinute > window.start && (isStateWide(occurrence) || showsOnDay(occurrence, day));
  });
  const occurrences = allOccurrences.filter(categoryIsShown)
    .filter(function (occurrence) { return isStateWide(occurrence) || occurrence.allianceIds.some(allianceIsShown); });
  const allDayItems = [];
  let rows = [];

  // Parts drawn on their main event's bar (Trade Route) are no all-day item; their times still show.
  const stripeKeys = findStripeParts(buildOccurrences(day - 8, day + 8)).partKeys;
  occurrences.forEach(function (occurrence) {
    const name = eventDisplayName(occurrence.eventType, occurrence.label) + allianceTagsText(occurrence);
    // A one-day event with a start time is only a row in the timeline; everything else is also an all-day item.
    const isTimedOneDay = occurrence.lengthDays === 1 && !!occurrence.startTimeUtc;
    // Short line under the name: the phase, the day's name (SvS prep), and steps without a time.
    if (!isTimedOneDay && !stripeKeys[occurrence.key]) allDayItems.push({ occurrence: occurrence, html: renderAllDayItem(occurrence, name, eventDayLine(occurrence, day)) });
    if (!occurrence.isCancelled) rows = rows.concat(eventMoments(occurrence, window));
  });

  // Fortress Friday: each fortress and stronghold battle with its time (all of them for State, ours for Alliance).
  const fortressOccurrence = allOccurrences.filter(function (occurrence) { return occurrence.eventType.id === FORTRESS_EVENT_ID && isStateWide(occurrence); })[0];
  if (fortressOccurrence) {
    rows = rows.concat(fortMoments(window).filter(function (row) { return fortIsShown(row.allianceId); }).map(function (row) {
      return Object.assign(row, { key: eventHasInfo(fortressOccurrence) ? fortressOccurrence.key : '' });
    }));
  }

  const shownRows = timelineOrder(rows);
  // All-day items: the longest event first; parts right under their main event.
  allDayItems.sort(function (a, b) {
    return (b.occurrence.endMinute - b.occurrence.startMinute) - (a.occurrence.endMinute - a.occurrence.startMinute) ||
      compareByFamily(a.occurrence.eventType, b.occurrence.eventType);
  });

  let html = '<button type="button" class="day-back" data-close-day>' +
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Back</button>' +
    '<div class="day-heading"><div class="day-heading-text"><h2>' + escapeHtml(formatDayLong(day)) + '</h2><span>' + escapeHtml(timeModeText()) + '</span></div>' +
    (app.data.isAdmin ? pencilButton('data-add-on-day="' + day + '"', 'Add an event on this day', 'Add') : '') + '</div>';
  if (app.categories.indexOf('alliance') !== -1 && !myAllianceFamilyIds()) {
    html += '<div class="day-empty glass">Pick your alliance in Me to see its times.</div>';
  }
  if (!allDayItems.length && !shownRows.length) return html + '<div class="day-empty glass">Nothing in the ticked filters on this day.</div>';
  html += '<section class="day-section glass"><h3>Timeline</h3>';
  if (allDayItems.length) html += '<div class="all-day-list"><span class="all-day-label">All day</span>' + allDayItems.map(function (item) { return item.html; }).join('') + '</div>';
  if (shownRows.length) html += '<ol class="moment-list">' + shownRows.map(function (row) { return renderMoment(row, !!row.key); }).join('') + '</ol>';
  return html + '</section>';
}

// "Game time (UTC)" or "Your time (UTC+2)": which clock the times on screen use.
function timeModeText() {
  return showsLocalTime() ? 'Your time (' + localOffsetLabel() + ')' : 'Game time (UTC)';
}

// Which day of the event a shown day is (1 = the first day). With "Mine" a shown day can touch two game
// days; the one covering most of it counts.
function eventDayFor(occurrence, day) {
  const middle = dayWindow(day).start + MINUTES_PER_DAY / 2;
  const dayOfEvent = Math.floor(middle / MINUTES_PER_DAY) - occurrence.startDay + 1;
  return Math.min(Math.max(dayOfEvent, 1), occurrence.lengthDays);
}

// The phase, the day's name (SvS prep) and the steps without a time, for one shown day of an event.
function eventDayLine(occurrence, day) {
  const eventType = occurrence.eventType;
  const dayOfEvent = eventDayFor(occurrence, day);
  const parts = [];
  const phase = phaseForDay(eventType.id, dayOfEvent);
  if (phase) parts.push(phase.name);
  const dayName = pointSourcesForDay(eventType.id, dayOfEvent).filter(function (source) { return source.dayNumber && source.dayName; }).map(function (source) { return source.dayName; })[0];
  if (dayName) parts.push(dayName);
  stepsForDay(eventType.id, dayOfEvent).filter(function (step) { return !step.startTimeUtc; }).forEach(function (step) {
    if (parts.indexOf(step.label) === -1) parts.push(step.label);
  });
  return parts.join(' · ');
}

// The moments of one event inside a time window: its start, its end (a set end time, or with "Mine" also
// the reset when it falls inside the day), the player's own slot, and its steps with a time.
function eventMoments(occurrence, window) {
  const eventType = occurrence.eventType;
  const name = eventDisplayName(eventType, occurrence.label) + allianceTagsText(occurrence);
  const isTimedOneDay = occurrence.lengthDays === 1 && !!occurrence.startTimeUtc;
  const key = eventHasInfo(occurrence) ? occurrence.key : '';
  const isInside = function (minute) { return minute >= window.start && minute < window.end; };
  const endsInside = function (minute) { return minute > window.start && minute < window.end; };
  const rows = [];
  if (occurrence.startTimeUtc && isInside(occurrence.startMinute)) {
    rows.push({ minute: occurrence.startMinute, isEnd: false, eventType: eventType, key: key, title: isTimedOneDay ? name : name + ' starts' });
  }
  if ((occurrence.endTimeUtc || showsLocalTime()) && endsInside(occurrence.endMinute)) {
    // An end at the reset (only inside a day with "Mine") always gets its row, unless the same event starts again then.
    rows.push({ minute: occurrence.endMinute, isEnd: true, isReset: !occurrence.endTimeUtc, priority: 0, eventType: eventType, key: key, title: name + ' ends' });
  }
  // The player's own slot (for example their Frostfire time), only for them.
  const myEntry = app.lookups.myEntriesByKey[occurrence.key];
  if (myEntry && myEntry.myTime) {
    const slotMinute = occurrence.startDay * MINUTES_PER_DAY + minutesFromTime(myEntry.myTime);
    if (isInside(slotMinute)) rows.push({ minute: slotMinute, isEnd: false, eventType: eventType, key: key, title: eventType.name + ' · my slot' });
  }
  (app.lookups.stepsByEventType[eventType.id] || []).forEach(function (step) {
    if (!step.startTimeUtc || Number(step.dayNumber) > occurrence.lengthDays) return;
    const stepDay = occurrence.startDay + Number(step.dayNumber) - 1;
    const start = stepDay * MINUTES_PER_DAY + minutesFromTime(step.startTimeUtc);
    const title = eventType.name + ' · ' + step.label;
    if (isInside(start)) rows.push({ minute: start, isEnd: false, eventType: eventType, key: key, title: title });
    if (step.endTimeUtc) {
      let end = stepDay * MINUTES_PER_DAY + minutesFromTime(step.endTimeUtc);
      if (end <= start) end += MINUTES_PER_DAY; // ends after midnight
      if (endsInside(end)) rows.push({ minute: end, isEnd: true, priority: 1, eventType: eventType, key: key, title: title + ' ends' });
    }
  });
  return rows;
}

// The fortress and stronghold battles inside a time window.
function fortMoments(window) {
  const fortressType = app.lookups.eventTypesById[FORTRESS_EVENT_ID];
  if (!fortressType) return [];
  const rows = [];
  for (let day = Math.floor(window.start / MINUTES_PER_DAY); day <= Math.floor((window.end - 1) / MINUTES_PER_DAY); day++) {
    fortBattlesOnDay(day).forEach(function (battle) {
      if (!battle.time) return;
      const minute = day * MINUTES_PER_DAY + minutesFromTime(battle.time);
      if (minute < window.start || minute >= window.end) return;
      const who = battle.allianceId ? ' · ' + allianceTagById(battle.allianceId) : '';
      rows.push({ minute: minute, isEnd: false, eventType: fortressType, allianceId: battle.allianceId, title: battle.fort + ' battle' + who });
    });
  }
  return rows;
}

// Timeline rows in time order. An end only gets its own row when nothing else starts at that time
// (the next row already shows it). Ends at the reset are the exception (see eventMoments).
function timelineOrder(rows) {
  const startMinutes = {};
  rows.forEach(function (row) { if (!row.isEnd) startMinutes[row.minute] = true; });
  const endMinutesShown = {};
  return rows
    .sort(function (a, b) { return (a.priority || 0) - (b.priority || 0); })
    .filter(function (row) {
      if (!row.isEnd) return true;
      if (row.isReset) {
        return !rows.some(function (other) { return !other.isEnd && other.minute === row.minute && other.eventType === row.eventType; });
      }
      if (startMinutes[row.minute] || endMinutesShown[row.minute]) return false;
      endMinutesShown[row.minute] = true;
      return true;
    })
    .sort(function (a, b) { return a.minute - b.minute || (a.isEnd ? 0 : 1) - (b.isEnd ? 0 : 1); });
}

// " · AAA, BBB" for alliance events (the alliances shown), empty for state events.
function allianceTagsText(occurrence) {
  if (isStateWide(occurrence)) return '';
  return ' · ' + occurrence.allianceIds.filter(allianceIsShown).map(allianceTagById).join(', ');
}

// Sort order for lists: by category, then the main event's order, the main before its parts, then the part's order.
function compareByFamily(typeA, typeB) {
  const categoryOrder = CATEGORIES.map(function (category) { return category.id; });
  const mainOf = function (eventType) { return isPartEvent(eventType) ? app.lookups.eventTypesById[eventType.partOf] : eventType; };
  const mainA = mainOf(typeA), mainB = mainOf(typeB);
  return categoryOrder.indexOf(mainA.category) - categoryOrder.indexOf(mainB.category) ||
    (Number(mainA.sortOrder) || 99) - (Number(mainB.sortOrder) || 99) ||
    mainA.id.localeCompare(mainB.id) ||
    (isPartEvent(typeA) ? 1 : 0) - (isPartEvent(typeB) ? 1 : 0) ||
    (Number(typeA.sortOrder) || 99) - (Number(typeB.sortOrder) || 99);
}

// One all-day item in the timeline: icon, name and a short line. When the event has something more to show,
// the item opens it (with an arrow); otherwise it is plain text.
function renderAllDayItem(occurrence, name, shortLine) {
  const eventType = occurrence.eventType;
  const color = eventType.color || '#AFC8F5';
  const noteText = [eventType.typeLabel, shortLine].filter(Boolean).join(' · ');
  const content = eventBadgeMarkup(eventType, '') +
    '<span class="all-day-text"><span class="event-title">' + (occurrence.isCancelled ? '<span class="cancelled-mark" aria-label="Cancelled">✕</span> ' : '') + escapeHtml(name) + '</span>' +
    (noteText ? '<span class="event-note">' + escapeHtml(noteText) + '</span>' : '') + '</span>';
  if (!eventHasInfo(occurrence)) return '<div class="all-day-item">' + content + '</div>';
  return '<button type="button" class="all-day-item" data-open-event="' + escapeHtml(occurrence.key) + '">' + content +
    '<span class="all-day-arrow" aria-hidden="true" style="color:' + color + '">›</span></button>';
}

// One row in a timeline: the time (on the clock chosen at the top), a coloured dot, and what happens.
// With isClickable it opens the event.
function renderMoment(row, isClickable) {
  const color = row.eventType.color || '#AFC8F5';
  const inside = '<span class="moment-time"><span class="time-main">' + escapeHtml(clockText(row.minute)) + '</span></span>' +
    '<span class="moment-rail"><span class="moment-dot" style="background:' + color + ';box-shadow:0 0 0 3px ' + colorWithAlpha(color, 0.25) + '"></span></span>' +
    '<span class="moment-body"><span class="moment-title">' + eventBadgeMarkup(row.eventType, 'small') +
    '<span class="moment-title-text">' + escapeHtml(row.title) + '</span></span></span>';
  if (!isClickable) return '<li class="moment"><div class="moment-row">' + inside + '</div></li>';
  return '<li class="moment"><button type="button" class="moment-button" data-open-event="' + escapeHtml(row.key) + '">' + inside + '</button></li>';
}

// Whether an event has anything to show beyond its name and dates. Without it there is no arrow and
// nothing to tap (admins can always open events to edit them).
// Every event can be opened (the details always show at least its dates and times).
function eventHasInfo(occurrence) {
  return !!(app.data && occurrence.scheduleId);
}

// The days and times of a span, as shown: { firstDay, lastDay, startTime, endTime } ('' = at midnight).
function spanParts(startMinute, endMinute) {
  const shownStart = shownMinute(startMinute);
  const shownEnd = shownMinute(endMinute);
  const endsAtMidnight = shownEnd % MINUTES_PER_DAY === 0;
  return {
    firstDay: Math.floor(shownStart / MINUTES_PER_DAY),
    lastDay: Math.floor(shownEnd / MINUTES_PER_DAY) - (endsAtMidnight ? 1 : 0),
    startTime: shownStart % MINUTES_PER_DAY === 0 ? '' : clockText(startMinute),
    endTime: endsAtMidnight ? '' : clockText(endMinute)
  };
}

// "Sat 7 Nov", "Mon 2 – Sat 7 Nov" or "Fri 30 Oct – Fri 6 Nov".
function dayRangeText(firstDay, lastDay) {
  if (firstDay === lastDay) return formatDayShort(firstDay);
  const first = partsFromDay(firstDay), last = partsFromDay(lastDay);
  if (first.month === last.month) return WEEKDAY_SHORT[first.weekday] + ' ' + first.date + ' – ' + formatDayShort(lastDay);
  return formatDayShort(firstDay) + ' – ' + formatDayShort(lastDay);
}

// The times part on its own: "12:00 – 17:00", "from 22:00", "until 10:00" or ''.
function spanTimeText(parts) {
  if (parts.startTime && parts.endTime) return parts.startTime + ' – ' + parts.endTime;
  if (parts.startTime) return 'from ' + parts.startTime;
  if (parts.endTime) return 'until ' + parts.endTime;
  return '';
}

// An event's dates and times on one line: "Mon 2 – Sat 7 Nov · until 10:00", "Sat 7 Nov 22:00 – Mon 9 Nov",
// "Sat 7 Nov · 12:00 – 17:00".
function spanText(startMinute, endMinute) {
  const parts = spanParts(startMinute, endMinute);
  if (parts.firstDay === parts.lastDay || !parts.startTime) {
    const timeText = spanTimeText(parts);
    return dayRangeText(parts.firstDay, parts.lastDay) + (timeText ? ' · ' + timeText : '');
  }
  return formatDayShort(parts.firstDay) + ' ' + parts.startTime + ' – ' + formatDayShort(parts.lastDay) + (parts.endTime ? ' ' + parts.endTime : '');
}

// Finds one date of an event by its key ("scheduleId|original date"), looking around the given day.
function findOccurrenceByKey(key, aroundDay) {
  return buildOccurrences(aroundDay - 70, aroundDay + 70).filter(function (occurrence) { return occurrence.key === key; })[0] || null;
}

// The event's own card, in two views. Timeline: the whole event (its days, phases and parts), the tapped day marked
// and its points or instructions open. Info: the event's notes, requirements and its own list (rules, rewards...).
// The button in the head switches between them; it only shows when the event has both.
function renderEventPanel(occurrence, day) {
  const eventType = occurrence.eventType;
  const schedule = app.lookups.schedulesById[occurrence.scheduleId];
  const change = occurrence.scheduleId === TRANSFER_SCHEDULE_ID ? null : changeFor(occurrence.scheduleId, occurrence.originalDay);
  const dayOfEvent = eventDayFor(occurrence, day);

  let html = '<button type="button" class="back-link" data-back-to-day>' +
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>' +
    'Back</button>';

  // Head: the icon, then 2 lines (name; dates and times); on the right the pencils.
  const pointsPencil = app.data.isAdmin ? pencilButton('data-edit-details="' + escapeHtml(eventType.id) + '"', 'Edit the points of this event') : '';
  html += '<section class="day-section glass event-page" style="' + tintedPanelStyle(eventType.color || '#AFC8F5') + '">' +
    '<div class="event-page-head">' + eventBadgeMarkup(eventType, 'large') +
    '<div class="event-page-title"><h2>' + (occurrence.isCancelled ? '<span class="cancelled-mark" aria-label="Cancelled">✕</span> ' : '') +
    escapeHtml(eventDisplayName(eventType, occurrence.label) + allianceTagsText(occurrence)) + '</h2>' +
    '<span class="event-note">' + escapeHtml(spanText(occurrence.startMinute, occurrence.endMinute)) + '</span></div>' +
    '<div class="row-buttons">{{VIEW_BUTTON}}' + (isStateWide(occurrence) ? editButtons(occurrence) + pointsPencil : '') + '</div></div>';

  // Who can join: the alliance and the player requirements, folded under the timeline next to the other lists.
  const requirementsFold = eventType.allianceRequirement || eventType.playerRequirement ?
    '<details class="points-list event-requirements" open><summary>Requirements</summary>' +
      (eventType.allianceRequirement ? '<p><b>Alliance:</b> ' + escapeHtml(eventType.allianceRequirement) + '</p>' : '') +
      (eventType.playerRequirement ? '<p><b>Player:</b> ' + escapeHtml(eventType.playerRequirement) + '</p>' : '') + '</details>' : '';

  // Notes, as plain text: the other name players use (faint), the event's note, and this date's note.
  const notes = [];
  if (eventType.otherName) notes.push('<p class="event-other-name">' + escapeHtml(eventType.otherName) + '</p>');
  if (eventType.notes) notes.push('<p class="event-info-line">' + escapeHtml(fillHeroNames(eventType.notes, occurrence.startDay)) + '</p>');
  if (change && change.note) notes.push('<p class="event-info-line">' + escapeHtml(change.note) + '</p>');

  // What players need to know about this date.
  const facts = [];
  if (eventType.typeLabel) facts.push(eventType.typeLabel);
  const opponentText = opponentsText(findOpponents(occurrence));
  if (opponentText) facts.push(opponentText);
  const resultText = resultSummary(occurrence);
  if (resultText) facts.push(resultText);
  if (occurrence.stateAllianceId) facts.push('State alliance: ' + allianceTagById(occurrence.stateAllianceId));
  if (occurrence.transferGroup) {
    const group = occurrence.transferGroup;
    facts.push('Expected group: states ' + group.fromState + '–' + group.toState + (group.generation ? ' · ' + group.generation : '') + (group.furnaceCap ? ' · FC ' + group.furnaceCap : ''));
  }
  if (occurrence.isCancelled) facts.push('Cancelled');
  if (occurrence.isChanged) facts.push('Date or time changed');
  if (facts.length) html += '<div class="event-facts">' + facts.map(function (fact) { return '<span class="event-fact">' + escapeHtml(fact) + '</span>'; }).join('') + '</div>';
  html += renderSlotPicker(occurrence);

  const foldStyle = ' style="--fold-color:' + escapeHtml(eventType.color || '#AFC8F5') + '"';
  // Timeline: the whole event; the points of each day open from its row's arrow (all closed at first).
  const tree = buildEventTree(occurrence, day);
  app.shownCurrentRow = tree.nowRowKey;
  const timelineHtml = tree.rows.length ? renderEventTree(tree) : '';
  // Info: the notes, Requirements, then the event's own list (Rules, Rewards...) when its points are not by day; all open.
  const pointsHtml = tree.hasPoints ? '' : renderPointsList(eventType, pointSourcesForDay(eventType.id, dayOfEvent), occurrence.startDay).replace('<details class="points-list">', '<details class="points-list" open>');
  // Then the Rules and Alliance Showdown's Total score. Predictions, Rewards and Missions are tabs of their own when the
  // event has more than one of these (Tundra Arms League, Alliance Showdown); otherwise they follow as folds.
  const tabs = [
    ['info', 'Info', requirementsFold + pointsHtml + renderRulesFold(eventType, occurrence.startDay) + renderScoreFold(occurrence)],
    ['predictions', 'Predictions', renderNotesFold(eventType, 'predictions', 'Predictions', occurrence.startDay)],
    ['rewards', 'Rewards', renderNotesFold(eventType, 'rewards', 'Rewards', occurrence.startDay) + renderRewardsFold(eventType)],
    ['missions', 'Missions', renderMissionsFold(eventType, occurrence.startDay)]
  ].filter(function (tab) { return tab[2]; });
  let foldsHtml = tabs.map(function (tab) { return tab[2]; }).join('');
  if (tabs.length > 1) {
    const shown = tabs.filter(function (tab) { return tab[0] === app.infoTabs[eventType.id]; })[0] || tabs[0];
    foldsHtml = '<div class="reward-tabs info-tabs" style="grid-template-columns:repeat(' + tabs.length + ',1fr)">' + tabs.map(function (tab) {
      return '<button type="button" class="reward-tab' + (tab === shown ? ' on' : '') + '" data-info-tab="' + escapeHtml(eventType.id + '|' + tab[0]) + '">' + escapeHtml(tab[1]) + '</button>';
    }).join('') + '</div>' +
      // Inside a tab, a fold that only repeats the tab's name has no title of its own.
      (shown[0] === 'info' ? shown[2] : shown[2].replace(/<details class="([^"]*)" open><summary>[^<]*<\/summary>/g, '<div class="$1 in-tab">').replace(/<\/details>/g, '</div>'));
  }
  const infoHtml = (notes.length ? '<div class="event-notes">' + notes.join('') + '</div>' : '') +
    (foldsHtml ? '<div class="event-folds"' + foldStyle + '>' + foldsHtml + '</div>' : '');
  const hasBothViews = !!timelineHtml && !!infoHtml;
  const view = hasBothViews ? app.cardView : timelineHtml ? 'timeline' : 'info';
  html += view === 'timeline' ? timelineHtml : infoHtml;
  html += '</section>';
  // The button shows where it takes you: the info icon on the timeline, the timeline icon on the info.
  const viewButton = !hasBothViews ? '' :
    '<button type="button" class="view-button" data-toggle-view aria-label="' + (view === 'timeline' ? 'Show info' : 'Show timeline') + '" title="' + (view === 'timeline' ? 'Info' : 'Timeline') + '">' +
    (view === 'timeline' ?
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r="0.8" fill="currentColor"/></svg>' :
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 3v18"/><circle cx="6" cy="6" r="2.2" fill="currentColor"/><circle cx="6" cy="18" r="2.2" fill="currentColor"/><path d="M6 12h5"/><circle cx="13" cy="12" r="1.8" fill="currentColor"/><path d="M11 6h9M11 18h9M16 12h4"/></svg>') +
    '</button>';
  html = html.replace('{{VIEW_BUTTON}}', viewButton);

  // Fortress Battles: Friday's battle of each fortress and stronghold.
  if (eventType.id === FORTRESS_EVENT_ID) html += renderFortBattlesSection(occurrence);

  // Each alliance's own times for this event in these days (legions, traps, sessions).
  if (isStateWide(occurrence)) {
    const allianceTimes = buildOccurrences(occurrence.startDay, occurrence.endDay).filter(function (other) {
      return other.eventType.id === eventType.id && !isStateWide(other) && other.allianceIds.some(allianceIsShown);
    }).sort(compareOccurrences);
    if (allianceTimes.length) {
      html += '<section class="day-section glass"><h3>Alliance times</h3>' + allianceTimes.map(function (other) {
        return '<button type="button" class="schedule-row" data-open-event="' + escapeHtml(other.key) + '"><span>' +
          escapeHtml(other.allianceIds.filter(allianceIsShown).map(allianceTagById).join(', ') + (other.label ? ' · ' + other.label : '')) + '</span>' +
          '<span class="schedule-when">' + escapeHtml(formatDayShort(shownDayOf(other.startMinute)) + (other.startTimeUtc ? ' · ' + clockText(other.startMinute) : '')) + '</span></button>';
      }).join('') + '</section>';
    }
  }

  return html;
}

/* ---------- The whole event as one timeline ----------
   Main line: the event's phases, or (when several events make one run, like SvS) each of them.
   Under each, on a short branch: its days (SvS prep themes, Showdown themes), steps and parts on the same hours
   (Castle Battle under SvS Battle). A part running for days inside its main event (Trade Route in Showdown)
   runs on its own line beside the main line. Every row shows its day and time on the left. */

function buildEventTree(occurrence, selectedDay) {
  const members = familyOccurrences(occurrence).filter(function (member) { return !member.isCancelled || member.key === occurrence.key; }).sort(compareOccurrences);
  const mainMembers = [], nestedParts = [], sideParts = [];
  members.forEach(function (member) {
    const host = isPartEvent(member.eventType) && members.filter(function (other) {
      return other !== member && other.startMinute <= member.startMinute && other.endMinute >= member.endMinute &&
        other.endMinute - other.startMinute > member.endMinute - member.startMinute;
    })[0];
    if (!host) mainMembers.push(member);
    else if (member.endMinute - member.startMinute > MINUTES_PER_DAY) sideParts.push(member);
    else nestedParts.push({ part: member, host: host });
  });

  const rows = [];
  const isSingle = mainMembers.length === 1;
  mainMembers.forEach(function (member) {
    const memberColor = timelineColor(member.eventType, '#AFC8F5');
    const memberColors = timelineColors(member.eventType, '#AFC8F5');
    const content = memberContent(member);
    const partsHere = nestedParts.filter(function (nested) { return nested.host === member; }).map(function (nested) {
      const part = nested.part;
      return { minute: part.startMinute, label: eventDisplayName(part.eventType, part.label), eventType: part.eventType, occurrence: part,
        color: timelineColor(part.eventType), points: pointSourcesForDay(part.eventType.id, 1), isCancelled: part.isCancelled };
    });
    const phases = app.lookups.phasesByEventType[member.eventType.id] || [];
    const phaseRows = phases.map(function (phase) {
      const span = phaseMinutes(member, phase);
      return span ? { minute: span.start, endMinute: span.end, label: phase.name, note: phase.note || '', eventType: member.eventType, occurrence: member, color: memberColor, points: [] } : null;
    }).filter(Boolean).sort(byMinute);

    if (isSingle) {
      if (phaseRows.length) {
        // Phases on the main line, the days and steps of each phase under it.
        const nestedRows = content.concat(partsHere);
        phaseRows.forEach(function (phaseRow, phaseIndex) {
          rows.push(Object.assign(phaseRow, { level: 0, lineColor: memberColor }));
          // A step at the very end of the last phase (Alliance Championship's rewards at 12:00) still belongs to it.
          const isLastPhase = phaseIndex === phaseRows.length - 1;
          nestedRows.filter(function (row) {
            return row.minute >= phaseRow.minute && (row.minute < phaseRow.endMinute || (isLastPhase && row.minute === phaseRow.endMinute));
          })
            .sort(byMinute).forEach(function (row) { rows.push(Object.assign(row, { level: 1, lineColor: memberColor })); });
        });
      } else {
        // No phases: the days themselves are the main line; parts on the same hours hang under them.
        content.forEach(function (row) { rows.push(Object.assign(row, { level: 0, lineColor: memberColor })); });
        partsHere.forEach(function (row) { rows.push(Object.assign(row, { level: 1, lineColor: memberColor })); });
      }
    } else {
      // Several events in one run (SvS): each on the main line, its days, phases and parts under it.
      const hasDays = content.some(function (row) { return row.dayNumber; });
      rows.push({ minute: member.startMinute, label: eventDisplayName(member.eventType, member.label), eventType: member.eventType, occurrence: member,
        // A fading timeline colour: the dot takes the first colour and the line below it fades into the second.
        color: memberColors.start, lineColor: memberColors.isFade ? 'linear-gradient(to bottom, ' + memberColors.start + ', ' + memberColors.end + ' ' + HINT_SHARE + '%)' : memberColor,
        lineEnd: memberColors.isFade ? memberColor : '', arrowColor: memberColor, level: 0, isCancelled: member.isCancelled,
        points: hasDays ? [] : pointSourcesForDay(member.eventType.id, 1) });
      phaseRows.concat(content, partsHere).sort(byMinute).forEach(function (row) { rows.push(Object.assign(row, { level: 1, lineColor: memberColor })); });
    }
  });

  // Parts open only at certain times (Tundra Arms League's predictions): each on its own line beside the main line,
  // drawn only while it is open, with its logo where each opening starts. A part marked by its openings' ends
  // (Match Prediction) has a row where each opening starts (its name, the opening's label under it) and one where it
  // closes (the time only); a part marked by labels (Champion Prediction) has a row per opening ("Champion Prediction
  // ×16") and its line ends at the next row.
  const openingSides = sideParts.filter(function (part) { return partOpenings(part); }).slice(0, 2);
  openingSides.forEach(function (part) {
    const name = part.eventType.name;
    const labelled = part.eventType.windowMark === 'label';
    const color = timelineColor(part.eventType, '#E8D9A8');
    partOpenings(part).forEach(function (opening) {
      rows.push({ minute: opening.start, label: labelled ? name + (opening.label ? ' ' + opening.label : '') : name, subLabel: labelled ? '' : opening.label,
        eventType: part.eventType, occurrence: part, level: 1, isSideRow: true, openingPart: part.key, openingStart: opening.start, color: color, points: [] });
      if (!labelled) {
        rows.push({ minute: opening.end, label: '', eventType: part.eventType, occurrence: part, level: 1, isSideRow: true, openingPart: part.key, openingEnd: opening.end, color: color, points: [] });
      }
    });
  });
  // A part running beside the event (Trade Route): its own line beside the main line, with rows for where it starts
  // (unless the event starts then too), its steps, and where it ends.
  const side = openingSides.length ? null : sideParts[0] || null;
  const sideColor = side ? timelineColor(side.eventType, '#E8D9A8') : '';
  if (side) {
    if (!rows.some(function (row) { return row.minute === side.startMinute; })) {
      rows.push({ minute: side.startMinute, label: (side.eventType.shortName || side.eventType.name) + ' starts', eventType: side.eventType, occurrence: side, level: 1, isSideRow: true, color: sideColor, points: [] });
    }
    // Its timed steps (Trade Route: no more trucks after Sunday's reset) hang off its line.
    (app.lookups.stepsByEventType[side.eventType.id] || []).forEach(function (step) {
      if (!step.startTimeUtc) return;
      const minute = (side.startDay + Number(step.dayNumber) - 1) * MINUTES_PER_DAY + minutesFromTime(step.startTimeUtc);
      if (minute <= side.startMinute || minute >= side.endMinute) return;
      rows.push({ minute: minute, label: step.label, note: step.note || '', eventType: side.eventType, occurrence: side, level: 1, isSideRow: true, isSideStep: true, color: sideColor, points: [] });
    });
    rows.push({ minute: side.endMinute, label: '', eventType: side.eventType, occurrence: side, level: 1, isSideRow: true, isSideEnd: true, color: sideColor, points: [] });
  }
  // Every timeline ends with a cap on its line at the event's end (Showdown: Sunday 12:00), with the time and no words.
  const lastMember = mainMembers.slice().sort(function (a, b) { return a.endMinute - b.endMinute; }).pop();
  if (lastMember && rows.length) {
    const endColor = timelineColor(lastMember.eventType, '#AFC8F5');
    rows.push({ minute: lastMember.endMinute, label: '', eventType: lastMember.eventType,
      occurrence: lastMember, level: 0, isEndRow: true, color: endColor, lineColor: endColor, points: [] });
  }

  // Keep the main-line order; rows of one main row stay under it.
  const ordered = [];
  rows.forEach(function (row, index) { row.order = index; });
  const sorted = isSingle && !rows.some(function (row) { return row.level === 0 && row.endMinute; }) ? rows.slice().sort(function (a, b) { return a.minute - b.minute || a.level - b.level || a.order - b.order; }) : rows.slice();
  sorted.forEach(function (row) {
    if (!row.isSideRow) { ordered.push(row); return; }
    // Side rows go in time order among the rest.
    let at = ordered.length;
    while (at > 0 && ordered[at - 1].minute > row.minute) at--;
    ordered.splice(at, 0, row);
  });
  // Line colours: rows of side rows follow the row above them.
  let lastLine = (ordered[0] && ordered[0].lineColor) || occurrence.eventType.color;
  ordered.forEach(function (row, index) {
    if (row.lineColor) lastLine = row.lineColor; else row.lineColor = lastLine;
    if (!row.color) row.color = row.lineColor;
    // After a fading line, the next row's line goes on in its last colour.
    const above = ordered[index - 1];
    if (above && above.lineEnd) row.lineAbove = above.lineEnd;
  });

  // Each row's key: its event's occurrence and its time.
  ordered.forEach(function (row) { row.key = (row.occurrence ? row.occurrence.key : occurrence.key) + '|' + row.minute; });
  // The marked row: the one tapped, else, while the event runs, the latest row that has started (not a part's own line).
  const picked = app.pickedRow ? ordered.filter(function (row) { return row.key === app.pickedRow; })[0] : null;
  const runStart = members.reduce(function (earliest, member) { return Math.min(earliest, member.startMinute); }, Infinity);
  const runEnd = members.reduce(function (latest, member) { return Math.max(latest, member.endMinute); }, -Infinity);
  const now = nowMinute();
  const isRunning = now >= runStart && now < runEnd;
  const startedRows = isRunning ? ordered.filter(function (row) { return row.minute <= now && !row.isSideRow && !row.isEndRow && !row.openingPart; }) : [];
  const current = picked || startedRows[startedRows.length - 1] || null;
  if (current) current.isCurrent = true;
  const nowRow = startedRows[startedRows.length - 1];

  return {
    rows: ordered,
    side: side ? { part: side, color: sideColor } : null,
    openingSides: openingSides,
    fadeEventType: isSingle && lastMember && !lastMember.eventType.timelineColor ? lastMember.eventType : null,
    nowRowKey: nowRow ? nowRow.key : '',
    hasPoints: ordered.some(function (row) { return row.points && row.points.length; })
  };
}

// An event's colour in the event timeline. A timeline colour written as "#CF7F86>#5FB8A8" fades: its line starts with
// the first colour and turns into the second (Field Triage: SvS Battle's red to teal). Without one: the event's colour.
function timelineColors(eventType, fallback) {
  const parts = String(eventType.timelineColor || '').split('>').map(function (part) { return part.trim(); }).filter(Boolean);
  const end = parts[parts.length - 1] || eventType.color || fallback;
  return { start: parts[0] || end, end: end, isFade: parts.length > 1 };
}

function timelineColor(eventType, fallback) {
  return timelineColors(eventType, fallback).end;
}

function byMinute(a, b) {
  return a.minute - b.minute;
}

// The rows inside one event: each day that has a name or a note (SvS prep themes, Showdown themes) with that day's points,
// steps with a time, and the player's own slot.
function memberContent(member) {
  const eventType = member.eventType;
  const rows = [];
  for (let dayNumber = 1; dayNumber <= member.lengthDays; dayNumber++) {
    const dayPoints = pointSourcesForDay(eventType.id, dayNumber);
    const labels = [];
    const dayName = dayPoints.filter(function (source) { return source.dayNumber && source.dayName; }).map(function (source) { return source.dayName; })[0];
    if (dayName) labels.push(dayName);
    stepsForDay(eventType.id, dayNumber).filter(function (step) { return !step.startTimeUtc; }).forEach(function (step) {
      if (labels.indexOf(step.label) === -1) labels.push(step.label);
    });
    const hasOwnPoints = dayPoints.some(function (source) { return source.dayNumber; });
    if (!labels.length && !hasOwnPoints) continue;
    rows.push({ minute: dayNumber === 1 ? member.startMinute : (member.startDay + dayNumber - 1) * MINUTES_PER_DAY,
      label: labels.join(' · ') || 'Day ' + dayNumber, eventType: eventType, occurrence: member, dayNumber: dayNumber,
      points: hasOwnPoints ? dayPoints : [], rewardsHtml: renderDayChests(eventType.id, dayNumber) });
  }
  (app.lookups.stepsByEventType[eventType.id] || []).forEach(function (step) {
