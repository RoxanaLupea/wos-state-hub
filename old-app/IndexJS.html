<script>
'use strict';

/* ================================================================== */
/* Fixed lists                                                         */
/* ================================================================== */

const CATEGORIES = [

  { id: 'alliance', label: 'Alliance' },
  { id: 'personal', label: 'Personal' },

const OLD_CATEGORY_IDS = { battle: 'alliance', timed: 'alliance', minigames: 'personal', shops: 'deals', transfer: 'state' };

const STORAGE_KEYS = { sessionToken: 'wos1458.sessionToken', preferences: 'wos1458.preferences' };
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MONTH_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WEEKDAY_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

const TRANSFER_SCHEDULE_ID = 'transfers';

// A State Transfer runs 7 days, starting the day after the SvS Battle: pre-transfer, invitational, open.
const TRANSFER_LENGTH_DAYS = 7;
const FORT_NAMES = ['F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12', 'SH1', 'SH2', 'SH3', 'SH4'];

const PHONE_DETAILS_BREAKPOINT = 1000;
// Only Brothers in Arms (the Kill Event) can be cancelled for a date; it then shows with an X.
const CANCELLABLE_EVENT_ID = 'bia';
// Room under a bar for the line of a part running inside it (Trade Route under Alliance Showdown), in px.
const BAR_TRAIL_SPACE = 7;

// Event icons (drawn with lines), used until an image is added to the repo.
const ICONS = {
  swords: '<path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M9.5 17.5L21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4"/>',
  castle: '<path d="M4 21V8l2 1V5l3 1V3h6v3l3-1v4l2-1v13zM10 21v-4h4v4"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  crown: '<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>',
  flag: '<path d="M5 21V4h12l-2 4 2 4H5"/>',
  factory: '<path d="M3 21V10l5 3v-3l5 3V4h6v17z"/>',
  mountain: '<path d="M2 20l6-11 4 6 3-4 7 9z"/>',
  paw: '<circle cx="6" cy="10" r="2"/><circle cx="10" cy="6" r="2"/><circle cx="14" cy="6" r="2"/><circle cx="18" cy="10" r="2"/><path d="M8 17c0-3 2-5 4-5s4 2 4 5c0 2-2 3-4 3s-4-1-4-3z"/>',
  skull: '<path d="M12 3a7 7 0 0 0-7 7c0 2.5 1.3 4.5 3 5.6V19h8v-3.4c1.7-1.1 3-3.1 3-5.6a7 7 0 0 0-7-7z"/><circle cx="9.5" cy="10.5" r="1.3"/><circle cx="14.5" cy="10.5" r="1.3"/><path d="M10 19v2M14 19v2"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
  snow: '<path d="M12 2v20M4 7l16 10M4 17L20 7M9 4l3 2 3-2M9 20l3-2 3 2"/>',
  star: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
  flame: '<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"/>',
  dragon: '<path d="M4 20c2-6 6-9 11-9l3-4 1 5-3 2c0 4-3 6-7 6"/><path d="M15 11l-2-5 4 2"/><circle cx="16.5" cy="9.5" r="0.6"/>',
  arrows: '<path d="M4 8h14l-4-4M20 16H6l4 4"/>',
  gift: '<rect x="3" y="9" width="18" height="12" rx="1"/><path d="M12 9v12M3 13h18M12 9C10 5 6 5 7 8M12 9c2-4 6-4 5-1"/>',
  trophy: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  wheel: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 3v7M12 14v7M3 12h7M14 12h7M5.6 5.6l5 5M13.4 13.4l5 5M18.4 5.6l-5 5M10.6 13.4l-5 5"/>'
};

/* ================================================================== */
/* App state                                                           */
/* ================================================================== */

const app = {
  data: null,
  sessionToken: '',
  page: 'calendar',
  view: 'month',
  focusDay: 0,
  selectedDay: 0,
  categories: DEFAULT_CATEGORIES.slice(),
  hiddenEvents: [],             // events unticked in a filter's list, as "category|event id" (all ticked by default)
  followedTimes: [],            // alliance times this player follows (schedule ids): only these show, as logos at their time
  editingTime: '',              // the alliance time an admin is changing in place (schedule id)
  openFilterList: '',           // the category whose list of events is open under its filter ('' = none)
  myAllianceId: '',
  adminTab: 'schedules',
  lookups: emptyLookups(),
  adminPointsEventTypeId: 'svs-prep',
  fortressSeasonStartDay: null, // the season shown on the Fortress page (null = the current one)
  fortressPhaseDay: null, // the battle day of the phase shown on the Fortress page (null = this week's)
  fortressEditing: false, // admins: the Fortress cards show the alliance and time fields
  profileId: '',
  openEventKey: '',             // the event open in day details and marked in the calendar ('' = the day's timeline)
  eventScope: 'day',            // 'day' = the open event on the selected day; 'whole' = the whole event
  cardView: 'timeline',         // the open event's card: 'timeline' or 'info' (notes, requirements, rules...)
  openScope: '',                // the scope actually shown ('whole' for one-day events), used to mark the bars
  openMinute: null,             // where the open event was tapped (picks its day, phase or part); null = the selected day
  openedFrom: 'calendar',       // where the open event was opened: 'calendar' (Back closes it) or 'day' (Back goes to the day)
  pickedRow: '',
  yearPick: '',                 // the year view's picked run ("SvS|day"); '' = the one running now, else the next                // the timeline row tapped in the open event ("occurrence key|minute"); '' = the current moment
  shownCurrentRow: '',          // the timeline row marked as now when the event was last drawn (to redraw when it changes)
  selection: null,              // what is lit in the calendar: { key, start, end } (an event) or { start, end } (a day)
  timeMode: 'utc',              // 'utc' = game time; 'local' = this device's clock (days follow it too)
  shownToday: 0,                // today as last drawn, to redraw when the day changes
  rewardTabs: {},               // event id -> the Rewards tab shown (daily, star, ranking, tier...)
  infoTabs: {},                 // event id -> the tab of its info shown (info, predictions, rewards, missions)
  rewardBands: {},              // "event id|list" -> the Star Rating band or tier shown
  scoreAllianceId: '',          // the alliance whose Alliance Showdown score is shown ('' = mine)
  adminStepsEventTypeId: 'icefire-league',
  adminPhasesEventTypeId: 'alliance-championship'
};

/* ================================================================== */
/* Start                                                               */
/* ================================================================== */

document.addEventListener('DOMContentLoaded', startApp);

function startApp() {
  app.sessionToken = readStorage(STORAGE_KEYS.sessionToken) || '';
  applyPreferences(safeJson(readStorage(STORAGE_KEYS.preferences)));
  app.focusDay = todayDay();
  app.selectedDay = app.focusDay;
  attachStaticHandlers();
  startClock();
  renderCalendarPage();
  // Names are measured to decide what fits; measure again once the font has loaded.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (app.page === 'calendar') renderCalendarPage(); });

  // Coming back from "Sign in with Google" (?signin=...), or a test link with ?admin=... (made with makeTestAdminLink).
  readLinkParameters()
    .then(function (parameters) {
      if (parameters.signin) {
        return callServer('signInWithGoogle', parameters.signin).then(function (result) {
          app.sessionToken = result.sessionToken;
          writeStorage(STORAGE_KEYS.sessionToken, result.sessionToken);
          // The sign-in note is used up: take it out of the address so a reload does not try it again.
          if (window.google && google.script && google.script.history) google.script.history.replace(null, {}, '');
          showToast('Signed in as ' + result.data.me.email + '.');
          return result.data;
        }, function (error) {
          showError(error);
          return callServer('getAllData', app.sessionToken);
        });
      }
      const adminKey = parameters.admin;
      if (!adminKey) return callServer('getAllData', app.sessionToken);
      return callServer('signInWithAdminLink', adminKey).then(function (result) {
        app.sessionToken = result.sessionToken;
        writeStorage(STORAGE_KEYS.sessionToken, result.sessionToken);
        return result.data;
      }, function (error) {
        // A wrong or old link: say so, and open the app as usual.
        showError(error);
        return callServer('getAllData', app.sessionToken);
      });
    })
    .then(function (data) {
      if (app.sessionToken && !data.me) {
        // The saved sign-in has expired.
        app.sessionToken = '';
        removeStorage(STORAGE_KEYS.sessionToken);
      }
      receiveData(data);
      if (data.me && data.me.preferences) applyPreferences(data.me.preferences);
      else if (data.me) savePreferences(); // first sign-in: keep the filters this device already had
      renderEverything();
    })
    .catch(showError);
}

// Back to the top of the page. On computers the window does not scroll: each page (and the calendar's
// two boxes) scrolls on its own.
function scrollPagesToTop() {
  window.scrollTo(0, 0);
  document.querySelectorAll('.app > .page, #calendarPanel, #dayPanel').forEach(function (element) { element.scrollTop = 0; });
}

// The parameters of the app's link (?signin=..., ?admin=...), or {} outside Apps Script.
function readLinkParameters() {
  return new Promise(function (resolve) {
    if (!(window.google && google.script && google.script.url)) { resolve({}); return; }
    google.script.url.getLocation(function (location) {
      resolve((location && location.parameter) || {});
    });
  });
}

// Google does not allow signing in inside apps' own browsers (Discord, WhatsApp, Line, the game's chat...).
function isInsideAppBrowser() {
  const agent = navigator.userAgent || '';
  return /FBAN|FBAV|Instagram|Line\/|WhatsApp|Discord|MicroMessenger|KAKAOTALK|Snapchat|; wv\)|WebView/i.test(agent) ||
    (/iPhone|iPad/.test(agent) && !/Safari/.test(agent));
}

function emptyLookups() {
  return {
    eventTypesById: {}, alliancesById: {}, changesBySchedule: {}, transferGroupsByDate: {}, pointSourcesByEventType: {}, stepsByEventType: {},
    partsByMain: {},            // main event id -> its parts
    scheduledEventTypes: {},    // event id -> true when it has at least one schedule
    phasesByEventType: {},      // event id -> its phases, in day order
    schedulesById: {},
    myEntriesByKey: {},         // "scheduleId|originalDate" -> the signed-in player's own slot and rank
    itemsById: {},              // reward item id -> the item (name, picture, small top text)
    rewardsByEventType: {}      // event id -> its reward rows, in order
  };
}

// Stores fresh data from the server and rebuilds the quick lookups.
function receiveData(data) {
  app.data = data;
  const lookups = emptyLookups();
  data.eventTypes.forEach(function (eventType) { lookups.eventTypesById[eventType.id] = eventType; });
  data.eventTypes.forEach(function (eventType) {
    if (!eventType.partOf || !lookups.eventTypesById[eventType.partOf]) return;
    if (!lookups.partsByMain[eventType.partOf]) lookups.partsByMain[eventType.partOf] = [];
    lookups.partsByMain[eventType.partOf].push(eventType);
  });
  data.alliances.forEach(function (alliance) { lookups.alliancesById[alliance.id] = alliance; });
  (data.eventPhases || []).slice()
    .sort(function (a, b) { return Number(a.fromDay) - Number(b.fromDay) || (Number(a.sortOrder) || 0) - (Number(b.sortOrder) || 0); })
    .forEach(function (phase) {
      if (!lookups.phasesByEventType[phase.eventTypeId]) lookups.phasesByEventType[phase.eventTypeId] = [];
      lookups.phasesByEventType[phase.eventTypeId].push(phase);
    });
  (data.myEntries || []).forEach(function (entry) { lookups.myEntriesByKey[entry.scheduleId + '|' + entry.originalDate] = entry; });
  data.schedules.forEach(function (schedule) {
    lookups.schedulesById[schedule.id] = schedule;
    lookups.scheduledEventTypes[schedule.eventTypeId] = true;
  });
  data.dateChanges.forEach(function (change) {
    if (!lookups.changesBySchedule[change.scheduleId]) lookups.changesBySchedule[change.scheduleId] = {};
    lookups.changesBySchedule[change.scheduleId][change.originalDate] = change;
  });
  data.transferGroups.forEach(function (group) { lookups.transferGroupsByDate[group.transferDate] = group; });
  (data.pointSources || []).slice()
    .sort(function (a, b) { return (Number(a.sortOrder) || 0) - (Number(b.sortOrder) || 0); })
    .forEach(function (source) {
      if (!lookups.pointSourcesByEventType[source.eventTypeId]) lookups.pointSourcesByEventType[source.eventTypeId] = [];
      lookups.pointSourcesByEventType[source.eventTypeId].push(source);
    });
  (data.eventSteps || []).slice()
    .sort(function (a, b) {
      return (Number(a.dayNumber) || 0) - (Number(b.dayNumber) || 0) || minutesFromTime(a.startTimeUtc) - minutesFromTime(b.startTimeUtc) ||
        (Number(a.sortOrder) || 0) - (Number(b.sortOrder) || 0);
    })
    .forEach(function (step) {
      if (!lookups.stepsByEventType[step.eventTypeId]) lookups.stepsByEventType[step.eventTypeId] = [];
      lookups.stepsByEventType[step.eventTypeId].push(step);
    });
  (data.items || []).forEach(function (item) { lookups.itemsById[item.id] = item; });
  (data.rewards || []).slice()
    .sort(function (a, b) { return (Number(a.sortOrder) || 0) - (Number(b.sortOrder) || 0); })
    .forEach(function (row) {
      if (!lookups.rewardsByEventType[row.eventTypeId]) lookups.rewardsByEventType[row.eventTypeId] = [];
      lookups.rewardsByEventType[row.eventTypeId].push(row);
    });
  app.lookups = lookups;
  if (data.me && data.me.allianceId) app.myAllianceId = data.me.allianceId;
}

// The id of the Fortress Battles event (its Friday holds one battle per fortress and stronghold).
const FORTRESS_EVENT_ID = 'fortress-battles';

function renderEverything() {
  const isAdmin = !!(app.data && app.data.isAdmin);
  document.querySelectorAll('[data-page="admin"]').forEach(function (button) { button.hidden = !isAdmin; });
  if (!isAdmin && app.page === 'admin') app.page = 'calendar';
  document.getElementById('meButton').textContent = app.data && app.data.me ? (app.data.me.name || 'Me') : 'Sign in';
  document.querySelectorAll('[data-page]').forEach(function (button) {
    button.setAttribute('aria-current', button.getAttribute('data-page') === app.page ? 'page' : 'false');
  });
  PAGES.forEach(function (pageName) { document.getElementById(pageName + 'Page').hidden = app.page !== pageName; });
  if (app.page === 'calendar') renderCalendarPage();
  if (app.page === 'fortress') renderFortressPage();
  if (app.page === 'alliances') renderAlliancesPage();
  if (app.page === 'admin') renderAdminPage();
}

function attachStaticHandlers() {
  document.getElementById('previousButton').addEventListener('click', function () { moveFocus(-1); });
  document.getElementById('nextButton').addEventListener('click', function () { moveFocus(1); });
  document.getElementById('todayButton').addEventListener('click', function () {
    app.focusDay = todayDay();
    app.selectedDay = app.focusDay;
    app.openEventKey = '';
    app.openMinute = null;
    renderCalendarPage();
    document.getElementById('calendarPanel').scrollTop = 0;
  });
  document.querySelectorAll('[data-time-mode]').forEach(function (button) {
    button.addEventListener('click', function () {
      app.timeMode = button.getAttribute('data-time-mode');
      savePreferences();
      updateClock();
      renderEverything();
    });
  });
  // Bars sit at their real times, measured from the day boxes: measure again when the window changes size.
  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (app.page !== 'calendar' || app.view === 'year') return;
      renderCalendarPage();
    }, 150);
  });
  document.querySelectorAll('.segmented [data-view]').forEach(function (button) {
    button.addEventListener('click', function () {
      app.view = button.getAttribute('data-view');
      savePreferences();
      renderCalendarPage();
      document.getElementById('calendarPanel').scrollTop = 0;
    });
  });
  document.querySelectorAll('[data-page]').forEach(function (button) {
    button.addEventListener('click', function () {
      app.page = button.getAttribute('data-page');
      renderEverything();
      scrollPagesToTop();
    });
  });
  document.getElementById('meButton').addEventListener('click', openMeDialog);
  document.querySelector('[data-action="me"]').addEventListener('click', openMeDialog);

  document.getElementById('categoryChips').addEventListener('click', function (event) {
    // Taps here never close the open list (the page-wide tap below does that elsewhere).
    event.stopPropagation();
    // The arrow opens (or closes) the category's list of events.
    const arrow = event.target.closest('[data-filter-list]');
    if (arrow) {
      const category = arrow.getAttribute('data-filter-list');
      app.openFilterList = app.openFilterList === category ? '' : category;
      renderCategoryChips();
      return;
    }
    // A tick in the list shows or hides that event.
    const tick = event.target.closest('[data-filter-event]');
    if (tick) {
      const key = tick.getAttribute('data-filter-event');
      const position = app.hiddenEvents.indexOf(key);
      if (position === -1) app.hiddenEvents.push(key); else app.hiddenEvents.splice(position, 1);
      savePreferences();
      renderCalendarPage();
      return;
    }
    // "Untick all" / "Tick all" for the open list.
    const all = event.target.closest('[data-filter-all]');
    if (all) {
      const category = all.getAttribute('data-filter-all');
      const keys = filterListEvents(category).map(function (eventType) { return filterKey(category, eventType); });
      const allShown = keys.every(function (key) { return app.hiddenEvents.indexOf(key) === -1; });
      app.hiddenEvents = app.hiddenEvents.filter(function (key) { return keys.indexOf(key) === -1; });
      if (allShown) app.hiddenEvents = app.hiddenEvents.concat(keys);
      savePreferences();
      renderCalendarPage();
      return;
    }
    const chip = event.target.closest('[data-category]');
    if (!chip) return;
    const category = chip.getAttribute('data-category');
    const position = app.categories.indexOf(category);
    if (position === -1) app.categories.push(category);
    else app.categories.splice(position, 1);
    savePreferences();
    renderCalendarPage();
  });
  // A tap anywhere else closes an open list of events.
  document.addEventListener('click', function (event) {
    if (!app.openFilterList) return;
    app.openFilterList = '';
    renderCategoryChips();
  });

  document.getElementById('calendarPanel').addEventListener('click', function (event) {
    const monthButton = event.target.closest('[data-open-month]');
    if (monthButton) {
      app.view = 'month';
      app.focusDay = Number(monthButton.getAttribute('data-open-month'));
      renderCalendarPage();
      return;
    }
    // Year view: a line picks its event's run for the side panel (the view stays the year).
    const yearRun = event.target.closest('[data-year-run]');
    if (yearRun) {
      app.yearPick = yearRun.getAttribute('data-year-run');
      renderCalendarPage();
      const panel = document.getElementById('dayPanel');
      if (window.innerWidth < PHONE_DETAILS_BREAKPOINT) panel.classList.add('open');
      panel.scrollTop = 0;
      return;
    }
    // A white line on a bar: show (or hide) its time.
    const markButton = event.target.closest('.bar-mark');
    if (markButton) {
      showMarkTime(markButton);
      return;
    }
    const eventButton = event.target.closest('[data-open-event]');
    if (eventButton) {
      // The day under the pointer (a long bar covers several days), else the bar's own day.
      const dayBoxUnder = document.elementsFromPoint(event.clientX, event.clientY).filter(function (element) { return element.classList.contains('day-box'); })[0];
      const dayHolder = dayBoxUnder || eventButton.closest('[data-day]') || eventButton;
      const day = Number(dayHolder.getAttribute('data-day'));
      // The time under the pointer decides what is selected: that day of the event, its phase, or the part tapped.
      let minute = null;
      if (eventButton.classList.contains('bar-inside')) minute = Number(eventButton.getAttribute('data-start-minute'));
      else if (dayBoxUnder) {
        const rect = dayBoxUnder.getBoundingClientRect();
        const fraction = Math.min(0.999, Math.max(0, (event.clientX - rect.left) / rect.width));
        const window = dayWindow(day);
        minute = window.start + Math.floor(fraction * (window.end - window.start));
      }
      openEvent(eventButton.getAttribute('data-open-event'), day, 'day', minute);
      return;
    }
    const dayButton = event.target.closest('[data-day]');
    if (!dayButton) return;
    const day = Number(dayButton.getAttribute('data-day'));
    if (app.view === 'year') {
      app.view = 'month';
      app.focusDay = day;
    }
    selectDay(day);
  });

  // An admin's time field in "Bear ×4" saves when it is left (or on Enter); Escape leaves it unchanged.
  document.getElementById('dayPanel').addEventListener('focusout', function (event) {
    if (event.target.matches('[data-time-input]') && app.editingTime) saveTimeFromInput(event.target);
  });
  document.getElementById('dayPanel').addEventListener('keydown', function (event) {
    if (!event.target.matches('[data-time-input]')) return;
    if (event.key === 'Escape') { app.editingTime = ''; renderDayPanel(); return; }
    if (event.key === 'Enter') event.target.blur();
  });
  document.getElementById('dayPanel').addEventListener('click', function (event) {
    if (event.target.closest('[data-close-day]')) {
      document.getElementById('dayPanel').classList.remove('open');
      return;
    }
    // An alliance time in "Bear ×4": tick to follow it, or (admins) change its time in place.
    const followButton = event.target.closest('[data-follow-time]');
    if (followButton) {
      const scheduleId = followButton.getAttribute('data-follow-time');
      const position = app.followedTimes.indexOf(scheduleId);
      if (position === -1) app.followedTimes.push(scheduleId); else app.followedTimes.splice(position, 1);
      savePreferences();
      renderCalendarPage();
      return;
    }
    const editTimeButton = event.target.closest('[data-edit-time]');
    if (editTimeButton) {
      app.editingTime = editTimeButton.getAttribute('data-edit-time');
      renderDayPanel();
      const input = document.querySelector('#dayPanel [data-time-input]');
      if (input) input.focus();
      return;
    }
    // Year view: an event in "Now and next" shows its steps.
    const yearRunRow = event.target.closest('[data-year-run]');
    if (yearRunRow) {
      app.yearPick = yearRunRow.getAttribute('data-year-run');
      renderCalendarPage();
      return;
    }
    const changeButton = event.target.closest('[data-change-occurrence]');
    if (changeButton) openOccurrenceDialog(changeButton.getAttribute('data-change-occurrence'));
    // Frostfire and other events with slots: tap a time to pick it, tap it again to unpick.
    const slotButton = event.target.closest('[data-pick-slot]');
    if (slotButton) {
      pickMySlot(slotButton.getAttribute('data-pick-slot'), slotButton.getAttribute('data-slot-time'));
      return;
    }
    if (event.target.closest('[data-sign-in-for-slot]')) {
      openMeDialog();
      return;
    }
    const addButton = event.target.closest('[data-add-on-day]');
    if (addButton) openScheduleDialog('', textFromDay(Number(addButton.getAttribute('data-add-on-day'))));
    const scheduleButton = event.target.closest('[data-admin-action-from-day="edit-schedule"]');
    if (scheduleButton) openScheduleDialog(scheduleButton.getAttribute('data-id'));
    const detailsButton = event.target.closest('[data-edit-details]');
    if (detailsButton) {
      // Details (what gives points...) are edited in Admin → Points, opened on this event.
      app.adminPointsEventTypeId = detailsButton.getAttribute('data-edit-details');
      app.adminTab = 'points';
      app.page = 'admin';
      document.getElementById('dayPanel').classList.remove('open');
      renderEverything();
      scrollPagesToTop();
      return;
    }
    const fortButton = event.target.closest('[data-fort-cell]');
    if (fortButton) {
      const fortParts = fortButton.getAttribute('data-fort-cell').split('|');
      openFortCellDialog(fortParts[0], fortParts[1], fortParts[2]);
      return;
    }
    // An event's info: the tab shown (Info, Predictions, Rewards, Missions).
    const infoTab = event.target.closest('[data-info-tab]');
    if (infoTab) {
      const infoParts = infoTab.getAttribute('data-info-tab').split('|');
      app.infoTabs[infoParts[0]] = infoParts[1];
      renderCalendarPage();
      return;
    }
    // Rewards: the tab (Daily, Star, Ranking...) and the Star Rating band or tier shown.
    const rewardTab = event.target.closest('[data-reward-tab]');
    if (rewardTab) {
      const tabParts = rewardTab.getAttribute('data-reward-tab').split('|');
      app.rewardTabs[tabParts[0]] = tabParts[1];
      renderCalendarPage();
      return;
    }
    const rewardBand = event.target.closest('[data-reward-band]');
    if (rewardBand) {
      const bandParts = rewardBand.getAttribute('data-reward-band').split('|');
      app.rewardBands[bandParts[0] + '|' + bandParts[1]] = bandParts[2];
      renderCalendarPage();
      return;
    }
    // Alliance Showdown's Total score: which alliance, and the admins' pencil.
    const scoreAlliance = event.target.closest('[data-score-alliance]');
    if (scoreAlliance) {
      app.scoreAllianceId = scoreAlliance.getAttribute('data-score-alliance');
      renderCalendarPage();
      return;
    }
    const scoreEdit = event.target.closest('[data-edit-score]');
    if (scoreEdit) {
      const scoreParts = scoreEdit.getAttribute('data-edit-score').split('|');
      openScoreDialog(scoreParts[0], scoreParts[1], scoreParts[2]);
      return;
    }
    // The button in an event card's head: switches between its timeline and its info.
    if (event.target.closest('[data-toggle-view]')) {
      app.cardView = app.cardView === 'info' ? 'timeline' : 'info';
      renderCalendarPage();
      document.getElementById('dayPanel').scrollTop = 0;
      return;
    }
    if (event.target.closest('[data-back-to-day]')) {
      const backToCalendar = app.openedFrom === 'calendar';
      const backToGroup = isGroupKey(app.openedFrom) ? app.openedFrom : '';
      app.openEventKey = backToGroup;
      app.pickedRow = '';
      app.openedFrom = 'calendar';
      renderCalendarPage();
      if (backToCalendar) document.getElementById('dayPanel').classList.remove('open');
      return;
    }
    // A row of an event's timeline: it is marked, and the info shows its own event (Castle Battle, Field Triage).
    // Its arrow still opens its points.
    const treeRow = event.target.closest('[data-row-key]');
    if (treeRow && !event.target.closest('.tree-arrow')) {
      event.preventDefault();
      const rowKey = treeRow.getAttribute('data-row-key');
      const rowOccurrenceKey = rowKey.slice(0, rowKey.lastIndexOf('|'));
      if (rowOccurrenceKey && rowOccurrenceKey !== app.openEventKey && findOccurrenceByKey(rowOccurrenceKey, app.selectedDay)) {
        app.openEventKey = rowOccurrenceKey;
        app.eventScope = 'whole';
        app.openMinute = null;
      }
      app.pickedRow = app.pickedRow === rowKey ? '' : rowKey;
      renderCalendarPage();
      return;
    }
    if (changeButton || addButton || scheduleButton) return;
    const eventButton = event.target.closest('[data-open-event]');
    if (eventButton) {
      // From the day's timeline: the event on this day. From a list inside an event: that event on its own days.
      const key = eventButton.getAttribute('data-open-event');
      const target = findOccurrenceByKey(key, app.selectedDay);
      if (!target) return;
      const firstDay = shownDayOf(target.startMinute), lastDay = shownDayOf(target.endMinute - 1);
      const isOnSelectedDay = app.selectedDay >= firstDay && app.selectedDay <= lastDay;
      // Back returns to where it was opened: the group of alliance times ("Bear ×4"), the day's list, or the calendar.
      const origin = isGroupKey(app.openEventKey) ? app.openEventKey : app.openEventKey ? app.openedFrom : 'day';
      openEvent(key, isOnSelectedDay ? app.selectedDay : firstDay, isOnSelectedDay || !app.openEventKey ? 'day' : 'whole', null, origin);
    }
  });
}

// An admin leaves a time field in "Bear ×4": the new time is saved for every date of that alliance time.
function saveTimeFromInput(input) {
  const scheduleId = input.getAttribute('data-time-input');
  const schedule = app.lookups.schedulesById[scheduleId];
  app.editingTime = '';
  // "9:30" and "930" are read as 09:30; anything else goes to the server as typed, which says what is wrong.
  const typed = input.value.trim();
  const parts = typed.match(/^(\d{1,2}):?(\d{2})$/);
  const time = parts ? ('0' + parts[1]).slice(-2) + ':' + parts[2] : typed;
  if (!schedule || !time || time === schedule.startTimeUtc) { renderDayPanel(); return; }
  callServer('saveAllianceTime', app.sessionToken, scheduleId, time).then(function (data) {
    receiveData(data);
    renderCalendarPage();
    showToast('Time saved.');
  }).catch(function (error) { showError(error); renderDayPanel(); });
}

function selectDay(day) {
  app.selectedDay = day;
  app.openEventKey = '';
  app.openMinute = null;
  renderCalendarPage();
  const panel = document.getElementById('dayPanel');
  if (window.innerWidth < PHONE_DETAILS_BREAKPOINT) panel.classList.add('open');
  panel.scrollTop = 0;
}

// Opens an event in day details (on phones as a full-screen sheet): on one of its days ('day'),
// or the whole event ('whole'). One-day events always show whole.
// minute: where it was tapped in the calendar (null = the day); it decides which day, phase or part is lit.
function openEvent(occurrenceKey, day, scope, minute, origin) {
  app.selectedDay = day;
  app.openEventKey = occurrenceKey;
  app.openedFrom = origin || 'calendar';
  app.pickedRow = '';
  app.eventScope = scope || 'day';
  app.cardView = 'timeline';
  app.openMinute = typeof minute === 'number' && !isNaN(minute) ? minute : null;
  renderCalendarPage();
  const panel = document.getElementById('dayPanel');
  if (window.innerWidth < PHONE_DETAILS_BREAKPOINT) panel.classList.add('open');
  panel.scrollTop = 0;
}

function moveFocus(direction) {
  const parts = partsFromDay(app.focusDay);
  if (app.view === 'year') app.focusDay = dayFromParts(parts.year + direction, 0, 1);
  else if (app.view === 'month') app.focusDay = dayFromParts(parts.year, parts.month + direction, 1);
  else app.focusDay = app.focusDay + 7 * direction;
  renderCalendarPage();
  document.getElementById('calendarPanel').scrollTop = 0;
}

/* ================================================================== */
/* Preferences (filters and view)                                      */
/* ================================================================== */

function applyPreferences(preferences) {
  if (!preferences) return;
  if (Array.isArray(preferences.categories)) {
    const chosen = [];
    preferences.categories.forEach(function (category) {
      const newId = OLD_CATEGORY_IDS[category] || category;
      const isKnown = CATEGORIES.some(function (known) { return known.id === newId; });
      if (isKnown && chosen.indexOf(newId) === -1) chosen.push(newId);
    });
    app.categories = chosen;
  }
  if (Array.isArray(preferences.followedTimes)) app.followedTimes = preferences.followedTimes.filter(function (id) { return typeof id === 'string'; });
  if (Array.isArray(preferences.hiddenEvents)) app.hiddenEvents = preferences.hiddenEvents.filter(function (key) { return typeof key === 'string'; });
  if (['year', 'month', 'week'].indexOf(preferences.view) !== -1) app.view = preferences.view;
  if (['utc', 'local'].indexOf(preferences.timeMode) !== -1) app.timeMode = preferences.timeMode;
  if (typeof preferences.myAllianceId === 'string' && !(app.data && app.data.me)) app.myAllianceId = preferences.myAllianceId;
}

let preferencesTimer = null;
function savePreferences() {
  const preferences = {
    categories: app.categories,
    hiddenEvents: app.hiddenEvents,
    followedTimes: app.followedTimes,
    view: app.view,
    timeMode: app.timeMode,
    myAllianceId: app.myAllianceId
  };
  writeStorage(STORAGE_KEYS.preferences, JSON.stringify(preferences));
  if (!app.sessionToken) return;
  clearTimeout(preferencesTimer);
  preferencesTimer = setTimeout(function () {
    callServer('saveMyPreferences', app.sessionToken, preferences).catch(function () { /* not important enough to show */ });
  }, 1500);
}

/* ================================================================== */
/* Building the list of events for a range of days                     */
/* ================================================================== */

// Every event that touches the days fromDay..toDay (inclusive), from all schedules plus transfers.
function buildOccurrences(fromDay, toDay) {
  if (!app.data) return [];
  let occurrences = [];
  app.data.schedules.forEach(function (schedule) {
    occurrences = occurrences.concat(expandSchedule(schedule, fromDay, toDay));
  });
  return occurrences.concat(buildTransfers(fromDay, toDay));
}

function expandSchedule(schedule, fromDay, toDay) {
  const eventType = app.lookups.eventTypesById[schedule.eventTypeId];
  const firstDay = dayFromText(schedule.firstDate);
  if (!eventType || isNaN(firstDay)) return [];

  const repeatEveryDays = Number(schedule.repeatEveryDays) || 0;
  const lengthDays = Math.max(1, Number(schedule.lengthDays) || 1);
  const untilDay = schedule.untilDate ? dayFromText(schedule.untilDate) : Infinity;
  // The rhythm this schedule keeps: its own, or for a part of an event (Tundra Arms League's predictions) the main
  // event's, so moving the main event moves its parts with it.
  const rhythm = scheduleRhythm(schedule, eventType);
  // Moved dates can land a while away from where they started, so look a bit wider.
  const searchMargin = 60 + rhythm.largestShift;

  const originalStarts = [];
  if (repeatEveryDays <= 0) {
    originalStarts.push(firstDay);
  } else {
    // Repeating schedules also run backwards from the first date, but not before the event was introduced.
    const skipCount = Math.floor((fromDay - searchMargin - firstDay) / repeatEveryDays);
    for (let start = firstDay + skipCount * repeatEveryDays; start <= toDay + searchMargin && start <= untilDay; start += repeatEveryDays) {
      originalStarts.push(start);
    }
  }

  const changesForSchedule = app.lookups.changesBySchedule[schedule.id] || {};
  const allianceIds = schedule.allianceIds ? schedule.allianceIds.split(',') : [];
  const label = schedule.label || groupLabel(eventType, schedule.groupNumber);
  const result = [];
  originalStarts.forEach(function (originalStart) {
    const originalText = textFromDay(originalStart);
    const change = changesForSchedule[originalText] || null;
    // A date of its own that was moved, or else the move of the date it is predicted from (see scheduleRhythm).
    const startDay = change && change.newDate ? dayFromText(change.newDate) : originalStart + rhythm.shiftFor(originalStart);
    const endDay = startDay + lengthDays - 1;
    if (startDay < rhythm.introducedDay) return;
    if (endDay < fromDay || startDay > toDay) return;
    result.push({
      key: schedule.id + '|' + originalText,
      scheduleId: schedule.id,
      eventType: eventType,
      allianceIds: allianceIds,
      label: label,
      startDay: startDay,
      endDay: endDay,
      lengthDays: lengthDays,
      originalDay: originalStart,
      startTimeUtc: (change && change.newStartTimeUtc) || schedule.startTimeUtc || '',
      endTimeUtc: (change && change.newEndTimeUtc) || schedule.endTimeUtc || '',
      startMinute: 0, endMinute: 0, // set below from the days and times
      stateAllianceId: change ? change.stateAllianceId : '',
      note: [schedule.note, change ? change.note : ''].filter(Boolean).join(' · '),
      // Only a moved date or new times count as "changed" (a result or opponent alone does not).
      isChanged: !!(change && (change.newDate || change.newStartTimeUtc || change.newEndTimeUtc)),
      // A cancelled date (Brothers in Arms only) stays on the calendar, marked with an X.
      isCancelled: !!(change && change.cancelled === 'yes') && eventType.id === CANCELLABLE_EVENT_ID
    });
  });
  result.forEach(setMinutes);
  return result;
}

// How a schedule's dates follow each other (Schedules columns sinceDate and shiftWithMoves):
// introducedDay: no date before it (the day the event came to the game); -Infinity when not set.
// shiftFor(day): how many days a date planned for that day moves. With shiftWithMoves = 'yes', a moved date also moves
// the dates predicted from it: the later ones after the first date, the earlier ones before it, until the next moved
// date. Tundra Arms League's seasons are irregular: each one moved in the game keeps the 16 weeks from there on.
// A part of an event (Match Prediction in Tundra Arms League) follows the moves of its main event's schedule.
function scheduleRhythm(schedule, eventType) {
  const noShift = function () { return 0; };
  let source = schedule;
  let offsetDays = 0;
  if (eventType.partOf && !schedule.allianceIds) {
    const mainSchedule = app.data.schedules.filter(function (other) {
      return other.eventTypeId === eventType.partOf && !other.allianceIds && other.repeatEveryDays === schedule.repeatEveryDays;
    })[0];
    if (mainSchedule && !isNaN(dayFromText(mainSchedule.firstDate))) {
      source = mainSchedule;
      offsetDays = dayFromText(schedule.firstDate) - dayFromText(mainSchedule.firstDate);
    }
  }
  // The schedule's own introduced date, or its main event's moved by the days between their first dates.
  const ownIntroducedDay = schedule.sinceDate ? dayFromText(schedule.sinceDate) : NaN;
  const mainIntroducedDay = source !== schedule && source.sinceDate ? dayFromText(source.sinceDate) + offsetDays : NaN;
  const introducedDay = !isNaN(ownIntroducedDay) ? ownIntroducedDay : !isNaN(mainIntroducedDay) ? mainIntroducedDay : -Infinity;
  const repeatEveryDays = Number(source.repeatEveryDays) || 0;
  if (source.shiftWithMoves !== 'yes' || repeatEveryDays <= 0) return { introducedDay: introducedDay, shiftFor: noShift, largestShift: 0 };
  const sourceFirstDay = dayFromText(source.firstDate);
  const changes = app.lookups.changesBySchedule[source.id] || {};
  // The moved dates of the main schedule: its planned day and how far it moved.
  const moves = Object.keys(changes).filter(function (dateText) { return changes[dateText].newDate; }).map(function (dateText) {
    return { plannedDay: dayFromText(dateText), shift: dayFromText(changes[dateText].newDate) - dayFromText(dateText) };
  }).filter(function (move) { return !isNaN(move.plannedDay) && !isNaN(move.shift); });
  const largestShift = moves.reduce(function (largest, move) { return Math.max(largest, Math.abs(move.shift)); }, 0);
  const shiftFor = function (plannedDay) {
    const mainDay = plannedDay - offsetDays;
    let closest = null;
    moves.forEach(function (move) {
      // After the first date: the latest move at or before this date. Before it: the nearest move at or after it.
      const counts = mainDay >= sourceFirstDay ? move.plannedDay >= sourceFirstDay && move.plannedDay <= mainDay
        : move.plannedDay < sourceFirstDay && move.plannedDay >= mainDay;
      if (!counts) return;
      if (!closest || Math.abs(mainDay - move.plannedDay) < Math.abs(mainDay - closest.plannedDay)) closest = move;
    });
    return closest ? closest.shift : 0;
  };
  return { introducedDay: introducedDay, shiftFor: shiftFor, largestShift: largestShift };
}

// The exact start and end of an event, in minutes since 1 Jan 1970 UTC.
// No start time = the reset (00:00 UTC) of the first day; no end time = the reset after the last day.
// An end at 00:00, or a one-day event ending "before" it starts, ends after midnight.
function setMinutes(occurrence) {
  occurrence.startMinute = occurrence.startDay * MINUTES_PER_DAY + Math.max(0, minutesFromTime(occurrence.startTimeUtc));
  const endTime = minutesFromTime(occurrence.endTimeUtc);
  let endMinute = endTime > 0 ? occurrence.endDay * MINUTES_PER_DAY + endTime : (occurrence.endDay + 1) * MINUTES_PER_DAY;
  if (endMinute <= occurrence.startMinute) endMinute += MINUTES_PER_DAY;
  occurrence.endMinute = endMinute;
  return occurrence;
}

// The State Transfer starts the day after each SvS Battle (or Sunfire, if set so), unless moved by hand.
function buildTransfers(fromDay, toDay) {
  const transferType = app.lookups.eventTypesById.transfer;
  if (!transferType) return [];
  const followTypeId = app.data.settings.transferFollows === 'sunfire' ? 'sunfire' : 'svs-battle';
  const changes = app.lookups.changesBySchedule[TRANSFER_SCHEDULE_ID] || {};
  const result = [];

  app.data.schedules
    .filter(function (schedule) { return schedule.eventTypeId === followTypeId && !schedule.allianceIds; })
    .forEach(function (schedule) {
      expandSchedule(schedule, fromDay - 70, toDay + 70).forEach(function (followed) {
        const originalDay = followed.endDay + 1;
        const originalText = textFromDay(originalDay);
        const change = changes[originalText] || null;
        const day = change && change.newDate ? dayFromText(change.newDate) : originalDay;
        if (day + TRANSFER_LENGTH_DAYS - 1 < fromDay || day > toDay) return;
        result.push({
          key: TRANSFER_SCHEDULE_ID + '|' + originalText,
          scheduleId: TRANSFER_SCHEDULE_ID,
          eventType: transferType,
          allianceIds: [],
          label: '',
          startDay: day,
          endDay: day + TRANSFER_LENGTH_DAYS - 1,
          lengthDays: TRANSFER_LENGTH_DAYS,
          originalDay: originalDay,
          startTimeUtc: change ? change.newStartTimeUtc : '',
          endTimeUtc: change ? change.newEndTimeUtc : '',
          stateAllianceId: '',
          note: change ? change.note : '',
          isChanged: !!(change && (change.newDate || change.newStartTimeUtc || change.newEndTimeUtc)),
          // Predicted groups are listed by transfer date (older lists use the Monday after the start).
          transferGroup: app.lookups.transferGroupsByDate[textFromDay(day)] || app.lookups.transferGroupsByDate[textFromDay(day + 1)] || null,
          isCancelled: false
        });
        setMinutes(result[result.length - 1]);
      });
    });
  return result;
}

function isStateWide(occurrence) {
  return occurrence.allianceIds.length === 0;
}

// Whether I follow any alliance time of this event (Bear, Crazy Joe...).
function followsTimesOf(eventTypeId) {
  return app.followedTimes.some(function (scheduleId) {
    const schedule = app.lookups.schedulesById[scheduleId];
    return schedule && schedule.eventTypeId === eventTypeId;
  });
}

// Short codes of an event's groups in the alliance times' names ("DVL BT1" = DVL's Bear Trap 1).
const GROUP_CODES = { bear: 'BT', 'crazy-joe': 'CJ', foundry: 'L', canyon: 'L' };

// An alliance time's name: its alliances' tags, then its group ("DVL BT1"), or its own label when it has one.
function allianceTimeName(occurrence) {
  const tags = occurrence.allianceIds.map(allianceTagById).join(', ');
  const schedule = app.lookups.schedulesById[occurrence.scheduleId] || {};
  if (schedule.label) return tags + ' ' + schedule.label;
  const code = GROUP_CODES[occurrence.eventType.id];
  return tags + (schedule.groupNumber ? ' ' + (code || groupLabel(occurrence.eventType, schedule.groupNumber).replace(/ \d+$/, ' ')) + schedule.groupNumber : '');
}

// The days an occurrence shows on in the calendar. An alliance time that lasts until the reset (Bear, Crazy Joe,
// Mercenary bosses, legions) belongs to its game day only: with "Mine" in UTC+2 it ends at 02:00 and does not show
// on the next day.
function shownDaysOf(occurrence) {
  const first = shownDayOf(occurrence.startMinute);
  let last = shownDayOf(occurrence.endMinute - 1);
  const endsAtReset = !occurrence.endTimeUtc || occurrence.endTimeUtc === '00:00';
  if (!isStateWide(occurrence) && endsAtReset && typeof occurrence.endDay === 'number') last = Math.max(first, Math.min(last, occurrence.endDay));
  return { first: first, last: last };
}

// Whether an occurrence shows on a day of the calendar.
function showsOnDay(occurrence, day) {
  const days = shownDaysOf(occurrence);
  return day >= days.first && day <= days.last;
}

// Times set for one alliance always count as Alliance; everything else uses its event's category.
function occurrenceCategory(occurrence) {
  return isStateWide(occurrence) ? occurrence.eventType.category : 'alliance';
}

// An occurrence shows when its category is ticked and its event is not unticked in that category's list
// (a part, like Castle Battle, follows its main event).
function categoryIsShown(occurrence) {
  const category = occurrenceCategory(occurrence);
  return app.categories.indexOf(category) !== -1 && app.hiddenEvents.indexOf(filterKey(category, occurrence.eventType)) === -1;
}

function filterKey(category, eventType) {
  return category + '|' + (eventType.partOf || eventType.id);
}

// The events in a filter's list: the category's own events, and for Alliance also the events that have alliance times
// (Foundry and Canyon legions, Mercenary bosses). Parts are not listed; they follow their main event.
function filterListEvents(category) {
  const withAllianceTimes = {};
  if (category === 'alliance') {
    app.data.schedules.forEach(function (schedule) { if (schedule.allianceIds) withAllianceTimes[schedule.eventTypeId] = true; });
  }
  return sortedEventTypes().filter(function (eventType) {
    return !eventType.partOf && (eventType.category === category || withAllianceTimes[eventType.id]);
  }).sort(function (a, b) { return a.name.localeCompare(b.name); });
}

// Alliance times shown: my alliance's and its academies' (or, from an academy, its main alliance's and the other academies').
// Nothing until "My alliance" is set in Me.
function allianceIsShown(allianceId) {
  const family = myAllianceFamilyIds();
  return !!family && family.indexOf(allianceId) !== -1;
}

// My alliance with its main alliance and academies, or null when "My alliance" is not set.
function myAllianceFamilyIds() {
  const mine = app.data && app.lookups.alliancesById[app.myAllianceId];
  if (!mine) return null;
  const mainId = mine.mainAllianceId || mine.id;
  return [mainId].concat(app.data.alliances.filter(function (alliance) { return alliance.mainAllianceId === mainId; }).map(function (alliance) { return alliance.id; }));
}

// The phase an event is in on one of its days (day 1 = first day), or null.
function phaseForDay(eventTypeId, dayOfEvent) {
  return (app.lookups.phasesByEventType[eventTypeId] || []).filter(function (phase) {
    return Number(phase.fromDay) <= dayOfEvent && dayOfEvent <= Number(phase.toDay);
  })[0] || null;
}

// What the month and year views draw, at the events' real times: state-wide events (an event with phases
// gets one bar per phase), plus one bar per day for each kind of alliance time (e.g. "Bear ×4").
// fromDay and toDay are days as shown (UTC days, or this device's days for "Mine").
function buildBarsForRange(fromDay, toDay) {
  const rangeStart = dayWindow(fromDay).start;
  const rangeEnd = dayWindow(toDay).end;
  const allInRange = buildOccurrences(fromDay - 8, toDay + 8);
  const stripes = findStripeParts(allInRange);
  const occurrences = allInRange.filter(function (occurrence) {
    return occurrence.startMinute < rangeEnd && occurrence.endMinute > rangeStart &&
      categoryIsShown(occurrence) && occurrence.eventType.detailsOnly !== 'yes' && !stripes.partKeys[occurrence.key];
  });
  occurrences.forEach(function (occurrence) { occurrence.stripes = stripes.byMainKey[occurrence.key] || []; });
  const bars = [];
  occurrences.filter(isStateWide).forEach(function (occurrence) {
    // Frostfire with my slot picked: only its logo, at my slot's time.
    const myEntry = hasPersonalEntry(occurrence.eventType) ? app.lookups.myEntriesByKey[occurrence.key] : null;
    if (myEntry && myEntry.myTime) {
      const slotMinute = occurrence.startDay * MINUTES_PER_DAY + minutesFromTime(myEntry.myTime);
      const slotDay = shownDayOf(slotMinute), slotWindow = dayWindow(slotDay);
      bars.push(Object.assign({}, occurrence, { startMinute: slotWindow.start, endMinute: slotWindow.end,
        markers: [{ minute: slotMinute, title: 'My slot ' + clockText(slotMinute) }] }));
      return;
    }
    const phases = app.lookups.phasesByEventType[occurrence.eventType.id];
    if (!phases) {
      bars.push(occurrence);
      return;
    }
    // Phases marked "no bar" (Foundry's matchmaking and battle) only show on the event's page.
    phases.forEach(function (phase) {
      if (phase.hideBar === 'yes') return;
      const span = phaseMinutes(occurrence, phase);
      if (span) bars.push(Object.assign({}, occurrence, { startMinute: span.start, endMinute: span.end, phaseName: phase.name,
        fullStartMinute: occurrence.startMinute, fullEndMinute: occurrence.endMinute }));
    });
  });

  const groupedAllianceBars = {};
  occurrences.filter(function (occurrence) { return !isStateWide(occurrence); }).forEach(function (occurrence) {
    const visibleAlliances = occurrence.allianceIds.filter(allianceIsShown);
    if (!visibleAlliances.length) return;
    // Times I follow for this event: only those show, as logos at their times. None followed: the whole day, as before.
    const followsSome = followsTimesOf(occurrence.eventType.id);
    if (followsSome && app.followedTimes.indexOf(occurrence.scheduleId) === -1) return;
    const days = shownDaysOf(occurrence);
    const lastDay = Math.min(days.last, toDay);
    for (let day = Math.max(days.first, fromDay); day <= lastDay; day++) {
      const groupKey = occurrence.eventType.id + '|' + day;
      if (!groupedAllianceBars[groupKey]) {
        const window = dayWindow(day);
        groupedAllianceBars[groupKey] = {
          key: 'group|' + groupKey, eventType: occurrence.eventType, allianceIds: [], label: '',
          startMinute: window.start, endMinute: window.end, startTimeUtc: '', lengthDays: 1, count: 0,
          markers: followsSome ? [] : null
        };
      }
      groupedAllianceBars[groupKey].count += 1;
      if (followsSome) groupedAllianceBars[groupKey].markers.push({ minute: occurrence.startMinute, title: allianceTimeName(occurrence) + ' ' + clockText(occurrence.startMinute) });
    }
  });
  return bars.concat(Object.keys(groupedAllianceBars).map(function (key) { return groupedAllianceBars[key]; }));
}

// The openings of a part that is open only at certain times (Match Prediction, Champion Prediction; see
// EventTypes.openWindows in Code.gs), as minutes: [{ start, end, label }]. Null for a part that is open all the time.
// Days count from the part's own first day; "24:00" is the end of a day.
function partOpenings(part) {
  const text = part.eventType.openWindows || '';
  if (!text) return null;
  const firstDayStart = part.startDay * MINUTES_PER_DAY;
  const openings = text.split(';').map(function (one) {
    const match = one.trim().match(/^(\d+)\s+(\d{1,2}):(\d{2})\s*-\s*(\d+)\s+(\d{1,2}):(\d{2})(?:\s+(.+))?$/);
    if (!match) return null;
    const at = function (day, hours, minutes) { return firstDayStart + (Number(day) - 1) * MINUTES_PER_DAY + Number(hours) * 60 + Number(minutes); };
    return { start: at(match[1], match[2], match[3]), end: at(match[4], match[5], match[6]), label: match[7] || '' };
  }).filter(function (opening) { return opening && opening.end > opening.start; });
  return openings.length ? openings : null;
}

// Parts that run for several days inside their main event (Tundra Trade Route inside Alliance Showdown) get no bar
// of their own: they are a thin stripe along the main event's bar, with their icon where they end.
// Returns { partKeys: {key: true}, byMainKey: {mainKey: [part occurrences]} }.
function findStripeParts(occurrences) {
  const result = { partKeys: {}, byMainKey: {} };
  occurrences.forEach(function (part) {
    if (!part.eventType.partOf || part.endMinute - part.startMinute <= MINUTES_PER_DAY) return;
    const main = occurrences.filter(function (other) {
      return other.eventType.id === part.eventType.partOf && other.allianceIds.join(',') === part.allianceIds.join(',') &&
        other.startMinute <= part.startMinute && other.endMinute >= part.endMinute;
    })[0];
    if (!main) return;
    result.partKeys[part.key] = true;
    (result.byMainKey[main.key] = result.byMainKey[main.key] || []).push(part);
  });
  return result;
}

// When one phase of an event runs: from the reset of its first day (or the event's start) to the reset
// after its last day (or the event's end). Null when the event is shorter than the phase.
// A phase's start and end. Without times it runs from its first day's reset to the reset after its last day; a start
// time moves its start on its first day, an end time moves its end on its last day (00:00 = the end of that day).
function phaseMinutes(occurrence, phase) {
  const fromDay = Number(phase.fromDay), toDay = Number(phase.toDay);
  if (fromDay > occurrence.lengthDays) return null;
  let start = fromDay <= 1 ? occurrence.startMinute : (occurrence.startDay + fromDay - 1) * MINUTES_PER_DAY;
  let end = toDay >= occurrence.lengthDays ? occurrence.endMinute : (occurrence.startDay + toDay) * MINUTES_PER_DAY;
  if (phase.startTimeUtc) start = (occurrence.startDay + fromDay - 1) * MINUTES_PER_DAY + minutesFromTime(phase.startTimeUtc);
  if (phase.endTimeUtc && minutesFromTime(phase.endTimeUtc) > 0) end = (occurrence.startDay + toDay - 1) * MINUTES_PER_DAY + minutesFromTime(phase.endTimeUtc);
  start = Math.max(start, occurrence.startMinute);
  end = Math.min(end, occurrence.endMinute);
  return end > start ? { start: start, end: end } : null;
}

/* ================================================================== */
/* Calendar page                                                       */
/* ================================================================== */

function renderCalendarPage() {
  document.querySelectorAll('.segmented [data-view]').forEach(function (button) {
    button.setAttribute('aria-pressed', String(button.getAttribute('data-view') === app.view));
  });
  renderCategoryChips();

  // The month's full name on computers, short on phones.
  const parts = partsFromDay(app.focusDay);
  const title = document.getElementById('periodTitle');
  if (app.view === 'year') title.textContent = String(parts.year);
  else if (app.view === 'month') {
    title.innerHTML = '<span class="title-long">' + MONTH_NAMES[parts.month] + '</span><span class="title-short">' + MONTH_SHORT[parts.month] + '</span> ' + parts.year;
  }
  else title.textContent = weekTitle(mondayOf(app.focusDay));

  if (!app.data) return;
  // The open event decides what is lit in the calendar: the day, phase or part tapped, or the whole event.
  const isGroup = isGroupKey(app.openEventKey);
  const openOccurrence = app.openEventKey && !isGroup ? findOccurrenceByKey(app.openEventKey, app.selectedDay) : null;
  if (app.openEventKey && !isGroup && !openOccurrence) {
    app.openEventKey = '';
    app.openMinute = null;
  }
  app.openScope = openOccurrence ? eventScopeFor(openOccurrence) : '';
  app.selection = findSelection(openOccurrence);
  app.shownToday = todayDay();

  const panel = document.getElementById('calendarPanel');
  panel.classList.toggle('month-mode', app.view === 'month');
  panel.classList.toggle('week-mode', app.view === 'week');
  // The year view has its own 4 events, so the category filters are hidden there.
  document.getElementById('categoryChips').hidden = app.view === 'year';
  if (app.view === 'year') panel.innerHTML = renderYearView(parts.year);
  else {
    panel.innerHTML = app.view === 'month' ? renderMonthView(parts.year, parts.month) : renderWeekView(mondayOf(app.focusDay));
    layoutBars(panel);
    fitBarLabels(panel);
    sizeLanes(panel);
  }

  renderDayPanel();
  renderNextUp();
}

// One-day events have nothing more to show for the whole event, so they always open whole.
function eventScopeFor(occurrence) {
  return app.eventScope === 'day' && occurrence.lengthDays > 1 ? 'day' : 'whole';
}

// Grouped alliance bars ("Bear ×4") have keys like "group|bear|20761".
function isGroupKey(key) {
  return !!key && key.indexOf('group|') === 0;
}

// What is lit in the calendar:
// an open event: the part of it that was tapped (one of its days, its phase, or the whole event when it has neither);
// the whole event when the timeline button is on; a grouped bar: its day; nothing open: the selected day.
function findSelection(openOccurrence) {
  if (isGroupKey(app.openEventKey)) {
    const groupWindow = dayWindow(Number(app.openEventKey.split('|')[2]));
    return { key: app.openEventKey, start: groupWindow.start, end: groupWindow.end };
  }
  if (openOccurrence) {
    if (app.openScope === 'whole') return { key: openOccurrence.key, start: openOccurrence.startMinute, end: openOccurrence.endMinute };
    const window = dayWindow(app.selectedDay);
    const minute = app.openMinute !== null ? app.openMinute : Math.max(openOccurrence.startMinute, window.start);
    const span = unitSpanAt(openOccurrence, minute);
    return { key: openOccurrence.key, start: span.start, end: span.end };
  }
  const dayOnly = dayWindow(app.selectedDay);
  return { start: dayOnly.start, end: dayOnly.end };
}

// The piece of an event at one moment: its phase (Alliance Championship "Battles"), else its day with a name
// (SvS preparation "Beast Slay"), else the whole event.
function unitSpanAt(occurrence, minute) {
  const phases = app.lookups.phasesByEventType[occurrence.eventType.id] || [];
  for (let index = 0; index < phases.length; index++) {
    const span = phaseMinutes(occurrence, phases[index]);
    if (span && span.start <= minute && minute < span.end) return span;
  }
  if (!phases.length) {
    const segment = daySegments(occurrence).filter(function (part) { return part.start <= minute && minute < part.end; })[0];
    if (segment) return segment;
  }
  return { start: occurrence.startMinute, end: occurrence.endMinute };
}

// The name of one day of an event: the day's name from the points list (SvS: "City Construction"),
// else its first step without a time (Showdown: "Rise of the City"), else ''.
function dayNameOf(eventTypeId, dayNumber) {
  const fromPoints = (app.lookups.pointSourcesByEventType[eventTypeId] || []).filter(function (source) {
    return Number(source.dayNumber) === dayNumber && source.dayName;
  })[0];
  if (fromPoints) return fromPoints.dayName;
  const step = stepsForDay(eventTypeId, dayNumber).filter(function (one) { return !one.startTimeUtc && one.label; })[0];
  return step ? step.label : '';
}

// The named days of an event, each running until the next named day starts (the last one until the event ends).
// Only events with at least 2 days, each with a different name, have them. Each: { name, shortName ("Day 3"), start, end }.
// A phase bar is a copy of its event with the phase's times; fullStartMinute / fullEndMinute keep the event's own.
function daySegments(occurrence) {
  if (!occurrence.eventType || occurrence.count) return [];
  const eventStart = occurrence.fullStartMinute || occurrence.startMinute;
  const eventEnd = occurrence.fullEndMinute || occurrence.endMinute;
  const named = [];
  for (let dayNumber = 1; dayNumber <= (occurrence.lengthDays || 1); dayNumber++) {
    const name = dayNameOf(occurrence.eventType.id, dayNumber);
    if (name) named.push({ dayNumber: dayNumber, name: name });
  }
  // A note repeated on every day (Wild Brawl's matchmaking windows) is not a day's name.
  const distinct = named.filter(function (entry, index) { return named.findIndex(function (other) { return other.name === entry.name; }) === index; });
  if (named.length < 2 || distinct.length !== named.length) return [];
  return named.map(function (entry, index) {
    const next = named[index + 1];
    const start = entry.dayNumber === 1 ? eventStart : (occurrence.startDay + entry.dayNumber - 1) * MINUTES_PER_DAY;
    const end = next ? (occurrence.startDay + next.dayNumber - 1) * MINUTES_PER_DAY : eventEnd;
    return { name: entry.name, shortName: 'Day ' + entry.dayNumber, start: Math.max(start, eventStart), end: Math.min(end, eventEnd) };
  }).filter(function (segment) { return segment.end > segment.start; });
}

// The filters, one per category: a tick when it is on, how many of its events show, and an arrow that opens the
// list of its events, each with a tick (all ticked by default).
function renderCategoryChips() {
  const holder = document.getElementById('categoryChips');
  if (!app.data) { holder.innerHTML = ''; return; }
  holder.innerHTML = CATEGORIES.map(function (category) {
    const isOn = app.categories.indexOf(category.id) !== -1;
    const events = filterListEvents(category.id);
    const shownCount = events.filter(function (eventType) { return app.hiddenEvents.indexOf(filterKey(category.id, eventType)) === -1; }).length;
    const isOpen = app.openFilterList === category.id;
    let html = '<span class="filter-group' + (isOpen ? ' open' : '') + '"><span class="chip filter-chip" aria-pressed="' + isOn + '">' +
      '<button type="button" class="filter-name" data-category="' + category.id + '">' +
      (isOn ? '<span class="chip-check" aria-hidden="true">✓</span>' : '') + escapeHtml(category.label) +
      ' <span class="filter-count">' + shownCount + '/' + events.length + '</span></button>' +
      '<button type="button" class="filter-arrow" data-filter-list="' + category.id + '" aria-expanded="' + isOpen + '" aria-label="Choose ' + escapeHtml(category.label) + ' events">▾</button></span>';
    if (isOpen) {
      const allShown = shownCount === events.length;
      html += '<div class="filter-list" role="group" aria-label="' + escapeHtml(category.label) + ' events"><div class="filter-list-head"><span>' + escapeHtml(category.label) + ' events</span>' +
        '<button type="button" class="filter-all" data-filter-all="' + category.id + '">' + (allShown ? 'Untick all' : 'Tick all') + '</button></div>' +
        events.map(function (eventType) {
          const key = filterKey(category.id, eventType);
          const isShown = app.hiddenEvents.indexOf(key) === -1;
          return '<button type="button" class="filter-item' + (isShown ? '' : ' off') + '" data-filter-event="' + escapeHtml(key) + '" aria-pressed="' + isShown + '">' +
            '<span class="filter-box' + (isShown ? ' on' : '') + '" aria-hidden="true">' + (isShown ? '✓' : '') + '</span>' +
            eventIconMarkup(eventType) + '<span>' + escapeHtml(eventType.name) + '</span></button>';
        }).join('') + '</div>';
    }
    return html + '</span>';
  }).join('');
}

/* ---------- Month and week views ---------- */

function weekdayNamesRow() {
  return '<div class="grid7 weekday-names">' + WEEKDAY_SHORT.map(function (name, index) {
    return '<div class="weekday-name' + (index > 4 ? ' weekend' : '') + '">' + name.charAt(0) + '<span class="desktop-only-text">' + name.slice(1) + '</span></div>';
  }).join('') + '</div>';
}

function renderMonthView(year, month) {
  const firstOfMonth = dayFromParts(year, month, 1);
  const lastOfMonth = dayFromParts(year, month + 1, 1) - 1;
  const gridStart = mondayOf(firstOfMonth);
  const gridEnd = mondayOf(lastOfMonth) + 6;
  const bars = buildBarsForRange(gridStart, gridEnd);
  let html = weekdayNamesRow();
  for (let weekStart = gridStart; weekStart <= gridEnd; weekStart += 7) html += renderWeekRow(weekStart, bars, firstOfMonth, lastOfMonth);
  return html;
}

// The week view is one week of the month view: the same bars, lines and names.
function renderWeekView(weekStart) {
  return weekdayNamesRow() + renderWeekRow(weekStart, buildBarsForRange(weekStart, weekStart + 6), null, null);
}

// One week: a row of day boxes behind (tap anywhere in a day), the event bars on top.
// Today has a line along its top; the selected day a soft tint (not while an event is open: the event is lit instead).
function renderWeekRow(weekStart, bars, firstOfMonth, lastOfMonth) {
  const today = todayDay();
  let html = '<div class="week-row"><div class="grid7 day-boxes">';
  for (let column = 0; column < 7; column++) {
    const day = weekStart + column;
    const classes = ['day-box'];
    if (column > 4) classes.push('weekend');
    if (firstOfMonth !== null && (day < firstOfMonth || day > lastOfMonth)) classes.push('other-month');
    if (day === today) classes.push('today');
    if (day === app.selectedDay && !app.openEventKey) classes.push('selected');
    html += '<button type="button" class="' + classes.join(' ') + '" data-day="' + day + '" aria-label="' + escapeHtml(formatDayLong(day)) + '"' +
      (day === today ? ' aria-current="date"' : '') + '>' +
      '<span class="day-number">' + partsFromDay(day).date + '</span></button>';
  }
  return html + '</div>' + renderWeekBars(bars, weekStart) + '</div>';
}

// Places the bars of one week in rows ("lanes") at their real times, so they never overlap.
// The order is fixed by category, then the longest event of the week on top (not by start day), so ticking
// another filter never moves the bars already shown: new bars go into free gaps or below.
// An event's phases and parts stay in its row when they follow each other (SvS prep ends Saturday 10:00,
// the battle follows). A part of up to a day inside another bar of its event (Castle Battle in SvS Battle)
// gets no bar of its own: it is drawn on the second line of that bar.
function renderWeekBars(bars, weekStart) {
  const weekStartMinute = dayWindow(weekStart).start;
  const weekEndMinute = dayWindow(weekStart + 6).end;
  const families = {};
  bars.forEach(function (bar) {
    if (bar.endMinute <= weekStartMinute || bar.startMinute >= weekEndMinute) return;
    const start = Math.max(bar.startMinute, weekStartMinute);
    const end = Math.min(bar.endMinute, weekEndMinute);
    const firstColumn = shownDayOf(start) - weekStart;
    const lastColumn = shownDayOf(end - 1) - weekStart;
    // Named days only on bars of whole events: a phase bar already is one part of its event.
    const allSegments = bar.phaseName ? [] : daySegments(bar);
    const piece = {
      bar: bar, start: start, end: end, firstColumn: firstColumn, lastColumn: lastColumn, insideParts: [], chainParts: [],
      // The named days of the event inside this bar (SvS preparation's days), cut to this week.
      segments: allSegments.map(function (segment) {
        return { name: segment.name, shortName: segment.shortName, start: Math.max(segment.start, start), end: Math.min(segment.end, end), isFirst: segment.start <= start };
      }).filter(function (segment) { return segment.end > segment.start && segment.end > bar.startMinute && segment.start < bar.endMinute; }),
      // Where the bar starts in its first day and ends in its last day (0 = midnight, 1 = the next midnight).
      leftFraction: (shownMinute(start) - (weekStart + firstColumn) * MINUTES_PER_DAY) / MINUTES_PER_DAY,
      rightFraction: (shownMinute(end) - (weekStart + lastColumn) * MINUTES_PER_DAY) / MINUTES_PER_DAY
    };
    const mainType = isPartEvent(bar.eventType) ? app.lookups.eventTypesById[bar.eventType.partOf] : bar.eventType;
    const familyKey = mainType.id + (bar.count ? '|alliances' : '');
    if (!families[familyKey]) families[familyKey] = { mainType: mainType, category: bar.count ? 'alliance' : occurrenceCategory(bar), pieces: [] };
    families[familyKey].pieces.push(piece);
  });
  const familyList = Object.keys(families).map(function (key) { return families[key]; });
  if (!familyList.length) return '';

  // Parts drawn inside another bar of their event, shortest first.
  familyList.forEach(function (family) {
    const lengthOf = function (piece) { return piece.bar.endMinute - piece.bar.startMinute; };
    family.pieces.slice().sort(function (a, b) { return lengthOf(a) - lengthOf(b); }).forEach(function (piece) {
      if (piece.bar.count || !isPartEvent(piece.bar.eventType) || lengthOf(piece) > MINUTES_PER_DAY || piece.insideParts.length) return;
      const host = family.pieces.filter(function (other) {
        return other !== piece && !other.isInside && !other.bar.count && !other.segments.length &&
          other.bar.startMinute <= piece.bar.startMinute && other.bar.endMinute >= piece.bar.endMinute && lengthOf(other) > lengthOf(piece);
      })[0];
      if (!host) return;
      piece.isInside = true;
      host.insideParts.push(piece.bar);
    });
    family.pieces = family.pieces.filter(function (piece) { return !piece.isInside; });
  });

  // One big bar for an event whose parts follow each other (SvS): the first part in the week (matchmaking or
  // preparation) carries the parts that start before or as it ends (Battle, then Field Triage).
  familyList.forEach(function (family) {
    let host = null;
    family.pieces.slice().sort(function (a, b) { return a.start - b.start; }).forEach(function (piece) {
      if (piece.bar.count || !isPartEvent(piece.bar.eventType)) return;
      if (host && piece.start >= host.bar.startMinute && piece.start <= host.end && piece.end > host.end) {
        const lineStart = Math.max(piece.start, host.end);
        host.chainParts.push({ bar: piece.bar, start: lineStart, end: piece.end, mainType: family.mainType, insideParts: piece.insideParts });
        host.end = piece.end;
        host.lastColumn = piece.lastColumn;
        host.rightFraction = piece.rightFraction;
        piece.isChained = true;
        return;
      }
      host = piece;
    });
    family.pieces = family.pieces.filter(function (piece) { return !piece.isChained; });
  });

  // An event with phases (Tundra Arms League, Alliance Championship...): its phases that follow each other in the week
  // become one bar, with each phase on line 1 between white lines, like SvS's parts.
  familyList.forEach(function (family) {
    const byKey = {};
    family.pieces.forEach(function (piece) {
      if (!piece.bar.phaseName || piece.bar.count) return;
      (byKey[piece.bar.key] = byKey[piece.bar.key] || []).push(piece);
    });
    Object.keys(byKey).forEach(function (key) {
      let host = null;
      byKey[key].sort(function (a, b) { return a.start - b.start; }).forEach(function (piece) {
        piece.phaseParts = [{ name: piece.bar.phaseName, start: piece.start, end: piece.end }];
        // A short gap (Winter Siege's matchmaking hour, which has no bar) stays with the phase before it.
        if (host && piece.start - host.end < MINUTES_PER_DAY) {
          host.phaseParts[host.phaseParts.length - 1].end = Math.max(host.end, piece.start);
          host.phaseParts.push({ name: piece.bar.phaseName, start: Math.max(piece.start, host.end), end: piece.end });
          host.end = Math.max(host.end, piece.end);
          host.lastColumn = piece.lastColumn;
          host.rightFraction = piece.rightFraction;
          piece.isChained = true;
          return;
        }
        host = piece;
      });
    });
    family.pieces = family.pieces.filter(function (piece) { return !piece.isChained; });
  });

  const categoryOrder = CATEGORIES.map(function (category) { return category.id; });
  const weekLength = function (family) {
    return Math.max.apply(null, family.pieces.map(function (piece) { return piece.end; })) - Math.min.apply(null, family.pieces.map(function (piece) { return piece.start; }));
  };
  familyList.sort(function (a, b) {
    return categoryOrder.indexOf(a.category) - categoryOrder.indexOf(b.category) || weekLength(b) - weekLength(a) ||
      (Number(a.mainType.sortOrder) || 99) - (Number(b.mainType.sortOrder) || 99) || a.mainType.id.localeCompare(b.mainType.id);
  });

  const lanes = []; // lanes[lane] = the pieces in that row
  const laneIsFree = function (lane, piece) {
    return !(lanes[lane] || []).some(function (other) { return other.start < piece.end && piece.start < other.end; });
  };
  let html = '<div class="grid7 bars" data-week-start="' + weekStart + '">';
  familyList.forEach(function (family) {
    // First the family's own rows (a piece goes under another of the family only when their times overlap),
    // then the highest place where all of them fit, so the family stays together.
    family.pieces.sort(function (a, b) {
      return a.start - b.start || (isPartEvent(a.bar.eventType) ? 1 : 0) - (isPartEvent(b.bar.eventType) ? 1 : 0);
    });
    const ownRows = [];
    family.pieces.forEach(function (piece) {
      let row = 0;
      while ((ownRows[row] || []).some(function (other) { return other.start < piece.end && piece.start < other.end; })) row++;
      (ownRows[row] = ownRows[row] || []).push(piece);
      piece.ownRow = row;
    });
    let firstLane = 0;
    while (!family.pieces.every(function (piece) { return laneIsFree(firstLane + piece.ownRow, piece); })) firstLane++;
    family.pieces.forEach(function (piece) {
      const lane = firstLane + piece.ownRow;
      (lanes[lane] = lanes[lane] || []).push(piece);
      html += renderBar(piece, lane, weekStart);
    });
  });
  return html + '</div>';
}

// A white line on a bar, at one moment. Pointing at it (or tapping it) shows its time.
function barMarkMarkup(minute, kind, what) {
  const time = clockText(minute);
  return '<span class="bar-mark ' + kind + '" data-minute="' + minute + '" data-time="' + escapeHtml(time) + '" role="button" tabindex="0" aria-label="' + escapeHtml(what + ' ' + time) + '"></span>';
}

// One bar. Its exact edges, and the places of everything on it, are set by layoutBars once the day boxes can be measured.
// Line 1: the logo and the event's name, from the left. Bars of a phase (and Field Triage's "Troop Revival") have the
// phase on a smaller second line and a bigger logo beside both lines. Line 2 can also hold the event's named days with
// lines between them, or a part on the same hours (Castle Battle) between two lines.
// A part running for days inside it (Trade Route): a line under the bar, with its logo and a line where it ends.
// Followed alliance times and a picked Frostfire slot: no bar, only the event's logo at each time in the day (several
// on the same day share one row). Tapping one opens the list of that event's times; its time shows on hover or tap.
function renderMarkerBar(piece, lane, weekStart) {
  const bar = piece.bar;
  const span = Math.max(1, bar.endMinute - bar.startMinute);
  const markers = bar.markers.slice().sort(function (a, b) { return a.minute - b.minute; }).map(function (marker) {
    const left = Math.min(100, Math.max(0, (marker.minute - bar.startMinute) / span * 100));
    // The logo stays inside the day: at 00:00 its left edge is on the time, at 24:00 its right edge.
    return '<span class="bar-marker" style="left:' + left.toFixed(2) + '%;transform:translateX(-' + left.toFixed(2) + '%)" title="' + escapeHtml(marker.title) + '" data-time="' + escapeHtml(clockText(marker.minute)) + '">' +
      eventIconMarkup(bar.eventType) + '</span>';
  }).join('');
  return '<div class="bar clickable marker-bar" style="grid-column:' + (piece.firstColumn + 1) + ' / ' + (piece.lastColumn + 2) + ';grid-row:' + (lane + 1) + '"' +
    ' data-trail-count="0" data-lane="' + lane + '" data-first-column="' + piece.firstColumn + '" data-last-column="' + piece.lastColumn + '"' +
    ' data-left-fraction="' + piece.leftFraction.toFixed(5) + '" data-right-fraction="' + piece.rightFraction.toFixed(5) + '"' +
    ' data-open-event="' + escapeHtml(bar.key) + '" data-day="' + (weekStart + piece.firstColumn) + '" role="button" tabindex="0" aria-label="' + escapeHtml(bar.eventType.name) + '">' +
    markers + '</div>';
}

// The bar fades from a deep shade of the event's colour (behind the logo) to a light shade of its second colour.
function renderBar(piece, lane, weekStart) {
  const bar = piece.bar;
  if (bar.markers) return renderMarkerBar(piece, lane, weekStart);
  const fade = barFadeColors(bar.eventType);
  const style = 'grid-column:' + (piece.firstColumn + 1) + ' / ' + (piece.lastColumn + 2) + ';grid-row:' + (lane + 1) + ';' +
    'background:linear-gradient(90deg,' + (fade.hint ? colorWithAlpha(fade.hint, 0.8) + ' 0%,' + colorWithAlpha(fade.dark, 0.8) + ' ' + HINT_SHARE + '%,' : colorWithAlpha(fade.dark, 0.8) + ' 0%,') +
      colorWithAlpha(fade.middle, 0.68) + ' 40%,' + colorWithAlpha(fade.light, 0.58) + ' 100%);' +
    'box-shadow:inset 0 0 0 1px ' + colorWithAlpha(fade.middle, 0.55) + ';' +
    // The bar's deepest shade, used around its logo.
    '--logo-shade:' + fade.dark + ';';
  const timeText = piece.firstColumn === piece.lastColumn && bar.startTimeUtc ? '<span class="bar-time">' + clockText(bar.startMinute) + '</span>' : '';
  const countText = bar.count > 1 ? '<span class="bar-count">×' + bar.count + '</span>' : '';
  // The full name with the phase, for the tooltip ("Alliance Championship · Registration").
  const phaseText = bar.phaseName || bar.label || '';
  const fullName = bar.eventType.name + (phaseText ? ' · ' + phaseText : '');
  // Line 1 shows the event's name, or its short name when the name does not fit (see fitBarLabels).
  const shortName = bar.eventType.shortName || bar.eventType.name;
  const segments = piece.segments;
  const insideParts = piece.insideParts;
  const chainParts = piece.chainParts || [];
  // A part of an event (SvS matchmaking) is named after its event: "State of Power" (or "SvS") on line 1.
  // Several parts in one bar (SvS's week): the parts follow the name on line 1. One part alone in its week: its own
  // name is the second line ("Matchmaking"), like an event's phase.
  const mainOfParts = isPartEvent(bar.eventType) && !bar.count ? app.lookups.eventTypesById[bar.eventType.partOf] || null : null;
  const partsMode = !!mainOfParts && chainParts.length > 0;
  const ownPartName = function () {
    const mainShort = mainOfParts.shortName || mainOfParts.name;
    const name = bar.eventType.shortName || bar.eventType.name;
    const own = name.indexOf(mainShort + ' ') === 0 ? name.slice(mainShort.length + 1) : name;
    return own.charAt(0).toUpperCase() + own.slice(1);
  };
  // The smaller second line: the phase, the part's own name, or the event's second line ("Troop Revival").
  const subtitle = !segments.length && !insideParts.length && !bar.count && !(piece.phaseParts || []).length && !partsMode ?
    (mainOfParts ? ownPartName() : phaseText || bar.eventType.barSubtitle || '') : '';
  const phaseParts = piece.phaseParts || [];
