    if (!step.startTimeUtc || Number(step.dayNumber) > member.lengthDays) return;
    rows.push({ minute: (member.startDay + Number(step.dayNumber) - 1) * MINUTES_PER_DAY + minutesFromTime(step.startTimeUtc),
      label: step.label, note: step.note || '', eventType: eventType, occurrence: member, points: [] });
  });
  const myEntry = app.lookups.myEntriesByKey[member.key];
  if (myEntry && myEntry.myTime) {
    rows.push({ minute: member.startDay * MINUTES_PER_DAY + minutesFromTime(myEntry.myTime), label: 'My slot', eventType: eventType, occurrence: member, points: [] });
  }
  return rows.sort(byMinute);
}

// Draws the timeline: day and time on the left of every row (the date only where the day changes), the main line
// with a dot for each main row, a short branch for each nested row, and a points arrow where there are points.
// A part running beside the event (Trade Route) has its own thin line just left of the main line, fading like its
// bar: its logo on top, a circle on it at each of its moments (the words on that row in a light shade of its colour,
// no branch), dashed after its first moment (no more trucks can be sent; those on the road still arrive), and a cap
// where it ends. Every line ends with a cap.
function renderEventTree(tree) {
  const rows = tree.rows;
  const side = tree.side;
  // Parts open only at certain times: for each, the rows where each opening starts and ends (see buildEventTree).
  const openingSides = (tree.openingSides || []).map(function (part) {
    const spans = (partOpenings(part) || []).map(function (opening) {
      const from = rows.findIndex(function (row) { return row.openingPart === part.key && row.openingStart === opening.start; });
      let to = rows.findIndex(function (row) { return row.openingPart === part.key && row.openingEnd === opening.end; });
      if (to === -1) to = rows.findIndex(function (row, index) { return index > from && row.minute >= opening.end; });
      if (to === -1) to = rows.length - 1;
      return { from: from, to: to };
    }).filter(function (span) { return span.from !== -1; });
    return { part: part, spans: spans };
  });
  const openingCells = function (index) {
    // Always two cells, so the rows line up with one part or two.
    return [0, 1].map(function (column) {
      const side = openingSides[column];
      if (!side) return '<span class="tree-side"></span>';
      const span = side.spans.filter(function (one) { return index >= one.from && index <= one.to; })[0];
      const state = !span ? '' : index === span.from ? 'start' : index === span.to ? 'end' : 'middle';
      const color = escapeHtml(timelineColor(side.part.eventType, '#E8D9A8'));
      return '<span class="tree-side ' + state + '" style="--side-top:' + color + ';--side-bottom:' + color + '">' +
        (state === 'start' ? '<span class="tree-side-logo" title="' + escapeHtml(eventDisplayName(side.part.eventType, '')) + '">' + eventIconMarkup(side.part.eventType) + '</span>' : '') +
        (state === 'end' ? '<span class="tree-cap" style="background:' + color + '"></span>' : '') + '</span>';
    }).join('');
  };
  let html = '<div class="event-tree' + (side ? ' has-side' : '') + (openingSides.length ? ' has-two-sides' : '') + '">';
  // The main line fades like the event's bar, from the first row to the last; dots take the line's colour there.
  const fadeType = tree.fadeEventType;
  const last = Math.max(1, rows.length - 1);
  // The part's line: from the row where it starts to the row where it ends, fading like its bar.
  const sideLight = side ? barFadeColors(side.part.eventType).light : '';
  const sideStartIndex = side ? rows.findIndex(function (row) { return row.minute >= side.part.startMinute; }) : -1;
  const sideEndIndex = side ? rows.findIndex(function (row) { return row.isSideEnd; }) : -1;
  const sideSpan = Math.max(1, sideEndIndex - sideStartIndex);
  const sideAt = function (index) { return (index - sideStartIndex) / sideSpan; };
  const sideStepIndex = side ? rows.findIndex(function (row) { return row.isSideStep; }) : -1;
  const isDashedBelow = function (index) { return sideStepIndex !== -1 && index >= sideStepIndex; };
  const sideStateAt = function (index) {
    if (!side || index < sideStartIndex || index > sideEndIndex) return '';
    return index === sideStartIndex ? 'start' : index === sideEndIndex ? 'end' : 'middle';
  };
  // The line starts a little after the deepest shade, so its first dot still shows on the dark page.
  const lineAt = function (index) { return 0.2 + 0.8 * Math.min(1, Math.max(0, index / last)); };
  if (fadeType) {
    rows.forEach(function (row, index) {
      row.lineAbove = fadePiece(fadeType, lineAt(index - 0.5), lineAt(index));
      row.lineColor = fadePiece(fadeType, lineAt(index), lineAt(index + 0.5));
      row.pointsLine = fadeColorAt(fadeType, lineAt(index + 0.5));
      row.arrowColor = fadeColorAt(fadeType, Math.max(0.5, lineAt(index)));
      if (!row.isSideRow) row.color = fadeColorAt(fadeType, lineAt(index));
    });
  }
  rows.forEach(function (row, index) {
    const previousLine = row.lineAbove || (index > 0 ? rows[index - 1].lineColor : row.lineColor);
    const lineClass = index === 0 ? ' first' : index === rows.length - 1 ? ' last' : '';
    // The line above a main dot keeps the colour of the part before it.
    const mainLine = '<span class="tree-line' + lineClass + '" style="--line-above:' + escapeHtml(row.level === 0 || row.lineAbove ? previousLine : row.lineColor) + ';--line-below:' + escapeHtml(row.lineColor) + '">' +
      (row.isEndRow ? '<span class="tree-cap" style="background:' + escapeHtml(row.color) + '"></span>' :
        row.level === 0 ? '<span class="tree-dot" style="background:' + escapeHtml(row.color) + '"></span>' :
        row.isSideRow ? '' : '<span class="tree-step-dot" style="background:' + escapeHtml(row.color) + '"></span>') + '</span>';
    // No connector lines: a step inside the event is a smaller circle on the main line, its words on the same row.
    let sideCell = '';
    if (side) {
      const state = sideStateAt(index);
      const partType = side.part.eventType;
      sideCell = '<span class="tree-side ' + state + (isDashedBelow(index - 1) ? ' dash-top' : '') + (isDashedBelow(index) ? ' dash-bottom' : '') + '" style="--side-top:' + escapeHtml(fadePiece(partType, sideAt(index - 0.5), sideAt(index))) +
        ';--side-bottom:' + escapeHtml(fadePiece(partType, sideAt(index), sideAt(index + 0.5))) + '">' +
        (state === 'start' ? '<span class="tree-side-logo" title="' + escapeHtml(eventDisplayName(partType, '')) + '">' + eventIconMarkup(partType) + '</span>' : '') +
        (row.isSideStep ? '<span class="tree-side-dot" style="background:' + escapeHtml(fadeColorAt(partType, sideAt(index))) + '"></span>' : '') +
        (state === 'end' ? '<span class="tree-cap" style="background:' + escapeHtml(fadeColorAt(partType, 1)) + '"></span>' : '') + '</span>';
    }
    const sideGoesOn = sideStateAt(index) === 'start' || sideStateAt(index) === 'middle';
    const hasPoints = (row.points && row.points.length) || !!row.rewardsHtml;
    // Instructions open from the row like points do (same arrow).
    const noteHtml = row.note ? '<p class="tree-instructions">' + escapeHtml(row.note) + '</p>' : '';
    // The date only where the day changes; the time on every row.
    const rowDay = shownDayOf(row.minute);
    const isNewDay = index === 0 || shownDayOf(rows[index - 1].minute) !== rowDay;
    const inside = '<span class="tree-when">' + (isNewDay ? '<b>' + escapeHtml(formatDayShort(rowDay)) + '</b>' : '') +
      '<span>' + escapeHtml(clockText(row.minute)) + '</span></span>' +
      sideCell + (openingSides.length ? openingCells(index) : '') + mainLine +
      '<span class="tree-label' + (row.level === 0 && !row.isEndRow ? ' main' : '') + (row.isSideRow || row.isEndRow ? ' side-row' : '') + '"' +
      (row.isSideRow ? ' style="color:' + escapeHtml(row.openingPart ? barFadeColors(row.eventType).light : sideLight) + '"' : '') + '>' +
      (row.isCancelled ? '<span class="cancelled-mark" aria-label="Cancelled">✕</span> ' : '') + escapeHtml(row.label) +
      (row.subLabel ? '<span class="tree-sub">' + escapeHtml(row.subLabel) + '</span>' : '') + '</span>' +
      (hasPoints || row.note ? '<span class="tree-arrow" style="--arrow-color:' + escapeHtml(row.arrowColor || row.color) + '"></span>' : '<span></span>');
    const rowClass = 'tree-row' + (row.level === 0 ? ' main' : row.isSideRow ? ' side' : ' nested') + (row.isCurrent ? ' current' : '');
    const currentStyle = row.isCurrent ? ' style="--current-color:' + escapeHtml(row.color) + '"' : '';
    const rowKey = ' data-row-key="' + escapeHtml(row.key || '') + '"';
    if (!hasPoints && !noteHtml) { html += '<div class="' + rowClass + '"' + currentStyle + rowKey + '>' + inside + '</div>'; return; }
    // A day's points open only from its arrow, also on the tapped day (which stays marked).
    html += '<details class="tree-item"><summary class="' + rowClass + '"' + currentStyle + rowKey + '>' + inside + '</summary>' +
      '<div class="tree-points' + (sideGoesOn ? ' with-side' : '') + (sideGoesOn && isDashedBelow(index) ? ' dash-side' : '') + '" style="--line-below:' + escapeHtml(row.pointsLine || row.lineColor) +
      (sideGoesOn ? ';--side-color:' + escapeHtml(fadeColorAt(side.part.eventType, sideAt(index + 0.5))) : '') + '">' + noteHtml +
      (row.points && row.points.length ? renderPointRows(row.eventType, row.points, row.occurrence ? row.occurrence.startDay : NaN) : '') + (row.rewardsHtml || '') + '</div></details>';
  });
  return html + '</div>';
}

// A note in a points list. "Title: text" shows the title bold above the text (on the same line when the text is
// short). After a line break, lines starting with "Disabled:" or "Enabled:" are marked so the two are easy to tell apart.
// Lines starting with "Alliance:" or "Player:" show that word bold (requirements); a line just before such lines,
// with no full stop, is their small heading (for example "Requirements for ranking rewards").
// imageFile (optional): a picture beside the note, from the image repo (Baldur beside his skill).
function renderNoteRow(text, imageFile) {
  const titled = text.match(/^([^:\n]{1,40}):\s*([\s\S]*)$/);
  const title = titled ? titled[1] : '';
  const body = titled ? titled[2] : text;
  const lines = body.split('\n').filter(function (line) { return line.trim(); });
  const requirementOf = function (line) { return line && line.match(/^(Alliance|Player):\s*(.*)$/); };
  const bodyHtml = lines.map(function (line, index) {
    const labelled = lines.length > 1 && line.match(/^(Disabled|Enabled):\s*(.*)$/);
    if (labelled) return '<span class="note-line note-' + labelled[1].toLowerCase() + '"><b>' + escapeHtml(labelled[1]) + '</b><span>' + escapeHtml(labelled[2]) + '</span></span>';
    const requirement = lines.length > 1 && requirementOf(line);
    if (requirement) return '<span class="note-line"><b>' + escapeHtml(requirement[1]) + ':</b> ' + escapeHtml(requirement[2]) + '</span>';
    if (index > 0 && !/[.!?]$/.test(line) && requirementOf(lines[index + 1])) return '<span class="note-line note-subtitle">' + escapeHtml(line) + '</span>';
    return '<span class="note-line">' + escapeHtml(line) + '</span>';
  }).join('');
  const pictureUrl = imageFile ? assetUrl(imageFile) : '';
  const picture = pictureUrl ? '<img class="note-picture" src="' + escapeHtml(pictureUrl) + '" alt="" loading="lazy" onerror="this.remove()">' : '';
  if (!title) return '<p class="points-note' + (picture ? ' with-picture' : '') + '">' + picture + bodyHtml + '</p>';
  const isShort = lines.length <= 1 && body.length <= 40;
  return '<p class="points-note' + (isShort ? '' : ' titled') + (picture ? ' with-picture' : '') + '">' + picture + '<b class="note-title">' + escapeHtml(title) + (isShort ? ':' : '') + '</b>' + (isShort ? ' ' : '') + bodyHtml + '</p>';
}

// The rows of a points list (without the fold around them). day: the event's first day (for hero names).
function renderPointRows(eventType, pointSources, day) {
  return (eventType.pointsNote ? '<p class="points-note">' + escapeHtml(fillHeroNames(eventType.pointsNote, day)) + '</p>' : '') +
    pointSources.map(function (source) {
      const task = fillHeroNames(source.task, day);
      if (!source.points) return renderNoteRow(task);
      return '<div class="points-row"><span>' + escapeHtml(task) + '</span><span class="points-value">' + escapeHtml(source.points) + '</span></div>';
    }).join('');
}

// When a day is a Fortress battle day (the Friday of a phase): its season and phase, else null.
function fortPhaseOfDay(day) {
  if (!app.data) return null;
  const seasonStart = fortressSeasonStartFor(day);
  if (isNaN(seasonStart)) return null;
  const daysAfterStart = day - seasonStart;
  if (daysAfterStart < 0 || daysAfterStart % 7 !== 0) return null;
  return { seasonText: textFromDay(seasonStart), phase: daysAfterStart / 7 + 1 };
}

// The 16 battles of a battle day: fort, battle time, alliance (empty when not set), in time order.
function fortBattlesOnDay(day) {
  const fortDay = fortPhaseOfDay(day);
  if (!fortDay) return [];
  const rowsByFort = {};
  (app.data.fortHolders || []).forEach(function (row) {
    if (row.seasonStart === fortDay.seasonText && Number(row.phase) === fortDay.phase) rowsByFort[row.fort] = row;
  });
  return FORT_NAMES.map(function (fort, index) {
    const row = rowsByFort[fort];
    return { fort: fort, order: index, phase: fortDay.phase, seasonText: fortDay.seasonText,
      time: row ? row.battleTimeUtc || '' : '', allianceId: row ? row.allianceId || '' : '' };
  }).sort(function (a, b) {
    return (a.time ? 0 : 1) - (b.time ? 0 : 1) || minutesFromTime(a.time) - minutesFromTime(b.time) || a.order - b.order;
  });
}

// Fort battles: State shows all of them; Alliance alone shows only my alliance's and its academies'.
function fortIsShown(allianceId) {
  if (app.categories.indexOf('state') !== -1) return true;
  return app.categories.indexOf('alliance') !== -1 && !!allianceId && allianceIsShown(allianceId);
}

// The Fortress Battles section: my alliance's forts with their battle times; the other forts folded.
// When no battle time is set yet, one line says so (admins get the forts to edit in a fold).
function renderFortBattlesSection(occurrence) {
  let battleDay = NaN;
  for (let day = occurrence.startDay; day <= occurrence.endDay; day++) if (fortPhaseOfDay(day)) battleDay = day;
  if (isNaN(battleDay)) {
    return app.data.settings.fortressSeasonStart ? '' : '<section class="day-section glass"><h3>Battles</h3><p class="admin-help">Set the season dates on the Fortress page first.</p></section>';
  }
  const battles = fortBattlesOnDay(battleDay);
  const phase = fortPhaseOfDay(battleDay).phase;
  const title = '<h3>' + escapeHtml(formatDayShort(battleDay)) + ' battles · phase ' + phase + '</h3>';
  const rowsOf = function (list) { return list.map(function (battle) { return fortBattleRow(battle, battleDay, phase); }).join(''); };
  const sectionStart = '<section class="day-section glass" style="--fold-color:' + escapeHtml(occurrence.eventType.color || '#AFC8F5') + '">';
  if (!battles.some(function (battle) { return battle.time; })) {
    return sectionStart + title + '<p class="event-info-line">Battle times not set yet.</p>' +
      (app.data.isAdmin ? '<details class="points-list"><summary>Set the forts</summary>' + rowsOf(battles) + '</details>' : '') + '</section>';
  }
  const ours = battles.filter(function (battle) { return battle.allianceId && allianceIsShown(battle.allianceId); });
  const others = battles.filter(function (battle) { return ours.indexOf(battle) === -1; });
  const noneText = myAllianceFamilyIds() ? 'None of your alliance\'s forts this phase.' : 'Pick your alliance in Me to see its forts here.';
  return sectionStart + title + (ours.length ? rowsOf(ours) : '<p class="admin-help">' + escapeHtml(noneText) + '</p>') +
    (others.length ? '<details class="points-list"><summary>Other forts (' + others.length + ')</summary>' + rowsOf(others) + '</details>' : '') + '</section>';
}

// One fort: its battle time, when its rewards expire (24 hours later), who holds it, and the admin pencil.
function fortBattleRow(battle, battleDay, phase) {
  let timeText = 'Time not set', rewardText = '';
  if (battle.time) {
    const minute = battleDay * MINUTES_PER_DAY + minutesFromTime(battle.time);
    timeText = formatDayShort(shownDayOf(minute)) + ' · ' + clockText(minute);
    rewardText = 'Rewards until ' + formatDayShort(shownDayOf(minute + MINUTES_PER_DAY)) + ' ' + clockText(minute + MINUTES_PER_DAY);
  }
  const alliance = app.lookups.alliancesById[battle.allianceId];
  return '<div class="fort-battle-row"><span class="fort-battle-name">' + battle.fort + '</span>' +
    '<span class="fort-battle-text"><span>' + escapeHtml(timeText) + '</span>' + (rewardText ? '<span class="event-note">' + escapeHtml(rewardText) + '</span>' : '') + '</span>' +
    (alliance ? '<span class="fort-banner fort-battle-holder" style="' + fortBannerStyle(alliance) + '"><span>' + escapeHtml(alliance.tag || alliance.name) + '</span></span>' : '') +
    (app.data.isAdmin ? pencilButton('data-fort-cell="' + battle.fort + '|' + phase + '|' + battle.seasonText + '"', 'Edit ' + fortFullName(battle.fort)) : '') + '</div>';
}

// The other phases of the same run: for SvS, its matchmaking, prep, battle and castle around this date.
function familyOccurrences(occurrence) {
  const eventType = occurrence.eventType;
  const familyId = eventType.partOf || eventType.id;
  if (!app.lookups.partsByMain[familyId] && !eventType.partOf) return [occurrence];
  const reach = Math.max(10, occurrence.lengthDays || 0);
  return buildOccurrences(occurrence.startDay - reach, occurrence.endDay + reach).filter(function (other) {
    const otherFamily = other.eventType.partOf || other.eventType.id;
    if (otherFamily !== familyId || other.allianceIds.join(',') !== occurrence.allianceIds.join(',')) return false;
    // A long event (Tundra Arms League, 23 days) keeps its parts that start later than 10 days in.
    return Math.abs(other.originalDay - occurrence.originalDay) <= Math.max(10, occurrence.lengthDays || 0);
  }).sort(compareOccurrences);
}

// The steps for one day of an event (day 1 = the event's first day).
function stepsForDay(eventTypeId, dayOfEvent) {
  return (app.lookups.stepsByEventType[eventTypeId] || []).filter(function (step) {
    return Number(step.dayNumber) === dayOfEvent;
  });
}

// Pencil buttons next to an event: admins edit this date (time, opponents, result...);
// signed-in players note their own rank in personal events.
function editButtons(occurrence) {
  let html = '';
  if (!occurrence.scheduleId || !app.data) return html;
  if (app.data.isAdmin) html += pencilButton('data-change-occurrence="' + escapeHtml(occurrence.key) + '"', 'Edit this date');
  return html;
}

// Events where each signed-in player picks their own slot (Frostfire).
function hasPersonalEntry(eventType) {
  return !!eventType.slotTimes;
}

// The game's slots of an event, shown as times to tap: the picked one is lit, tapping it again unpicks it.
// Only the player sees their pick. Players who are not signed in are asked to sign in first.
function renderSlotPicker(occurrence) {
  if (!hasPersonalEntry(occurrence.eventType) || !occurrence.scheduleId || occurrence.scheduleId === TRANSFER_SCHEDULE_ID) return '';
  const entry = app.lookups.myEntriesByKey[occurrence.key];
  const picked = entry ? entry.myTime : '';
  const isSignedIn = !!(app.data && app.data.me);
  const buttons = occurrence.eventType.slotTimes.split(',').map(function (time) {
    time = time.trim();
    const isPicked = time === picked;
    return '<button type="button" class="slot-button" aria-pressed="' + isPicked + '"' + (isSignedIn ? '' : ' disabled') +
      ' data-pick-slot="' + escapeHtml(occurrence.key) + '" data-slot-time="' + escapeHtml(time) + '">' +
      escapeHtml(clockText(occurrence.startDay * MINUTES_PER_DAY + minutesFromTime(time))) + '</button>';
  }).join('');
  return '<div class="slot-picker"><div class="slot-title">My slot' + (isSignedIn ? '' : ' · <button type="button" class="link-button" data-sign-in-for-slot>Sign in to pick it</button>') + '</div>' +
    '<div class="slot-buttons">' + buttons + '</div></div>';
}

// Saves (or clears) the signed-in player's slot.
function pickMySlot(occurrenceKey, time) {
  if (!app.data || !app.data.me) { openMeDialog(); return; }
  const separator = occurrenceKey.lastIndexOf('|');
  const entry = app.lookups.myEntriesByKey[occurrenceKey];
  const newTime = entry && entry.myTime === time ? '' : time;
  callServer('saveMyEntry', app.sessionToken, occurrenceKey.slice(0, separator), occurrenceKey.slice(separator + 1), { myTime: newTime })
    .then(function (data) {
      receiveData(data);
      renderEverything();
      showToast(newTime ? 'Slot saved. Only you can see it.' : 'Slot cleared.');
    })
    .catch(showError);
}

// The change row of one date of a schedule (moved date, times, opponents, result...), or null.
function changeFor(scheduleId, originalDay) {
  return (app.lookups.changesBySchedule[scheduleId] || {})[textFromDay(originalDay)] || null;
}

function hasOpponents(change) {
  return !!(change && (change.opponentState1 || change.opponentAlliance1 || change.opponentState2 || change.opponentAlliance2));
}

// Who this date is played against. SvS phases share one opponent: it is entered once and found on
// any SvS phase of the same run (same alliance and legion, within 10 days).
// Returns { opponents: [{ state, alliance }], scheduleId, originalDay } or null.
function findOpponents(occurrence) {
  const eventType = occurrence.eventType;
  if (!Number(eventType.opponentCount) || !occurrence.scheduleId || occurrence.scheduleId === TRANSFER_SCHEDULE_ID) return null;
  const schedule = app.lookups.schedulesById[occurrence.scheduleId];
  if (!schedule) return null;
  const toResult = function (change, scheduleId, originalDay) {
    const opponents = [];
    for (let number = 1; number <= Number(eventType.opponentCount); number++) {
      const state = change['opponentState' + number], alliance = change['opponentAlliance' + number];
      if (state || alliance) opponents.push({ state: state, alliance: alliance });
    }
    return { opponents: opponents, scheduleId: scheduleId, originalDay: originalDay };
  };
  const ownChange = changeFor(schedule.id, occurrence.originalDay);
  if (hasOpponents(ownChange)) return toResult(ownChange, schedule.id, occurrence.originalDay);

  const familyId = eventType.partOf || eventType.id;
  let best = null;
  app.data.schedules.forEach(function (other) {
    const otherType = app.lookups.eventTypesById[other.eventTypeId];
    if (!otherType || other.id === schedule.id || (otherType.partOf || otherType.id) !== familyId) return;
    if (other.allianceIds !== schedule.allianceIds || (other.groupNumber || '') !== (schedule.groupNumber || '')) return;
    Object.keys(app.lookups.changesBySchedule[other.id] || {}).forEach(function (dateText) {
      const change = app.lookups.changesBySchedule[other.id][dateText];
      const distance = Math.abs(dayFromText(dateText) - occurrence.originalDay);
      if (distance > 10 || !hasOpponents(change)) return;
      if (!best || distance < best.distance) best = { distance: distance, result: toResult(change, other.id, dayFromText(dateText)) };
    });
  });
  return best ? best.result : null;
}

// "vs State 1302" or "vs ABC (1302) and DEF (1311)".
function opponentsText(found) {
  if (!found || !found.opponents.length) return '';
  return 'vs ' + found.opponents.map(function (opponent) {
    if (opponent.alliance && opponent.state) return opponent.alliance + ' (' + opponent.state + ')';
    return opponent.alliance || 'State ' + opponent.state;
  }).join(' and ');
}

// "Won", "Lost", "Rank 3", "President: [xSK] Name".
function resultSummary(occurrence) {
  if (!occurrence.scheduleId || occurrence.scheduleId === TRANSFER_SCHEDULE_ID) return '';
  const change = changeFor(occurrence.scheduleId, occurrence.originalDay);
  if (!change) return '';
  const parts = [];
  if (change.result === 'win') parts.push('Won');
  if (change.result === 'loss') parts.push('Lost');
  if (change.rank) parts.push('Rank ' + change.rank);
  if (change.presidentAllianceId || change.presidentName) {
    parts.push('President: ' + [change.presidentAllianceId ? '[' + allianceTagById(change.presidentAllianceId) + ']' : '', change.presidentName].filter(Boolean).join(' '));
  }
  return parts.join(' · ');
}

// A small pencil button; with text it also says what it does.
function pencilButton(attributes, label, text) {
  return '<button type="button" class="pencil-button' + (text ? ' with-text' : '') + '" ' + attributes + ' aria-label="' + escapeHtml(label) + '" title="' + escapeHtml(label) + '">' +
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>' + (text ? '<span>' + escapeHtml(text) + '</span>' : '') + '</button>';
}

// The point sources for one day of an event: whole-event rows plus the rows for that day.
function pointSourcesForDay(eventTypeId, dayOfEvent) {
  return (app.lookups.pointSourcesByEventType[eventTypeId] || []).filter(function (source) {
    return !source.list && (!source.dayNumber || Number(source.dayNumber) === dayOfEvent);
  });
}

// The event's Rules (rows with list "rules"), in their own fold.
// Notes shown at the top of an event's Predictions, Rewards or Missions (point source rows of that list), in a fold.
function renderNotesFold(eventType, list, title, day) {
  // Notes of one rewards list ("ranking|Legion" in the day name) show above that list instead (see renderRewardsFold).
  const notes = (app.lookups.pointSourcesByEventType[eventType.id] || []).filter(function (source) {
    return source.list === list && !(list === 'rewards' && source.dayName);
  });
  if (!notes.length) return '';
  return '<details class="points-list" open><summary>' + escapeHtml(title) + '</summary>' + notes.map(function (source) {
    return renderNoteRow(fillHeroNames(source.task, day), source.imageFile);
  }).join('') + '</details>';
}

// Missions (Tundra Arms League's Match Missions): the note, then a tab per kind (Daily, Weekly) and each mission with
// its rewards under it.
function renderMissionsFold(eventType, day) {
  const notes = (app.lookups.pointSourcesByEventType[eventType.id] || []).filter(function (source) { return source.list === 'missions'; });
  const rows = rewardRowsOf(eventType.id, 'missions');
  if (!notes.length && !rows.length) return '';
  const bands = [];
  rows.forEach(function (row) { if (bands.indexOf(row.band) === -1) bands.push(row.band); });
  const chosen = app.rewardBands[eventType.id + '|missions'];
  const band = bands.indexOf(chosen) !== -1 ? chosen : bands[0] || '';
  let html = '<details class="points-list rewards-fold" open><summary>Missions</summary>' + notes.map(function (source) {
    return renderNoteRow(fillHeroNames(source.task, day), source.imageFile);
  }).join('');
  if (bands.length > 1) {
    html += '<div class="reward-tabs" style="grid-template-columns:repeat(' + bands.length + ',1fr)">' + bands.map(function (one) {
      return '<button type="button" class="reward-tab' + (one === band ? ' on' : '') + '" data-reward-band="' + escapeHtml(eventType.id + '|missions|' + one) + '">' + escapeHtml(one) + '</button>';
    }).join('') + '</div>';
  }
  const shown = rows.filter(function (row) { return row.band === band; });
  const missions = [];
  shown.forEach(function (row) { if (missions.indexOf(row.rowLabel) === -1) missions.push(row.rowLabel); });
  html += missions.map(function (mission) {
    return '<div class="mission-row"><span class="mission-name">' + escapeHtml(mission) + '</span><span class="reward-items">' +
      shown.filter(function (row) { return row.rowLabel === mission; }).map(rewardTile).join('') + '</span></div>';
  }).join('');
  if (shown.some(function (row) { return row.source === 'guides'; })) html += '<p class="reward-source">From guides, not checked in game yet.</p>';
  return html + '</details>';
}

function renderRulesFold(eventType, day) {
  const rules = (app.lookups.pointSourcesByEventType[eventType.id] || []).filter(function (source) { return source.list === 'rules'; });
  if (!rules.length) return '';
  return '<details class="points-list" open><summary>Rules</summary>' + rules.map(function (source) {
    return renderNoteRow(fillHeroNames(source.task, day), source.imageFile);
  }).join('') + '</details>';
}

// The list under an event in day details, folded until tapped. Its title is "Points" unless the event names it
// (for example "Missions and shop"); only the plain "Points" title shows how many rows score.
// day: the event's first day, for the heroes that change with the generation.
function renderPointsList(eventType, pointSources, day) {
  if (!pointSources.length && !eventType.pointsNote) return '';
  const scoringRows = pointSources.filter(function (source) { return source.points; }).length;
  const title = eventType.pointsTitle || ('Points' + (scoringRows ? ' (' + scoringRows + ')' : ''));
  return '<details class="points-list"><summary>' + escapeHtml(title) + '</summary>' + renderPointRows(eventType, pointSources, day) + '</details>';
}

/* ---------- Rewards, drawn like in the game ----------
   Each reward is its item's picture on a tile coloured like in the game (grey, green, blue, purple, orange),
   with the item's small top text ("1 hr(s)", "100 K", "Lv.1") and the quantity in the corner. The pictures come
   from the image repo (items/…); an item without a picture yet shows a "?". */

// A picture's link: its path inside the image repo. The image folder setting points at the repo's events folder,
// so the repo itself is that link without "events/".
function assetUrl(path) {
  const base = (app.data && app.data.settings.imageBaseUrl) || '';
  if (!base || !path) return '';
  const root = base.replace(/events\/?$/, '');
  return root + (/\/$/.test(root) ? '' : '/') + path;
}

const REWARD_TILE_COLORS = ['grey', 'green', 'blue', 'purple', 'orange'];

// Items the game shows without a picture of their own, drawn by the app: Mystery Pack's yellow question mark.
const DRAWN_ITEM_PICTURES = {
  'mystery-pack': '<svg class="drawn-picture" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="questionGold" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#FFE45C"/><stop offset="1" stop-color="#F2A92A"/></linearGradient></defs>' +
    '<text x="33.5" y="57" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="60" fill="#3A2200" opacity="0.55">?</text>' +
    '<text x="32" y="55" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="60" fill="url(#questionGold)" ' +
    'stroke="#7A460E" stroke-width="4" paint-order="stroke">?</text></svg>'
};

// An item's name or tile text with the state's current generation in place of "{generation}" (the Emporium of
// Enigma's widget chest is always the current generation's). Without a known generation the number is left out.
function withGeneration(text) {
  if (!text || text.indexOf('{generation}') === -1) return text;
  const generation = generationOnDay(todayDay());
  return generation ? text.replace(/\{generation\}/g, String(generation)) : text.replace(/Gen \{generation\} /g, '').replace(/\{generation\}/g, '');
}
function itemName(item) { return withGeneration(item.name); }

// One reward: the item on its tile. row: { itemId, quantity, tile }.
function rewardTile(row) {
  const item = app.lookups.itemsById[row.itemId] || { name: row.itemId, imageFile: '', label: '' };
  const url = assetUrl(item.imageFile);
  const drawn = !url && DRAWN_ITEM_PICTURES[item.id] ? DRAWN_ITEM_PICTURES[item.id] : '';
  const tile = REWARD_TILE_COLORS.indexOf(row.tile) !== -1 ? row.tile : 'none';
  const picture = url ? '<img src="' + escapeHtml(url) + '" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'no-picture\');this.remove()">' : drawn;
  return '<span class="reward-tile tile-' + tile + (url || drawn ? '' : ' no-picture') + '" title="' + escapeHtml(itemName(item) + (row.quantity ? ' ×' + row.quantity : '')) + '">' + picture +
    (withGeneration(item.label) ? '<span class="tile-top">' + escapeHtml(withGeneration(item.label)) + '</span>' : '') +
    // Secured items: the shield in the bottom right, under the quantity, like in the game.
    (/Secured/.test(item.name) ? '<img class="tile-secured" src="' + escapeHtml(assetUrl('items/secured.png')) + '" alt="" onerror="this.remove()">' : '') +
    (row.quantity ? '<span class="tile-qty">' + escapeHtml(row.quantity) + '</span>' : '') + '</span>';
}

// The reward rows of one list of an event (optionally one band and one section), in order.
function rewardRowsOf(eventTypeId, list, band, section) {
  return (app.lookups.rewardsByEventType[eventTypeId] || []).filter(function (row) {
    return row.list === list && (band === undefined || row.band === band) && (section === undefined || row.section === section);
  });
}

// Rows that share their left words (a rank, a points threshold, a stronghold) become one line of tiles. The first row's
// note shows small under the words, each part separated by " · " on its own line (Crazy Joe: "Personal 3,000 · Alliance
// 300,000"; Alliance Championship: "Star Rating +2").
function rewardLines(rows, labelHtml) {
  const order = [], byLabel = {};
  rows.forEach(function (row) {
    if (!byLabel[row.rowLabel]) { byLabel[row.rowLabel] = []; order.push(row.rowLabel); }
    byLabel[row.rowLabel].push(row);
  });
  return order.map(function (label) {
    const note = byLabel[label][0].note;
    const noteHtml = note ? note.split(' · ').map(function (part) { return '<small>' + escapeHtml(part) + '</small>'; }).join('') : '';
    return '<div class="reward-row"><span class="reward-label">' + (labelHtml ? labelHtml(label, byLabel[label]) : escapeHtml(label)) + noteHtml + '</span>' +
      '<span class="reward-items">' + byLabel[label].map(rewardTile).join('') + '</span></div>';
  }).join('');
}

// The tabs of the Rewards fold, in the game's order, and the words on them.
const REWARD_TABS = [['daily', 'Daily'], ['star', 'Star'], ['glory', 'Champion\'s Glory'], ['ranking', 'Ranking'], ['combatant', 'Combatant'], ['tier', 'Tier'], ['conquest', 'Stronghold Conquest'], ['merchant', 'Winter Merchant'],
  ['targets', 'Target Points'], ['medals', 'Medal of Honor'], ['group', 'Tier Rewards'], ['ko', 'KO Rewards'], ['shop', 'Shop'], ['rates', 'Reward Rates']];
// Events whose Rewards tabs have the game's own names and order (every list the event has must be named here).
const EVENT_REWARD_TABS = {
  'alliance-championship': [['group', 'Tier Rewards'], ['ko', 'KO Rewards']],
  koi: [['targets', 'Target Points'], ['medals', 'Medal of Honor'], ['ranking', 'Ranking']],
  'crazy-joe': [['targets', 'Defense Point'], ['ranking', 'Ranking']],
  frostfire: [['targets', 'Gathering Rewards'], ['ranking', 'Ranking Rewards']],
  dreamscape: [['targets', 'Chapter Rewards']],
  'defeat-beasts': [['targets', 'Target Points'], ['ranking', 'Honor Ranking']],
  'lucky-wheel': [['rates', 'Reward Rates'], ['targets', 'Progress Chests']]
};
// What an event's shop is paid with.
const SHOP_CURRENCIES = { 'winter-siege': 'winter-badge', 'flame-and-fang': 'crystallite-core', 'emporium-of-enigma': 'thorn-of-enigma' };
// Lists whose rows are ordered by the number in their left words ("Own 2" before "Own 10", "Lv. 9" before "Lv. 10").
const NUMBERED_REWARD_LISTS = ['targets', 'medals'];
function firstNumberIn(text) {
  const match = String(text || '').replace(/,/g, '').match(/\d+(\.\d+)?/);
  return match ? Number(match[0]) : 0;
}
const COMBATANT_SECTION_NAMES = { win: 'Winning legion\'s members', lose: 'Losing legion\'s members',
  'personal-win': 'Winning legion\'s combatants, by Personal Arsenal Points', 'personal-lose': 'Losing legion\'s combatants, by Personal Arsenal Points' };
const GLORY_SECTION_NAMES = { champion: 'Champion Alliance Glory', top4: 'Top 4 Alliance Glory' };
const REWARD_SECTION_NAMES = { win: 'Winning alliance', lose: 'Losing or drawing alliance', streak: 'Win Streak' };
const DAILY_SECTION_NAMES = { win: 'Winning alliance of the day', lose: 'Losing or drawing alliance of the day' };
const TIER_RESULT_NAMES = { streak: 'Win Streak', win: 'Victory', lose: 'Loss' };

// The band of my alliance: its Showdown Star Rating band ("3-5") or its Winter Siege tier, if admins set it.
function myRewardBand(bands) {
  const mine = app.data && app.lookups.alliancesById[app.myAllianceId];
  if (!mine) return '';
  if (mine.winterSiegeTier && bands.indexOf(mine.winterSiegeTier) !== -1) return mine.winterSiegeTier;
  const stars = Number(mine.showdownStars);
  if (!mine.showdownStars || isNaN(stars)) return '';
  return bands.filter(function (band) {
    const range = band.match(/^(\d+)(?:-(\d+)|(\+))?$/);
    if (!range) return false;
    const low = Number(range[1]);
    const high = range[3] ? Infinity : range[2] ? Number(range[2]) : low;
    return stars >= low && stars <= high;
  })[0] || '';
}

// The Rewards fold: its tabs, the band chips (Star Rating or tier, mine marked and shown first), then the list.
function renderRewardsFold(eventType) {
  const all = app.lookups.rewardsByEventType[eventType.id] || [];
  const tabs = (EVENT_REWARD_TABS[eventType.id] || REWARD_TABS).filter(function (tab) { return all.some(function (row) { return row.list === tab[0]; }); });
  if (!tabs.length) return '';
  const list = tabs.some(function (tab) { return tab[0] === app.rewardTabs[eventType.id]; }) ? app.rewardTabs[eventType.id] : tabs[0][0];
  const rows = rewardRowsOf(eventType.id, list);
  const bands = [];
  rows.forEach(function (row) { if (row.band && bands.indexOf(row.band) === -1) bands.push(row.band); });
  const myBand = myRewardBand(bands);
  const chosen = app.rewardBands[eventType.id + '|' + list];
  const band = bands.indexOf(chosen) !== -1 ? chosen : myBand || bands[0] || '';
  let shown = band ? rows.filter(function (row) { return row.band === band; }) : rows;
  if (NUMBERED_REWARD_LISTS.indexOf(list) !== -1) {
    shown = shown.slice().sort(function (a, b) { return firstNumberIn(a.rowLabel) - firstNumberIn(b.rowLabel); });
  }

  let html = '<details class="points-list rewards-fold" open><summary>Rewards</summary>';
  if (tabs.length > 1) {
    html += '<div class="reward-tabs" style="grid-template-columns:repeat(' + tabs.length + ',1fr)">' + tabs.map(function (tab) {
      return '<button type="button" class="reward-tab' + (tab[0] === list ? ' on' : '') + '" data-reward-tab="' + escapeHtml(eventType.id + '|' + tab[0]) + '">' + escapeHtml(tab[1]) + '</button>';
    }).join('') + '</div>';
  }
  if (bands.length > 1) {
    const isStars = bands.every(function (one) { return /^\d/.test(one); });
    const hasLongNames = bands.some(function (one) { return one.length > 8; });
    html += '<div class="reward-bands' + (hasLongNames ? ' long-names' : '') + '">' + bands.map(function (one) {
      return '<button type="button" class="reward-band' + (one === band ? ' on' : '') + '" data-reward-band="' + escapeHtml(eventType.id + '|' + list + '|' + one) + '">' +
        escapeHtml(isStars ? one.replace('-', '–') + ' ★' : one) + (one === myBand ? '<span class="reward-yours">You</span>' : '') + '</button>';
    }).join('') + '</div>';
  }
  // The note of this list (and band) from the Rewards notes: its day name holds the list and band, like "ranking|Legion".
  const listNote = (app.lookups.pointSourcesByEventType[eventType.id] || []).filter(function (source) {
    return source.list === 'rewards' && (source.dayName === list + '|' + band || (!band && source.dayName === list));
  })[0];
  if (listNote) html += '<p class="points-note reward-note">' + escapeHtml(listNote.task) + '</p>';
  if (list === 'glory') {
    // Champion's Glory: each item with its name under it (alliance cosmetics, no quantity).
    const sections = [];
    shown.forEach(function (row) { if (sections.indexOf(row.section) === -1) sections.push(row.section); });
    html += sections.map(function (section) {
      return '<div class="reward-sub">' + escapeHtml(GLORY_SECTION_NAMES[section] || section) + '</div><div class="merchant-grid glory-grid">' +
        shown.filter(function (row) { return row.section === section; }).map(function (row) {
          const item = app.lookups.itemsById[row.itemId] || { name: row.itemId };
          return '<div class="merchant-offer">' + rewardTile(row) + '<span class="merchant-limit">' + escapeHtml(itemName(item)) + '</span></div>';
        }).join('') + '</div>';
    }).join('');
  } else if (list === 'combatant') {
    html += ['win', 'lose', 'personal-win', 'personal-lose'].map(function (section) {
      const sectionRows = shown.filter(function (row) { return row.section === section; });
      if (!sectionRows.length) return '';
      return '<div class="reward-sub">' + escapeHtml(COMBATANT_SECTION_NAMES[section]) + '</div>' +
        (/^personal/.test(section) ? '<div class="range-lines">' + rewardLines(sectionRows) + '</div>' : '<div class="reward-flat">' + sectionRows.map(rewardTile).join('') + '</div>');
    }).join('');
  } else if (list === 'targets' || list === 'medals' || list === 'ko') {
    // A line per row: Target Points, Medal of Honor, chapters, levels, spins, KO Rewards.
    const hasNotes = shown.some(function (row) { return row.note; });
    html += (list === 'targets' && band && bands.length === 1 ? '<div class="reward-sub">' + escapeHtml(band) + '</div>' : '') +
      '<div class="range-lines' + (hasNotes ? ' with-notes' : '') + '">' + rewardLines(shown) + '</div>';
  } else if (list === 'group') {
    // Alliance Championship Tier Rewards: the tier, its Prestige Rewards with their names, then a line per group rank.
    const prestige = shown.filter(function (row) { return row.section === 'prestige'; });
    html += (band && bands.length === 1 ? '<div class="reward-sub">' + escapeHtml(band) + '</div>' : '') +
      (prestige.length ? '<div class="reward-sub">Prestige Rewards</div><div class="merchant-grid glory-grid">' + prestige.map(function (row) {
        const item = app.lookups.itemsById[row.itemId] || { name: row.itemId };
        return '<div class="merchant-offer">' + rewardTile(row) + '<span class="merchant-limit">' + escapeHtml(itemName(item)) + '</span></div>';
      }).join('') + '</div>' : '') +
      '<div class="reward-sub">Group Ranking</div><div class="range-lines with-notes">' + rewardLines(shown.filter(function (row) { return row.section !== 'prestige'; })) + '</div>';
  } else if (list === 'rates') {
    // Lucky Wheel Reward Rates: one line per row, the chance, then the item with its name and quantity.
    html += '<div class="rate-lines">' + shown.map(function (row) {
      const item = app.lookups.itemsById[row.itemId] || { name: row.itemId };
      return '<div class="reward-row"><span class="reward-label">' + escapeHtml(row.rowLabel) + '</span><span class="reward-items">' + rewardTile(row) +
        '<span class="rate-name">' + escapeHtml(itemName(item) + (row.quantity ? ' ×' + row.quantity : '')) + '</span></span></div>';
    }).join('') + '</div>';
  } else if (list === 'ranking' || list === 'conquest') {
    const sections = [];
    shown.forEach(function (row) { if (sections.indexOf(row.section) === -1) sections.push(row.section); });
    // Ranks of 3 digits ("101–150") get a wider column, so they stay on one line.
    const hasWideLabels = shown.some(function (row) { return /\d{3}/.test(row.rowLabel); });
    html += (hasWideLabels ? '<div class="wide-labels">' : '') + sections.map(function (section) {
      return (section ? '<div class="reward-sub">' + escapeHtml(REWARD_SECTION_NAMES[section] || section) + '</div>' : '') +
        rewardLines(shown.filter(function (row) { return row.section === section; }));
    }).join('') + (hasWideLabels ? '</div>' : '');
  } else if (list === 'star' || list === 'daily') {
    const names = list === 'daily' ? DAILY_SECTION_NAMES : REWARD_SECTION_NAMES;
    html += ['win', 'lose'].map(function (section) {
      const sectionRows = shown.filter(function (row) { return row.section === section; });
      return sectionRows.length ? '<div class="reward-sub">' + escapeHtml(names[section]) + '</div><div class="reward-flat">' + sectionRows.map(rewardTile).join('') + '</div>' : '';
    }).join('');
  } else if (list === 'tier') {
    // Win Streak, Victory and Loss, each with how the tier changes.
    html += ['streak', 'win', 'lose'].map(function (section) {
      const sectionRows = shown.filter(function (row) { return row.section === section; });
      if (!sectionRows.length) return '';
      return '<div class="reward-row"><span class="reward-label">' + escapeHtml(TIER_RESULT_NAMES[section]) +
        '<small>Tier ' + escapeHtml(sectionRows[0].rowLabel.replace('-', '−')) + '</small></span>' +
        '<span class="reward-items">' + sectionRows.map(rewardTile).join('') + '</span></div>';
    }).join('');
  } else if (list === 'merchant' || list === 'shop') {
    // Each offer: the item, its price in the shop's currency (Winter Badges, Crystallite Cores) and how many can be bought.
    const currencyItem = app.lookups.itemsById[list === 'merchant' ? 'winter-badge' : SHOP_CURRENCIES[eventType.id]];
    const currencyUrl = currencyItem ? assetUrl(currencyItem.imageFile) : '';
    html += '<div class="merchant-grid">' + shown.map(function (row) {
      return '<div class="merchant-offer">' + rewardTile(row) +
        '<span class="merchant-price">' + (currencyUrl ? '<img src="' + escapeHtml(currencyUrl) + '" alt="' + escapeHtml(currencyItem.name) + '" onerror="this.remove()">' : '') + escapeHtml(row.rowLabel) + '</span>' +
        (row.note ? '<span class="merchant-limit">' + escapeHtml(row.note) + '</span>' : '') + '</div>';
    }).join('') + '</div>';
  }
  if (shown.some(function (row) { return row.source === 'guides'; })) html += '<p class="reward-source">From guides, not checked in game yet.</p>';
  return html + '</details>';
}

// Expert pictures for the extra chests some experts add (Baldur: Alliance Showdown).

// A day's Daily Chests in an event's timeline (opened from the day's row): each chest's points and items,

/* ---------- Alliance Showdown: Total score ----------
   Per alliance and run, admins note the opponent, who won each day and the day's MVP. Each won day is worth its
   horns (Victory Points); the alliance with more horns at the end wins. */

const ROMAN_NUMERALS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'];

// The win horn: the gold horn picture (the same for both sides and in the table's head).
function hornMarkup() {
  const item = app.lookups.itemsById['showdown-win-horn'];
  const url = item ? assetUrl(item.imageFile) : '';
  if (!url) return '<span class="horn-fallback">◆</span>';
  return '<img class="win-horn" src="' + escapeHtml(url) + '" alt="" aria-hidden="true">';
}

// The saved score of one alliance in one run, or an empty one.
function matchScoreFor(occurrence, allianceId) {
  const date = textFromDay(occurrence.originalDay);
  return (app.data.matchScores || []).filter(function (row) {
    return row.scheduleId === occurrence.scheduleId && row.originalDate === date && row.allianceId === allianceId;
  })[0] || { scheduleId: occurrence.scheduleId, originalDate: date, allianceId: allianceId, opponentState: '', opponentAlliance: '', winners: '', mvps: '' };
}

function renderScoreFold(occurrence) {
  const eventType = occurrence.eventType;
  const horns = rewardRowsOf(eventType.id, 'horns');
  if (!horns.length || occurrence.scheduleId === TRANSFER_SCHEDULE_ID) return '';
  const date = textFromDay(occurrence.originalDay);
  // The alliances to choose from: those with a score in this run, and mine.
  const withScore = (app.data.matchScores || []).filter(function (row) { return row.scheduleId === occurrence.scheduleId && row.originalDate === date; })
    .map(function (row) { return row.allianceId; });
  const choices = sortedAlliances().filter(function (alliance) { return withScore.indexOf(alliance.id) !== -1 || alliance.id === app.myAllianceId; });
  if (!choices.length && !app.data.isAdmin) return '';
  const pickable = app.data.isAdmin ? sortedAlliances() : choices;
  const allianceId = pickable.some(function (alliance) { return alliance.id === app.scoreAllianceId; }) ? app.scoreAllianceId :
    pickable.some(function (alliance) { return alliance.id === app.myAllianceId; }) ? app.myAllianceId : (choices[0] || pickable[0] || {}).id;
  if (!allianceId) return '';
  const alliance = app.lookups.alliancesById[allianceId];
  const score = matchScoreFor(occurrence, allianceId);
  const winners = score.winners ? score.winners.split(',') : [];
  const mvps = score.mvps ? score.mvps.split('|') : [];
  let ours = 0, theirs = 0;
  horns.forEach(function (row) {
    const index = Number(row.band) - 1;
    if (winners[index] === 'us') ours += Number(row.quantity) || 0;
    if (winners[index] === 'them') theirs += Number(row.quantity) || 0;
  });
  const ourTag = alliance ? alliance.tag || alliance.name : '';
  const theirTag = score.opponentAlliance || '';
  const now = todayDay();
  const today = now >= occurrence.startDay && now <= occurrence.endDay ? eventDayFor(occurrence, now) : 0;

  let html = '<details class="points-list score-fold" open><summary>Total score</summary>';
  if (pickable.length > 1) {
    html += '<div class="reward-bands">' + pickable.map(function (one) {
      return '<button type="button" class="reward-band' + (one.id === allianceId ? ' on' : '') + '" data-score-alliance="' + escapeHtml(one.id) + '">' + escapeHtml(one.tag || one.name) + '</button>';
    }).join('') + '</div>';
  }
  html += '<div class="score-head"><div class="score-side us"><b>' + escapeHtml(ourTag) + '</b><span>#' + escapeHtml(String(app.data.stateNumber)) + '</span></div>' +
    '<div class="score-total">' + hornMarkup() + '<span class="us">' + ours + '</span><span class="dash">–</span><span class="them">' + theirs + '</span>' + hornMarkup() + '</div>' +
    '<div class="score-side them"><b>' + escapeHtml(theirTag || '—') + '</b><span>' + escapeHtml(score.opponentState ? '#' + score.opponentState : '') + '</span></div></div>';
  html += '<table class="score-table"><tr><th>Stage</th><th>Matches</th><th class="num">' + hornMarkup() + '</th><th>Alliance</th></tr>' +
    horns.map(function (row) {
      const dayNumber = Number(row.band);
      const winner = winners[dayNumber - 1] || '';
      const mvp = mvps[dayNumber - 1] || '';
      const winnerText = winner === 'us' ? ourTag : winner === 'them' ? theirTag || 'Opponent' : winner === 'tie' ? 'Tie' : '—';
      return '<tr' + (dayNumber === today ? ' class="today"' : '') + '><td class="stage">' + (ROMAN_NUMERALS[dayNumber - 1] || dayNumber) + '</td>' +
        '<td>' + escapeHtml(dayNameOf(eventType.id, dayNumber) || 'Day ' + dayNumber) + (mvp ? '<span class="score-mvp">MVP · ' + escapeHtml(mvp) + '</span>' : '') + '</td>' +
        '<td class="num">' + escapeHtml(row.quantity) + '</td><td class="win-' + (winner || 'none') + '">' + escapeHtml(winnerText) + '</td></tr>';
    }).join('') + '</table>';
  if (app.data.isAdmin) {
    html += '<div class="score-edit">' + pencilButton('data-edit-score="' + escapeHtml(occurrence.scheduleId + '|' + date + '|' + allianceId) + '"', 'Edit the score of ' + ourTag, 'Edit score') + '</div>';
  }
  return html + '</details>';
}

// Admins: the opponent, each day's winner and MVP for one alliance in one run.
function openScoreDialog(scheduleId, dateText, allianceId) {
  const schedule = app.lookups.schedulesById[scheduleId];
  const alliance = app.lookups.alliancesById[allianceId];
  if (!schedule || !alliance) return;
  const score = (app.data.matchScores || []).filter(function (row) {
    return row.scheduleId === scheduleId && row.originalDate === dateText && row.allianceId === allianceId;
  })[0] || { id: '', opponentState: '', opponentAlliance: '', winners: '', mvps: '' };
  const winners = score.winners ? score.winners.split(',') : [];
  const mvps = score.mvps ? score.mvps.split('|') : [];
  const horns = rewardRowsOf(schedule.eventTypeId, 'horns');
  const winnerOptions = [{ value: '', label: 'Not played yet' }, { value: 'us', label: alliance.tag || alliance.name }, { value: 'them', label: 'Opponent' }, { value: 'tie', label: 'Tie' }];
  const dayFields = horns.map(function (row) {
    const dayNumber = Number(row.band);
    return { row: [
      { name: 'winner' + dayNumber, label: (ROMAN_NUMERALS[dayNumber - 1] || dayNumber) + ' · ' + (dayNameOf(schedule.eventTypeId, dayNumber) || 'Day ' + dayNumber), type: 'select', options: winnerOptions, value: winners[dayNumber - 1] || '' },
      { name: 'mvp' + dayNumber, label: 'MVP', type: 'text', value: mvps[dayNumber - 1] || '' }
    ] };
  });
  openFormDialog({
    title: 'Score · ' + allianceDisplayName(alliance),
    fields: [{ row: [
      { name: 'opponentState', label: 'Opponent state', type: 'number', value: score.opponentState },
      { name: 'opponentAlliance', label: 'Opponent alliance', type: 'text', value: score.opponentAlliance, help: 'Its tag, for example THE' }
    ] }].concat(dayFields),
    saveLabel: 'Save',
    onSave: function (values) {
      const dayCount = horns.reduce(function (highest, row) { return Math.max(highest, Number(row.band) || 0); }, 0);
      const winnerList = [], mvpList = [];
      for (let dayNumber = 1; dayNumber <= dayCount; dayNumber++) {
        winnerList.push(values['winner' + dayNumber] || '');
        mvpList.push((values['mvp' + dayNumber] || '').replace(/\|/g, ' '));
      }
      return saveRecordAndRefresh('MatchScores', { id: score.id, scheduleId: scheduleId, originalDate: dateText, allianceId: allianceId,
        opponentState: values.opponentState, opponentAlliance: values.opponentAlliance,
        winners: winnerList.join(','), mvps: mvpList.join('|') });
    },
    onDelete: score.id ? function () { return deleteRecordAndRefresh('MatchScores', score.id); } : null
  });
}

/* ---------- Heroes that change with the generation ----------
   Some rewards name a hero that changes when the state moves to the next generation: Fortress rewards and
   Hero's Mission give the heroes of 2 generations back. In point rows and notes, {eventsHero} and
   {luckyWheelHero} are replaced by that hero (from WOS Wiki, each hero's "Sources"). */

const HEROES_BY_GENERATION = {
  9: { luckyWheel: 'Fred', events: 'Xura' },
  10: { luckyWheel: 'Blanchette', events: 'Gregory' },
  11: { luckyWheel: 'Eleonora', events: 'Lloyd' },
  12: { luckyWheel: 'Karol', events: 'Ligeia' },
  13: { luckyWheel: 'Vulcanus', events: 'Gisela' },
  14: { luckyWheel: 'Elif', events: 'Dominic' },
  15: { luckyWheel: 'Estrella', events: 'Viveca' },
  16: { luckyWheel: 'Aisling', events: 'Seigel' },
  17: { luckyWheel: 'Aiden', events: 'Bertha' }
};
const REWARD_GENERATIONS_BACK = 2;

// The state's generation on a day: from the transfer list, the generation of the last transfer date on or before
// that day (before the first date: the first one). Empty list = unknown (null).
function generationOnDay(day) {
  const groups = (app.data.transferGroups || []).filter(function (group) {
    return !isNaN(dayFromText(group.transferDate)) && /\d+/.test(group.generation || '');
  }).sort(function (a, b) { return dayFromText(a.transferDate) - dayFromText(b.transferDate); });
  if (!groups.length) return null;
  let current = groups[0];
  groups.forEach(function (group) { if (dayFromText(group.transferDate) <= day) current = group; });
  return Number(current.generation.match(/\d+/)[0]);
}

// Puts the right hero names into a text (see above). Without a known hero the words stay general.
function fillHeroNames(text, day) {
  if (!text || text.indexOf('{') === -1) return text;
  const generation = isNaN(day) ? null : generationOnDay(day);
  const heroes = generation ? HEROES_BY_GENERATION[generation - REWARD_GENERATIONS_BACK] : null;
  return text
    .replace(/\{eventsHero\}/g, heroes ? heroes.events : 'Events hero')
    .replace(/\{luckyWheelHero\}/g, heroes ? heroes.luckyWheel : 'Lucky Wheel hero');
}

function renderNextUp() {
  const container = document.getElementById('nextUp');
  const now = nowMinute();
  const today = Math.floor(now / MINUTES_PER_DAY);
  const upcoming = buildOccurrences(today, today + 60)
    .filter(function (occurrence) {
      return isStateWide(occurrence) && ['state', 'alliance'].indexOf(occurrence.eventType.category) !== -1 && occurrence.startMinute > now && !occurrence.isCancelled;
    })
    .sort(compareOccurrences)
    .slice(0, 2);

  container.innerHTML = upcoming.map(function (occurrence, index) {
    const eventType = occurrence.eventType;
    const color = eventType.color || '#AFC8F5';
    const startText = clockText(occurrence.startMinute);
    const when = formatDayShort(shownDayOf(occurrence.startMinute)) + (startText === '00:00' ? '' : ' · ' + startText);
    // A 40 px icon with "Next up" and the event's name on 2 lines to its right; the date under them.
    return '<div class="next-tile glass" style="' + tintedPanelStyle(color) + '">' +
      '<div class="next-tile-head">' + eventBadgeMarkup(eventType, '') +
      '<div class="next-tile-names"><span class="next-tile-label">' + (index === 0 ? 'Next up' : 'Then') + '</span>' +
      '<span class="next-tile-title">' + escapeHtml(eventType.name) + '</span></div></div>' +
      '<span class="event-note">' + escapeHtml(when) + '</span></div>';
  }).join('');
}

function compareOccurrences(a, b) {
  return a.startMinute - b.startMinute ||
    (Number(a.eventType.sortOrder) || 99) - (Number(b.eventType.sortOrder) || 99);
}

/* ================================================================== */
/* Fortress Battles page                                               */
/* ================================================================== */

// Phase 1's battle day of the season that holds the given day (seasons are 8 weekly phases).
function fortressSeasonStartFor(day) {
  const firstStart = dayFromText(app.data.settings.fortressSeasonStart);
  if (isNaN(firstStart)) return NaN;
  const seasonLength = FORT_PHASES * 7;
  // Phase 1's week starts 6 days before its battle day.
  return firstStart + Math.floor((day - (firstStart - 6)) / seasonLength) * seasonLength;
}

// The battle day (Friday) of the phase shown on the Fortress page: the one picked with the arrows, else this week's.
function fortressShownBattleDay() {
  if (app.fortressPhaseDay !== null && !isNaN(app.fortressPhaseDay)) return app.fortressPhaseDay;
  const today = todayDay();
  const seasonStart = fortressSeasonStartFor(today);
  // This week's phase: the first battle day that is today or later.
  let battleDay = seasonStart;
  while (battleDay < today) battleDay += 7;
  return battleDay;
}

// The game's name of a fortress or stronghold: "F1" = "Fortress No. 1", "SH2" = "Stronghold No. 2".
function fortFullName(fort) {
  return (/^SH/.test(fort) ? 'Stronghold No. ' : 'Fortress No. ') + fort.replace(/^\D+/, '');
}

// The holders and battle times of one phase, by fort: { allianceId, battleTimeUtc, id }.
function fortHoldersOfPhase(seasonText, phase) {
  const byFort = {};
  (app.data.fortHolders || []).forEach(function (row) {
    if (row.seasonStart === seasonText && Number(row.phase) === phase) byFort[row.fort] = row;
  });
  return byFort;
}

// The item of a fortress reward, found by its name ("Fire Crystals" = Fire Crystal,
// "Enhancement XP Component" = 100 Enhancement XP Component). None = null.
function fortRewardItem(rewardName) {
  if (!rewardName) return null;
  const simple = function (text) { return String(text).toLowerCase().replace(/^\d+\s+/, '').replace(/s$/, '').trim(); };
  const wanted = simple(rewardName);
  return (app.data.items || []).filter(function (one) { return simple(one.name) === wanted; })[0] || null;
}

// Fortress hero shards move on with the state's generation: a reward written for generation N (Settings,
// fortRewardsGeneration) names a hero of some generation; one generation later it is the next generation's hero with
// the same source (Lucky Wheel or events), e.g. Fred Shards then Blanchette Shards. Other rewards stay as written.
function fortRewardOnDay(rewardRow, day) {
  const match = String(rewardRow.reward || '').match(/^(\S+) Shards$/);
  const writtenFor = Number(app.data.settings.fortRewardsGeneration);
  const now = generationOnDay(day);
  if (!match || !writtenFor || !now || now === writtenFor) return rewardRow;
  let heroGeneration = 0, source = '';
  Object.keys(HEROES_BY_GENERATION).forEach(function (generation) {
    const heroes = HEROES_BY_GENERATION[generation];
    if (heroes.luckyWheel === match[1]) { heroGeneration = Number(generation); source = 'luckyWheel'; }
    if (heroes.events === match[1]) { heroGeneration = Number(generation); source = 'events'; }
  });
  const shifted = HEROES_BY_GENERATION[heroGeneration + now - writtenFor];
  if (!source || !shifted) return rewardRow;
  return Object.assign({}, rewardRow, { reward: shifted[source] + ' Shards' });
}

// A Fortress reward's tile: its picture, its colour and its quantity from the FortRewards tab. In the season totals
// the quantity is multiplied by the wins ("2 × 400" shows 800); without a quantity, the wins show as "×2".
// A reward without a picture yet shows the "?" tile.
function fortRewardTile(rewardRow, wins) {
  const item = fortRewardItem(rewardRow.reward);
  const amount = Number(String(rewardRow.quantity || '').replace(/,/g, ''));
  const times = wins || 1;
  const quantity = rewardRow.quantity && !isNaN(amount) ? (amount * times).toLocaleString('en-US')
    : rewardRow.quantity && times === 1 ? rewardRow.quantity : times > 1 ? '×' + times : '';
  return rewardTile({ itemId: item ? item.id : rewardRow.reward, quantity: quantity, tile: rewardRow.tile || '' });
}

// A reward name on 2 lines, split where the two lines are closest in length ("Fire Crystals" = "Fire" / "Crystals").
// A one-word name stays on one line.
function twoLineName(text) {
  const words = String(text || '').trim().split(/\s+/);
  if (words.length < 2) return escapeHtml(text || '');
  let bestSplit = 1, bestLongest = Infinity;
  for (let split = 1; split < words.length; split++) {
    const longest = Math.max(words.slice(0, split).join(' ').length, words.slice(split).join(' ').length);
    if (longest < bestLongest) { bestLongest = longest; bestSplit = split; }
  }
  return escapeHtml(words.slice(0, bestSplit).join(' ')) + '<br>' + escapeHtml(words.slice(bestSplit).join(' '));
}

// The colours of an alliance's banner on the Fortress cards. An academy uses its main alliance's colours, lighter.
function fortBannerColors(alliance) {
  const main = alliance.mainAllianceId ? app.lookups.alliancesById[alliance.mainAllianceId] : null;
  const owner = main || alliance;
  const base = owner.baseColor || '#6F9BE6';
  const second = owner.secondColor || '#AFC8F5';
  return { base: main ? mixWithWhite(base, 0.4) : base, second: main ? mixWithWhite(second, 0.3) : second };
}

// The alliance label: drawn like the calendar's event bars, a see-through fade of the alliance's colour
// from deep (left) to light (right), with a thin edge.
function fortBannerStyle(alliance) {
  const colors = fortBannerColors(alliance);
  const fade = barFadeColors({ color: colors.base, colorEnd: colors.base });
  return '--banner-base:' + colors.base + ';--banner-fill:linear-gradient(90deg,' + colorWithAlpha(fade.dark, 0.8) + ' 0%,' + colorWithAlpha(fade.middle, 0.68) + ' 40%,' +
    colorWithAlpha(fade.light, 0.58) + ' 100%);--banner-edge:' + colorWithAlpha(fade.middle, 0.55);
}

function renderFortressPage() {
  const page = document.getElementById('fortressPage');
  if (!app.data) { page.innerHTML = ''; return; }
  const isAdmin = app.data.isAdmin;
  const today = todayDay();

  if (isNaN(fortressSeasonStartFor(today))) {
    page.innerHTML = '<section class="admin-section glass"><h2>Fortress Battles</h2>' +
      '<p class="admin-help">The season dates are not set yet.' + (isAdmin ? ' Enter the battle day (Friday) of phase 1 of a season; the app counts the 8 phases and the next seasons from it.' : '') + '</p>' +
      (isAdmin ? '<label class="form-field"><span>Phase 1 battle day</span><input class="text-input" id="fortressStartInput" type="date"></label>' +
        '<div><button type="button" class="primary-button" data-fortress-action="save-start">Save</button></div>' : '') + '</section>';
    attachFortressHandlers(page);
    return;
  }

  const battleDay = fortressShownBattleDay();
  const seasonStart = fortressSeasonStartFor(battleDay);
  const seasonText = textFromDay(seasonStart);
  const phase = Math.round((battleDay - seasonStart) / 7) + 1;
  app.fortressSeasonStartDay = seasonStart;
  const isThisWeek = today > battleDay - 7 && today <= battleDay;
  const editing = isAdmin && app.fortressEditing;
  const rewardsByFort = {};
  (app.data.fortRewards || []).forEach(function (row) { if (Number(row.phase) === phase) rewardsByFort[row.fort] = fortRewardOnDay(row, battleDay); });
  const holders = fortHoldersOfPhase(seasonText, phase);

  const arrow = function (action, label, path) {
    return '<button type="button" class="icon-button" data-fortress-action="' + action + '" aria-label="' + label + '"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + path + '"/></svg></button>';
  };
  let html = '<section class="admin-section glass fortress-section"><div class="section-head"><h2>Fortress Battles</h2><span class="fortress-head-buttons">' +
    (editing ? '' : '<button type="button" class="ghost-button fortress-totals-button" data-fortress-action="totals">' +
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg>Season totals</button>') +
    (isAdmin ? (editing ? '<button type="button" class="primary-button fortress-done-button" data-fortress-action="edit-done">Done</button>'
      : pencilButton('data-fortress-action="edit"', 'Set the alliances and battle times')) : '') + '</span></div>' +
    '<div class="period-nav fortress-nav">' + arrow('previous', 'Previous phase', 'M15 18l-6-6 6-6') +
    '<span class="fortress-title">Phase ' + phase + ' · ' + escapeHtml(formatDayShort(battleDay)) +
    '<small>Season ' + escapeHtml(formatDayShort(seasonStart) + ' – ' + formatDayShort(seasonStart + (FORT_PHASES - 1) * 7)) + (isThisWeek ? ' · this week' : '') + '</small></span>' +
    arrow('next', 'Next phase', 'M9 18l6-6-6-6') + '</div>' +
    (editing ? '<p class="admin-help">Pick who fights for or holds each fortress and stronghold. Each change is saved right away.' +
      (isAdmin ? ' ' + pencilButton('data-fortress-action="edit-start"', 'Change the season dates', 'Season dates') : '') + '</p>' : '');

  const card = function (fort) {
    const holderRow = holders[fort];
    const holder = holderRow ? app.lookups.alliancesById[holderRow.allianceId] : null;
    const rewardRow = rewardsByFort[fort] || { reward: '', quantity: '', tile: '' };
    const isStronghold = /^SH/.test(fort);
    const fullName = fortFullName(fort);
    let holderHtml;
    if (editing) {
      holderHtml = '<select class="fort-card-select' + (holder ? ' fort-banner' : '') + '" data-fort-holder="' + fort + '"' + (holder ? ' style="' + fortBannerStyle(holder) + '"' : '') + '>' +
        '<option value="">—</option>' + sortedAlliances().map(function (alliance) {
          return '<option value="' + alliance.id + '"' + (holder && holder.id === alliance.id ? ' selected' : '') + '>' + escapeHtml(alliance.tag || alliance.name) + '</option>';
        }).join('') + '</select>';
    } else {
      holderHtml = holder ? '<span class="fort-banner" style="' + fortBannerStyle(holder) + '"><span>' + escapeHtml(holder.tag || holder.name) + '</span></span>'
        : '<span class="fort-banner empty"><span>—</span></span>';
    }
    return '<div class="fort-card' + (isStronghold ? ' stronghold' : '') + (holder ? ' held' : '') + '"' + (holder ? ' style="' + fortBannerStyle(holder) + '"' : '') + '>' +
      '<span class="fort-card-name">' + fullName + '</span>' +
      // Edit mode: a pencil on the reward's corner opens the reward, quantity, tile colour and battle time.
      '<span class="fort-card-picture">' + fortRewardTile(rewardRow) +
      (editing ? pencilButton('data-fort-cell="' + fort + '|' + phase + '"', 'Edit ' + fullName + ' (reward and battle time)') : '') + '</span>' +
      '<span class="fort-card-reward">' + twoLineName(rewardRow.reward) + '</span>' + holderHtml + '</div>';
  };
  html += '<div class="fort-cards">' + FORT_NAMES.filter(function (fort) { return /^F/.test(fort); }).map(card).join('') + '</div>' +
    '<div class="fort-cards strongholds">' + FORT_NAMES.filter(function (fort) { return /^SH/.test(fort); }).map(card).join('') + '</div></section>';

  page.innerHTML = html;
  attachFortressHandlers(page);
}

// Season totals: every main alliance's forts, strongholds and rewards in the season of the shown phase.
// An academy's forts count toward its main alliance.
function openFortressTotalsDialog() {
  const seasonStart = fortressSeasonStartFor(fortressShownBattleDay());
  const seasonText = textFromDay(seasonStart);
  const rewardsByCell = {};
  (app.data.fortRewards || []).forEach(function (row) { rewardsByCell[row.fort + '|' + row.phase] = row; });
  const totals = {};
  (app.data.fortHolders || []).forEach(function (row) {
    const alliance = app.lookups.alliancesById[row.allianceId];
    if (row.seasonStart !== seasonText || !alliance) return;
    const mainId = alliance.mainAllianceId || alliance.id;
    if (!totals[mainId]) totals[mainId] = { forts: 0, strongholds: 0, rewards: {}, order: [] };
    const total = totals[mainId];
    if (/^SH/.test(row.fort)) total.strongholds++; else total.forts++;
    const writtenRow = rewardsByCell[row.fort + '|' + row.phase];
    if (!writtenRow || !writtenRow.reward) return;
    const rewardRow = fortRewardOnDay(writtenRow, seasonStart + (Number(row.phase) - 1) * 7);
    const reward = rewardRow.reward;
    if (!total.rewards[reward]) { total.rewards[reward] = { row: rewardRow, wins: 0 }; total.order.push(reward); }
    total.rewards[reward].wins++;
  });
  const cards = sortedAlliances().filter(function (alliance) { return !alliance.mainAllianceId && totals[alliance.id]; }).map(function (alliance) {
    const total = totals[alliance.id];
    const counts = [total.forts ? total.forts + (total.forts === 1 ? ' fortress' : ' fortresses') : '', total.strongholds ? total.strongholds + (total.strongholds === 1 ? ' stronghold' : ' strongholds') : '']
      .filter(Boolean).join(' · ');
    return '<div class="totals-card">' + allianceLogoMarkup(alliance, 36) + '<div class="totals-body"><strong>' + escapeHtml(allianceDisplayName(alliance)) + '</strong>' +
      '<span class="admin-item-meta">' + escapeHtml(counts) + '</span>' +
      '<div class="totals-tiles">' + total.order.map(function (reward) {
        return '<span class="totals-tile">' + fortRewardTile(total.rewards[reward].row, total.rewards[reward].wins) + '<span>' + twoLineName(reward) + '</span></span>';
      }).join('') + '</div></div></div>';
  }).join('');
  closeDialog();
  const backdrop = document.createElement('div');
  backdrop.className = 'dialog-backdrop';
  backdrop.id = 'dialogBackdrop';
  backdrop.innerHTML = '<div class="dialog-box" role="dialog" aria-modal="true" aria-label="Season totals"><h2>Season totals</h2>' +
    '<p class="admin-help">Season ' + escapeHtml(formatDayShort(seasonStart) + ' – ' + formatDayShort(seasonStart + (FORT_PHASES - 1) * 7)) + '. Academies count toward their main alliance.</p>' +
    (cards || '<span class="admin-item-meta">No holders set for this season yet.</span>') +
    '<div class="dialog-actions"><button type="button" class="ghost-button" data-cancel-button>Close</button></div></div>';
  document.body.appendChild(backdrop);
  backdrop.querySelector('[data-cancel-button]').addEventListener('click', closeDialog);
  backdrop.addEventListener('click', function (event) { if (event.target === backdrop) closeDialog(); });
  hideToast();
}

// Saves one fort's alliance from the cards in edit mode (its battle time stays as it is).
function saveFortCard(fort, values) {
  const battleDay = fortressShownBattleDay();
  const seasonStart = fortressSeasonStartFor(battleDay);
  const seasonText = textFromDay(seasonStart);
  const phase = Math.round((battleDay - seasonStart) / 7) + 1;
  const holderRow = fortHoldersOfPhase(seasonText, phase)[fort];
  const record = { id: holderRow ? holderRow.id : '', seasonStart: seasonText, fort: fort, phase: String(phase),
    allianceId: holderRow ? holderRow.allianceId : '', battleTimeUtc: holderRow ? holderRow.battleTimeUtc || '' : '' };
  return saveRecordAndRefresh('FortHolders', Object.assign(record, values));
}

function attachFortressHandlers(page) {
  page.onchange = function (event) {
    const holderSelect = event.target.closest('[data-fort-holder]');
    if (holderSelect) saveFortCard(holderSelect.getAttribute('data-fort-holder'), { allianceId: holderSelect.value });
  };
  page.onclick = function (event) {
    const cellButton = event.target.closest('[data-fort-cell]');
    if (cellButton) {
      const parts = cellButton.getAttribute('data-fort-cell').split('|');
      openFortCellDialog(parts[0], parts[1]);
      return;
    }
    const actionButton = event.target.closest('[data-fortress-action]');
    if (!actionButton) return;
    const action = actionButton.getAttribute('data-fortress-action');
    if (action === 'previous') { app.fortressPhaseDay = fortressShownBattleDay() - 7; renderFortressPage(); }
    if (action === 'next') { app.fortressPhaseDay = fortressShownBattleDay() + 7; renderFortressPage(); }
    if (action === 'edit') { app.fortressEditing = true; renderFortressPage(); }
    if (action === 'edit-done') { app.fortressEditing = false; renderFortressPage(); }
    if (action === 'totals') openFortressTotalsDialog();
    if (action === 'save-start') saveSettingFromButton('fortressSeasonStart', document.getElementById('fortressStartInput').value);
    if (action === 'edit-start') {
      openFormDialog({
        title: 'Season dates',
        intro: 'The battle day (Friday) of phase 1 of any season. The app counts 8 weekly phases per season from it.',
        fields: [{ name: 'start', label: 'Phase 1 battle day', type: 'date', value: app.data.settings.fortressSeasonStart }],
        saveLabel: 'Save',
        onSave: function (values) {
          return callServer('saveSetting', app.sessionToken, 'fortressSeasonStart', values.start).then(function (data) {
            app.fortressPhaseDay = null;
            receiveData(data);
            renderEverything();
            showToast('Saved.');
          });
        }
      });
    }
  };
}

// Admin: the alliance and battle time of a fortress in one phase, and its reward.
// seasonText: the season (phase 1 battle day); empty = the season shown on the Fortress page.
function openFortCellDialog(fort, phase, seasonText) {
  const seasonStart = seasonText ? dayFromText(seasonText)
    : app.fortressSeasonStartDay === null ? fortressSeasonStartFor(todayDay()) : app.fortressSeasonStartDay;
  seasonText = textFromDay(seasonStart);
  phase = String(phase);
  const holderRow = (app.data.fortHolders || []).filter(function (row) { return row.seasonStart === seasonText && row.fort === fort && row.phase === phase; })[0];
  const rewardRow = (app.data.fortRewards || []).filter(function (row) { return row.fort === fort && row.phase === phase; })[0];
  openFormDialog({
    title: fortFullName(fort) + ' · phase ' + phase,
    intro: 'Battle on ' + formatDayLong(seasonStart + (Number(phase) - 1) * 7) + '. Its rewards expire 24 hours after the battle. The reward is the same every season; change it only if the game changes it.',
    fields: [
      { name: 'allianceId', label: 'Alliance', type: 'select', value: holderRow ? holderRow.allianceId : '',
        options: [{ value: '', label: 'Not set / another state alliance' }].concat(sortedAlliances().map(function (alliance) { return { value: alliance.id, label: allianceDisplayName(alliance) }; })),
        help: 'Who fights for it (before the battle) or who took it (after).' },
      { name: 'battleTimeUtc', label: 'Battle time (UTC)', type: 'time', value: holderRow ? holderRow.battleTimeUtc || '' : '' },
      { name: 'reward', label: 'Reward', type: 'text', value: rewardRow ? rewardRow.reward : '',
        help: app.data.settings.fortRewardsGeneration ? 'Hero shards: the hero of Gen ' + app.data.settings.fortRewardsGeneration + '. The app moves it on with the state\'s generation.' : '' },
      { name: 'quantity', label: 'Quantity', type: 'text', value: rewardRow ? rewardRow.quantity || '' : '' },
      { name: 'tile', label: 'Tile colour', type: 'select', value: rewardRow ? rewardRow.tile || '' : '',
        options: [['', 'None'], ['grey', 'Grey'], ['green', 'Green'], ['blue', 'Blue'], ['purple', 'Purple'], ['orange', 'Orange']].map(function (choice) {
          return { value: choice[0], label: choice[1] };
        }) }
    ],
    saveLabel: 'Save',
    onSave: function (values) {
      let work = Promise.resolve();
      const rewardChanged = !rewardRow || values.reward !== rewardRow.reward || values.quantity !== (rewardRow.quantity || '') || values.tile !== (rewardRow.tile || '');
      if (rewardChanged) {
        work = work.then(function () {
          return callServer('saveRecord', app.sessionToken, 'FortRewards', { id: rewardRow ? rewardRow.id : '', fort: fort, phase: phase,
            reward: values.reward, quantity: values.quantity, tile: values.tile });
        });
      }
      return work.then(function () {
        return saveRecordAndRefresh('FortHolders', { id: holderRow ? holderRow.id : '', seasonStart: seasonText, fort: fort, phase: String(phase), allianceId: values.allianceId, battleTimeUtc: values.battleTimeUtc });
      });
    }
  });
}

/* State and alliance pages (for recruits)                             */
