function renderAlliancesPage() {
  const page = document.getElementById('alliancesPage');
  if (!app.data) { page.innerHTML = ''; return; }
  if (app.profileId && app.profileId !== 'state' && !app.lookups.alliancesById[app.profileId]) app.profileId = '';
  if (!app.profileId) page.innerHTML = renderProfileList();
  else page.innerHTML = renderProfile(app.profileId);
  page.onclick = function (event) {
    const openButton = event.target.closest('[data-open-profile]');
    if (openButton) {
      app.profileId = openButton.getAttribute('data-open-profile');
      renderAlliancesPage();
      scrollPagesToTop();
      return;
    }
    if (event.target.closest('[data-save-image]')) {
      saveProfileAsImage(app.profileId, (app.profileId === 'state' ? 'state-' + app.data.stateNumber : allianceFileName(app.lookups.alliancesById[app.profileId])) + '.png');
    }
    const allianceEdit = event.target.closest('[data-admin-action="edit-alliance"]');
    if (allianceEdit) openAllianceDialog(allianceEdit.getAttribute('data-id'));
  };
}

function renderProfileList() {
  const cards = sortedAlliances().map(function (alliance) {
    const main = alliance.mainAllianceId ? app.lookups.alliancesById[alliance.mainAllianceId] : null;
    return '<button type="button" class="profile-card" data-open-profile="' + escapeHtml(alliance.id) + '">' + allianceLogoMarkup(alliance, 44) +
      '<span><strong>' + escapeHtml(allianceDisplayName(alliance)) + '</strong><br><span class="admin-item-meta">' +
      escapeHtml(main ? 'Academy of ' + (main.tag || main.name) : 'Alliance') + '</span></span></button>';
  }).join('');
  return '<section class="admin-section glass"><h2>State &amp; alliances</h2>' +
    '<p class="admin-help">Pages to show recruits: regular times, the next 4 weeks and results. Each page can be saved as an image.</p>' +
    '<div class="profile-list"><button type="button" class="profile-card" data-open-profile="state"><span class="alliance-logo" style="width:44px;height:44px">' + app.data.stateNumber + '</span>' +
    '<span><strong>State ' + app.data.stateNumber + '</strong><br><span class="admin-item-meta">State events and results</span></span></button>' + cards + '</div>' +
    (sortedAlliances().length ? '' : '<span class="admin-item-meta">No alliances yet' + (app.data.isAdmin ? ': add them in Admin → Alliances.' : '.') + '</span>') + '</section>';
}

// Everything a state or alliance page shows, in one plain object (used for the page and for its image).
function buildProfileData(profileId) {
  const isState = profileId === 'state';
  const alliance = isState ? null : app.lookups.alliancesById[profileId];
  const today = todayDay();
  const data = { isState: isState, alliance: alliance, sections: [] };

  // Which events belong on this page.
  const belongsHere = function (occurrence) {
    if (isState) return isStateWide(occurrence) && ['state', 'alliance'].indexOf(occurrence.eventType.category) !== -1;
    return occurrence.allianceIds.indexOf(alliance.id) !== -1;
  };

  if (isState) {
    data.title = 'State ' + app.data.stateNumber;
    data.subtitle = sortedAlliances().filter(function (item) { return !item.mainAllianceId; }).map(function (item) { return item.tag || item.name; }).join(' · ');
  } else {
    const main = alliance.mainAllianceId ? app.lookups.alliancesById[alliance.mainAllianceId] : null;
    const academies = app.data.alliances.filter(function (item) { return item.mainAllianceId === alliance.id; });
    data.title = allianceDisplayName(alliance);
    data.subtitle = main ? 'Academy of ' + allianceDisplayName(main) : academies.length ? 'Academies: ' + academies.map(allianceDisplayName).join(', ') : 'State ' + app.data.stateNumber;
  }

  // Regular times: this alliance's own schedules.
  if (!isState) {
    const rows = [];
    app.data.schedules.forEach(function (schedule) {
      const eventType = app.lookups.eventTypesById[schedule.eventTypeId];
      if (!eventType || !schedule.allianceIds) return;
      if (schedule.allianceIds.split(',').indexOf(alliance.id) === -1) return;
      rows.push({ eventType: eventType, schedule: schedule });
    });
    rows.sort(function (a, b) { return (Number(a.eventType.sortOrder) || 99) - (Number(b.eventType.sortOrder) || 99) || (a.schedule.groupNumber || '').localeCompare(b.schedule.groupNumber || ''); });
    data.sections.push({ title: 'Regular times', empty: 'No times set yet.', rows: rows.map(function (row) {
      const schedule = row.schedule;
      const every = Number(schedule.repeatEveryDays) || 0;
      const firstDay = dayFromText(schedule.firstDate);
      // On the chosen clock: a start late in the UTC day can fall on the next day.
      const startMinute = firstDay * MINUTES_PER_DAY + Math.max(0, minutesFromTime(schedule.startTimeUtc));
      const shownFirstDay = schedule.startTimeUtc ? shownDayOf(startMinute) : firstDay;
      const when = (every === 7 ? 'Every ' + WEEKDAY_NAMES[partsFromDay(shownFirstDay).weekday] : every ? 'Every ' + every + ' days' : formatDayShort(shownFirstDay)) +
        (schedule.startTimeUtc ? ' · ' + clockText(startMinute) : '');
      return { left: eventDisplayName(row.eventType, schedule.label || groupLabel(row.eventType, schedule.groupNumber)), right: when, color: row.eventType.color };
    }) });
  }

  // The next 4 weeks.
  // Events that come back every week or more often (Bear, weekly battles) are listed once, at their next date.
  const shownFrequent = {};
  const upcoming = buildOccurrences(today, today + 27).filter(belongsHere).filter(function (occurrence) { return occurrence.endDay >= today; }).sort(compareOccurrences)
    .filter(function (occurrence) {
      const schedule = app.lookups.schedulesById[occurrence.scheduleId];
      const every = schedule ? Number(schedule.repeatEveryDays) || 0 : 0;
      if (every < 1 || every > 7) return true;
      if (shownFrequent[schedule.id]) return false;
      shownFrequent[schedule.id] = true;
      occurrence.frequencyText = every === 7 ? 'every week' : every === 1 ? 'every day' : 'every ' + every + ' days';
      return true;
    });
  data.sections.push({ title: 'Next 4 weeks', empty: 'Nothing planned.', rows: upcoming.map(function (occurrence) {
    const when = formatDayShort(Math.max(occurrence.startDay, today)) + (occurrence.lengthDays > 1 ? ' – ' + formatDayShort(occurrence.endDay) : '') +
      (occurrence.startTimeUtc ? ' · ' + clockText(occurrence.startMinute) : '');
    return { left: eventDisplayName(occurrence.eventType, occurrence.label),
      sub: [occurrence.frequencyText ? 'Next one, then ' + occurrence.frequencyText : '', opponentsText(findOpponents(occurrence))].filter(Boolean).join(' · '),
      right: when, color: occurrence.eventType.color };
  }) });

  // Results of the last 6 months (for an alliance also the events it played as the state alliance).
  const past = buildOccurrences(today - 182, today).filter(function (occurrence) {
    if (occurrence.startDay > today) return false;
    const change = changeFor(occurrence.scheduleId, occurrence.originalDay);
    if (isState) return belongsHere(occurrence) && !!(resultSummary(occurrence) || opponentsText(findOpponents(occurrence)));
    const asStateAlliance = !!(change && (change.stateAllianceId === alliance.id || change.presidentAllianceId === alliance.id));
    return (belongsHere(occurrence) || asStateAlliance) && !!(resultSummary(occurrence) || asStateAlliance);
  }).sort(function (a, b) { return b.startDay - a.startDay; });
  data.sections.push({ title: 'Results', empty: 'No results yet.', rows: past.map(function (occurrence) {
    const change = changeFor(occurrence.scheduleId, occurrence.originalDay);
    const asState = !isState && change && change.stateAllianceId === alliance.id ? 'as state alliance' : '';
    return { left: eventDisplayName(occurrence.eventType, occurrence.label), right: formatDayShort(occurrence.startDay), color: occurrence.eventType.color,
      sub: [opponentsText(findOpponents(occurrence)), resultSummary(occurrence), asState].filter(Boolean).join(' · ') };
  }) });
  return data;
}

function renderProfile(profileId) {
  const data = buildProfileData(profileId);
  const alliance = data.alliance;
  const back = '<button type="button" class="back-link" data-open-profile="">' +
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>All pages</button>';
  const logo = data.isState ? '<span class="profile-logo">' + app.data.stateNumber + '</span>' : allianceFullLogoMarkup(alliance);
  const colours = data.isState ? '' : '<div class="colour-pair"><span style="background:' + escapeHtml(alliance.baseColor || '#6F9BE6') + '"></span><span style="background:' + escapeHtml(alliance.secondColor || '#AFC8F5') + '"></span></div>';
  const head = '<div class="profile-head">' + logo + '<div style="flex:1;min-width:0"><h2>' + escapeHtml(data.title) + '</h2>' + colours +
    '<span class="admin-item-meta">' + escapeHtml(data.subtitle) + '</span></div>' +
    (!data.isState && app.data.isAdmin ? pencilButton('data-admin-action="edit-alliance" data-id="' + escapeHtml(alliance.id) + '"', 'Edit alliance') : '') + '</div>';
  const sections = data.sections.map(function (section) {
    const rows = section.rows.map(function (row) {
      return '<div class="info-row"><span><span class="small-row-dot" style="display:inline-block;margin-right:6px;background:' + escapeHtml(row.color || '#AFC8F5') + '"></span>' +
        escapeHtml(row.left) + (row.sub ? '<br><span class="admin-item-meta">' + escapeHtml(row.sub) + '</span>' : '') + '</span><span>' + escapeHtml(row.right) + '</span></div>';
    }).join('');
    return '<section class="admin-section glass"><h2>' + escapeHtml(section.title) + '</h2>' + (rows || '<span class="admin-item-meta">' + escapeHtml(section.empty) + '</span>') + '</section>';
  }).join('');
  return back + '<section class="admin-section glass">' + head + '</section>' + sections +
    '<div><button type="button" class="primary-button" data-save-image>Save as image</button></div>';
}

// The big logo for alliance pages: "<tag>-full.png", then the small logo, then the initials.
function allianceFullLogoMarkup(alliance) {
  const base = alliance.baseColor || '#6F9BE6';
  const second = alliance.secondColor || '#AFC8F5';
  const style = 'background:linear-gradient(135deg,' + mixWithWhite(base, 0.35) + ',' + mixWithWhite(second, 0.35) + ');border-color:' + base;
  const baseUrl = app.data.settings.imageBaseUrl;
  const smallUrl = alliance.logoUrl || (baseUrl ? baseUrl + allianceFileName(alliance) + '.png' : '');
  const fullUrl = baseUrl ? baseUrl + allianceFileName(alliance) + '-full.png' : smallUrl;
  const initials = escapeHtml((alliance.tag || alliance.name).slice(0, 3));
  if (!fullUrl) return '<span class="profile-logo" style="' + style + '">' + initials + '</span>';
  return '<span class="profile-logo" style="' + style + '" data-initials="' + initials + '"><img src="' + escapeHtml(fullUrl) + '" alt="" crossorigin="anonymous" ' +
    'data-small-url="' + escapeHtml(smallUrl) + '" onerror="useSmallLogo(this)"></span>';
}

function useSmallLogo(image) {
  const smallUrl = image.getAttribute('data-small-url');
  if (smallUrl && image.src !== smallUrl) {
    image.setAttribute('data-small-url', '');
    image.src = smallUrl;
    return;
  }
  const holder = image.parentElement;
  holder.textContent = holder.getAttribute('data-initials') || '';
}

// Draws a state or alliance page as a picture (1080 px wide) the person can save or share.
function saveProfileAsImage(profileId, fileName) {
  const data = buildProfileData(profileId);
  const width = 1080, padding = 56, rowHeight = 64, subHeight = 30;
  // Work out the height first.
  let height = padding + 200 + 30;
  data.sections.forEach(function (section) {
    height += 80;
    if (!section.rows.length) height += rowHeight;
    section.rows.forEach(function (row) { height += rowHeight + (row.sub ? subHeight : 0); });
    height += 24;
  });
  height += padding;

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext('2d');
  const base = data.alliance ? data.alliance.baseColor || '#6F9BE6' : '#6F9BE6';
  const second = data.alliance ? data.alliance.secondColor || '#AFC8F5' : '#4FB8C4';
  // Background: the app's dark navy with a haze of the alliance colours.
  context.fillStyle = '#0C1220';
  context.fillRect(0, 0, width, height);
  [[base, 0.15, 0.08], [second, 0.9, 0.35], ['#9C86E6', 0.2, 0.85]].forEach(function (haze) {
    const gradient = context.createRadialGradient(width * haze[1], height * haze[2], 0, width * haze[1], height * haze[2], width * 0.8);
    gradient.addColorStop(0, colorWithAlpha(haze[0], 0.32));
    gradient.addColorStop(1, colorWithAlpha(haze[0], 0));
    context.fillStyle = gradient;
    context.fillRect(0, 0, width, height);
  });

  const font = function (size, weight) { return weight + ' ' + size + 'px Manrope, system-ui, sans-serif'; };
  const fitText = function (text, maxWidth) {
    let result = String(text || '');
    while (result.length > 1 && context.measureText(result).width > maxWidth) result = result.slice(0, -2) + '…';
    return result;
  };

  return loadLogoForImage(data).then(function (logoImage) {
    // Header: logo, name, colours, subtitle.
    const logoSize = 170;
    context.fillStyle = colorWithAlpha(base, 0.35);
    roundedRect(context, padding, padding, logoSize, logoSize, 36);
    context.fill();
    if (logoImage) {
      context.drawImage(logoImage, padding + 8, padding + 8, logoSize - 16, logoSize - 16);
    } else {
      context.fillStyle = '#FFFFFF';
      context.font = font(data.isState ? 48 : 56, 800);
      context.textAlign = 'center';
      context.fillText(data.isState ? String(app.data.stateNumber) : (data.alliance.tag || data.alliance.name).slice(0, 3), padding + logoSize / 2, padding + logoSize / 2 + 18);
      context.textAlign = 'left';
    }
    const textLeft = padding + logoSize + 36;
    context.fillStyle = '#FFFFFF';
    context.font = font(54, 800);
    context.fillText(fitText(data.title, width - textLeft - padding), textLeft, padding + 70);
    if (!data.isState) {
      [base, second].forEach(function (colour, index) {
        context.fillStyle = colour;
        roundedRect(context, textLeft + index * 44, padding + 92, 34, 34, 8);
        context.fill();
      });
    }
    context.fillStyle = 'rgba(238,241,248,0.72)';
    context.font = font(28, 600);
    context.fillText(fitText(data.subtitle, width - textLeft - padding), textLeft, padding + (data.isState ? 120 : 160));

    let top = padding + 230;
    data.sections.forEach(function (section) {
      context.fillStyle = '#FFFFFF';
      context.font = font(36, 800);
      context.fillText(section.title, padding, top + 40);
      top += 80;
      if (!section.rows.length) {
        context.fillStyle = 'rgba(238,241,248,0.6)';
        context.font = font(28, 600);
        context.fillText(section.empty, padding, top + 36);
        top += rowHeight;
      }
      section.rows.forEach(function (row) {
        context.fillStyle = 'rgba(255,255,255,0.14)';
        context.fillRect(padding, top, width - padding * 2, 2);
        context.fillStyle = row.color || '#AFC8F5';
        context.beginPath();
        context.arc(padding + 10, top + 38, 9, 0, Math.PI * 2);
        context.fill();
        context.font = font(28, 600);
        context.fillStyle = 'rgba(238,241,248,0.72)';
        const rightWidth = Math.min(context.measureText(row.right).width, 420);
        context.textAlign = 'right';
        context.fillText(fitText(row.right, 420), width - padding, top + 46);
        context.textAlign = 'left';
        context.fillStyle = '#FFFFFF';
        context.font = font(30, 700);
        context.fillText(fitText(row.left, width - padding * 2 - rightWidth - 60), padding + 32, top + 46);
        if (row.sub) {
          context.fillStyle = 'rgba(238,241,248,0.62)';
          context.font = font(24, 600);
          context.fillText(fitText(row.sub, width - padding * 2 - 40), padding + 32, top + 82);
        }
        top += rowHeight + (row.sub ? subHeight : 0);
      });
      top += 24;
    });
    openImageDialog(canvas.toDataURL('image/png'), fileName);
  }).catch(function () {
    showToast('The image could not be made. Please try again.', true);
  });
}

// The alliance's big logo, loaded so it can be drawn (null when there is none or it can't be used).
function loadLogoForImage(data) {
  if (data.isState) return Promise.resolve(null);
  const alliance = data.alliance;
  const baseUrl = app.data.settings.imageBaseUrl;
  const urls = [baseUrl ? baseUrl + allianceFileName(alliance) + '-full.png' : '', alliance.logoUrl || (baseUrl ? baseUrl + allianceFileName(alliance) + '.png' : '')].filter(Boolean);
  const tryNext = function (index) {
    if (index >= urls.length) return Promise.resolve(null);
    return new Promise(function (resolve) {
      const image = new Image();
      image.crossOrigin = 'anonymous';
      image.onload = function () { resolve(image); };
      image.onerror = function () { resolve(null); };
      image.src = urls[index];
    }).then(function (image) { return image || tryNext(index + 1); });
  };
  return tryNext(0);
}

function roundedRect(context, x, y, width, height, radius) {
  context.beginPath();
  context.moveTo(x + radius, y);
  context.arcTo(x + width, y, x + width, y + height, radius);
  context.arcTo(x + width, y + height, x, y + height, radius);
  context.arcTo(x, y + height, x, y, radius);
  context.arcTo(x, y, x + width, y, radius);
  context.closePath();
}

// Shows the finished image with a download link (on phones: press and hold the image to save it).
function openImageDialog(imageUrl, fileName) {
  closeDialog();
  const backdrop = document.createElement('div');
  backdrop.className = 'dialog-backdrop';
  backdrop.id = 'dialogBackdrop';
  backdrop.innerHTML = '<div class="dialog-box" role="dialog" aria-modal="true" aria-label="Image"><h2>Image</h2>' +
    '<p class="admin-help">Download it, or press and hold it to save or share it.</p>' +
    '<img class="image-preview" src="' + imageUrl + '" alt="Page image">' +
    '<div class="dialog-actions"><a class="primary-button" href="' + imageUrl + '" download="' + escapeHtml(fileName) + '">Download</a>' +
    '<button type="button" class="ghost-button" data-cancel-button>Close</button></div></div>';
  document.body.appendChild(backdrop);
  backdrop.querySelector('[data-cancel-button]').addEventListener('click', closeDialog);
  backdrop.addEventListener('click', function (event) { if (event.target === backdrop) closeDialog(); });
  hideToast();
}

function openMeDialog() {
  if (!app.data) return;
  const me = app.data.me;
  const allianceOptions = [{ value: '', label: 'Not set' }].concat(sortedAlliances().map(function (alliance) {
    return { value: alliance.id, label: allianceDisplayName(alliance) };
  }));

  if (me) {
    openFormDialog({
      title: 'Me',
      intro: 'Signed in as ' + me.email + '. Your filters and followed times are saved to your account.',
      fields: [
        { name: 'name', label: 'Player name (optional)', type: 'text', value: me.name },
        { name: 'allianceId', label: 'My alliance', type: 'select', options: allianceOptions, value: me.allianceId }
      ],
      saveLabel: 'Save',
      onSave: function (values) {
        return callServer('saveMyProfile', app.sessionToken, values).then(function (data) {
          receiveData(data);
          renderEverything();
          showToast('Saved.');
        });
      },
      extraButtons: [{
        label: 'Sign out', className: 'danger-button', onClick: function () {
          return callServer('signOut', app.sessionToken).then(function () {
            app.sessionToken = '';
            removeStorage(STORAGE_KEYS.sessionToken);
            return callServer('getAllData', '');
          }).then(function (data) {
            receiveData(data);
            renderEverything();
            showToast('Signed out.');
          });
        }
      }]
    });
    return;
  }

  // Guest: choose an alliance (kept on this device) or sign in with Google.
  const signInUrl = app.data.settings.signInUrl;
  openFormDialog({
    title: 'Me',
    intro: 'You are browsing as a guest. Your filters and followed times are kept on this device. Sign in with Google to keep them on every device.' +
      (!signInUrl ? ' Sign-in is not set up yet.' : isInsideAppBrowser() ? ' Google does not allow signing in inside other apps, so open this page in Safari or Chrome first.' : ''),
    fields: [
      { name: 'allianceId', label: 'My alliance', type: 'select', options: allianceOptions, value: app.myAllianceId }
    ],
    saveLabel: 'Save',
    // A real link: the sign-in page replaces the whole app and comes back here signed in.
    extraButtons: signInUrl ? [{ label: 'Sign in with Google', className: 'primary-button', href: signInUrl }] : [],
    onSave: function (values) {
      app.myAllianceId = values.allianceId;
      savePreferences();
      renderEverything();
      showToast('Saved on this device.');
      return Promise.resolve();
    }
  });
}

const ADMIN_TABS = [
  { id: 'schedules', label: 'Schedules' },
  { id: 'events', label: 'Events' },
  { id: 'points', label: 'Points' },
  { id: 'steps', label: 'Steps' },
  { id: 'phases', label: 'Phases' },
  { id: 'alliances', label: 'Alliances' },
  { id: 'transfers', label: 'Transfers' },
  { id: 'images', label: 'Images' },
  { id: 'admins', label: 'Admins' }
];

function renderAdminPage() {
  const page = document.getElementById('adminPage');
  if (!app.data || !app.data.isAdmin) {
    page.innerHTML = '';
    return;
  }
  let html = '<div class="chips admin-tabs" role="group" aria-label="Admin sections">' + ADMIN_TABS.map(function (tab) {
    return '<button type="button" class="chip" data-admin-tab="' + tab.id + '" aria-pressed="' + (app.adminTab === tab.id) + '">' + tab.label + '</button>';
  }).join('') + '</div>';

  if (app.adminTab === 'schedules') html += renderAdminSchedules();
  if (app.adminTab === 'events') html += renderAdminEvents();
  if (app.adminTab === 'points') html += renderAdminPoints();
  if (app.adminTab === 'steps') html += renderAdminSteps();
  if (app.adminTab === 'phases') html += renderAdminPhases();
  if (app.adminTab === 'alliances') html += renderAdminAlliances();
  if (app.adminTab === 'transfers') html += renderAdminTransfers();
  if (app.adminTab === 'images') html += renderAdminImages();
  if (app.adminTab === 'admins') html += renderAdminAdmins();
  page.innerHTML = html;

  page.onchange = function (event) {
    if (event.target.id === 'pointsEventSelect') {
      app.adminPointsEventTypeId = event.target.value;
      renderAdminPage();
    }
    if (event.target.id === 'stepsEventSelect') {
      app.adminStepsEventTypeId = event.target.value;
      renderAdminPage();
    }
    if (event.target.id === 'phasesEventSelect') {
      app.adminPhasesEventTypeId = event.target.value;
      renderAdminPage();
    }
  };
  page.onclick = function (event) {
    const tabButton = event.target.closest('[data-admin-tab]');
    if (tabButton) {
      app.adminTab = tabButton.getAttribute('data-admin-tab');
      renderAdminPage();
      return;
    }
    const actionButton = event.target.closest('[data-admin-action]');
    if (!actionButton) return;
    const action = actionButton.getAttribute('data-admin-action');
    const id = actionButton.getAttribute('data-id') || '';
    if (action === 'edit-schedule') openScheduleDialog(id);
    if (action === 'edit-event') openEventTypeDialog(id);
    if (action === 'edit-alliance') openAllianceDialog(id);
    if (action === 'edit-transfer-group') openTransferGroupDialog(id);
    if (action === 'edit-point-source') openPointSourceDialog(id);
    if (action === 'edit-step') openStepDialog(id);
    if (action === 'edit-phase') openPhaseDialog(id);
    if (action === 'transfer-follows') saveSettingFromButton('transferFollows', actionButton.getAttribute('data-value'));
    if (action === 'save-image-link') saveSettingFromButton('imageBaseUrl', document.getElementById('imageBaseUrlInput').value);
    if (action === 'make-admin') makeAdmin(id);
    if (action === 'save-sign-in-link') saveSettingFromButton('signInUrl', document.getElementById('signInUrlInput').value);
    if (action === 'remove-admin') removeAdminByEmail(id);
  };
}

function renderAdminSchedules() {

  let list = '';
  eventTypes.forEach(function (eventType) {
    app.data.schedules.filter(function (schedule) { return schedule.eventTypeId === eventType.id; }).forEach(function (schedule) {

function renderAdminEvents() {
  const list = eventTypesWithPartsAfterMain().map(function (eventType) {
    const categoryLabel = (CATEGORIES.filter(function (category) { return category.id === eventType.category; })[0] || {}).label || eventType.category;
    const isPart = isPartEvent(eventType);
    const meta = [isPart ? 'Part of ' + app.lookups.eventTypesById[eventType.partOf].name : categoryLabel];
    if (eventType.typeLabel) meta.push(eventType.typeLabel);
    if (Number(eventType.groupCount)) meta.push(eventType.groupCount + ' ' + eventType.groupName.toLowerCase() + 's per alliance');
    if (eventType.detailsOnly === 'yes') meta.push('only in day details');
    if (!app.lookups.scheduledEventTypes[eventType.id] && eventType.id !== 'transfer') meta.push(isPart ? 'runs with its main event' : 'no dates yet');
    return '<div class="admin-item' + (isPart ? ' academy' : '') + '">' + eventBadgeMarkup(eventType, 'list') +
      '<div class="admin-item-text"><span class="admin-item-title">' + escapeHtml(eventType.name) + '</span>' +
      '<span class="admin-item-meta">' + escapeHtml(meta.join(' · ')) + '</span></div>' +
      pencilButton('data-admin-action="edit-event" data-id="' + escapeHtml(eventType.id) + '"', 'Edit') + '</div>';
  }).join('');
  return '<section class="admin-section glass"><h2>Events</h2>' +
    '<p class="admin-help">The kinds of events, with their colour, icon and category (the category decides which filter shows them; times set for one alliance always show under Alliance).</p>' +
    '<div><button type="button" class="primary-button" data-admin-action="edit-event">Add event</button></div>' +
    '<div class="admin-list">' + list + '</div></section>';
}

// Points lists, one event at a time, grouped by day.
function renderAdminPoints() {
  const eventTypes = sortedEventTypes();
  if (!app.lookups.eventTypesById[app.adminPointsEventTypeId] && eventTypes.length) app.adminPointsEventTypeId = eventTypes[0].id;
  const eventType = app.lookups.eventTypesById[app.adminPointsEventTypeId];
  const sources = app.lookups.pointSourcesByEventType[app.adminPointsEventTypeId] || [];
  const byDay = {};
  sources.forEach(function (source) {
    const dayKey = source.dayNumber || '0';
    if (!byDay[dayKey]) byDay[dayKey] = [];
    byDay[dayKey].push(source);
  });
  const groups = Object.keys(byDay).sort(function (a, b) { return Number(a) - Number(b); }).map(function (dayKey) {
    const first = byDay[dayKey][0];
    const title = dayKey === '0' ? 'Whole event' : 'Day ' + dayKey + (first.dayName ? ' · ' + first.dayName : '');
    return '<h3 class="admin-subtitle">' + escapeHtml(title) + '</h3><div class="admin-list">' + byDay[dayKey].map(function (source) {
      return '<div class="admin-item"><div class="admin-item-text"><span class="admin-item-title">' + escapeHtml(source.task) + '</span>' +
        '<span class="admin-item-meta">' + escapeHtml(source.points ? source.points + ' points' : 'Note') + '</span></div>' +
        pencilButton('data-admin-action="edit-point-source" data-id="' + escapeHtml(source.id) + '"', 'Edit') + '</div>';
    }).join('') + '</div>';
  }).join('');
  return '<section class="admin-section glass"><h2>Points</h2>' +
    '<p class="admin-help">How to earn points, shown under the event in day details. Leave "Day" empty for rows that apply to the whole event; leave "Points" empty for a note. Write {eventsHero} or {luckyWheelHero} for a hero that changes with the generation (the one 2 generations back). You can also edit the PointSources tab in the sheet.</p>' +
    '<label class="form-field"><span>Event</span><select class="text-input" id="pointsEventSelect">' + eventTypes.map(function (type) {
      return '<option value="' + escapeHtml(type.id) + '"' + (type.id === app.adminPointsEventTypeId ? ' selected' : '') + '>' + escapeHtml(type.name) + '</option>';

    '<div><button type="button" class="primary-button" data-admin-action="edit-point-source">Add row</button></div>' +
    (groups || '<span class="admin-item-meta">No points for this event yet.</span>') + '</section>';
}

// "Edit this date": move it, change its times, cancel it, and note the state alliance, opponents and result.
function openOccurrenceDialog(occurrenceKey) {
  const separator = occurrenceKey.lastIndexOf('|');
  const scheduleId = occurrenceKey.slice(0, separator);
  const originalDate = occurrenceKey.slice(separator + 1);
  const originalDay = dayFromText(originalDate);
  const existing = changeFor(scheduleId, originalDay);
  const schedule = app.lookups.schedulesById[scheduleId];
  const isTransfer = scheduleId === TRANSFER_SCHEDULE_ID;
  const eventType = isTransfer ? app.lookups.eventTypesById.transfer : (schedule ? app.lookups.eventTypesById[schedule.eventTypeId] : null);
  if (!eventType) return;
  const allianceOptions = [{ value: '', label: 'None' }].concat(sortedAlliances().map(function (alliance) {
    return { value: alliance.id, label: allianceDisplayName(alliance) };
  }));
  const valueOf = function (column) { return existing ? existing[column] || '' : ''; };

  // Opponents may be stored on another SvS phase of the same run; edit them where they are.
  const occurrenceStub = { eventType: eventType, scheduleId: scheduleId, originalDay: originalDay };
  const foundOpponents = findOpponents(occurrenceStub);
  const opponentSource = foundOpponents && (foundOpponents.scheduleId !== scheduleId || foundOpponents.originalDay !== originalDay)
    ? { scheduleId: foundOpponents.scheduleId, originalDay: foundOpponents.originalDay } : null;
  const opponentRow = opponentSource ? changeFor(opponentSource.scheduleId, opponentSource.originalDay) : existing;
  const opponentCount = Number(eventType.opponentCount) || 0;

  const fields = [
    { name: 'newDate', label: 'Date', type: 'date', value: valueOf('newDate') || originalDate },
    { row: [
      { name: 'newStartTimeUtc', label: 'Start (UTC)', type: 'time', value: valueOf('newStartTimeUtc') || (schedule ? schedule.startTimeUtc : '') },
      { name: 'newEndTimeUtc', label: 'End (UTC)', type: 'time', value: valueOf('newEndTimeUtc') || (schedule ? schedule.endTimeUtc : '') }
    ] }
  ];
  if (!isTransfer && schedule && !schedule.allianceIds) {
    fields.push({ name: 'stateAllianceId', label: 'State alliance for this event', type: 'select', options: allianceOptions, value: valueOf('stateAllianceId') });
  }
  for (let number = 1; number <= opponentCount; number++) {
    const stateField = { name: 'opponentState' + number, label: (opponentCount > 1 ? 'Opponent ' + number + ': state' : 'Opponent state'), type: 'number',
      value: opponentRow ? opponentRow['opponentState' + number] || '' : '' };
    if (eventType.opponentHasAlliance === 'yes') {
      fields.push({ row: [stateField, { name: 'opponentAlliance' + number, label: (opponentCount > 1 ? 'Opponent ' + number + ': alliance' : 'Opponent alliance'), type: 'text',
        value: opponentRow ? opponentRow['opponentAlliance' + number] || '' : '' }] });
    } else {
      fields.push(stateField);
    }
  }
  if (eventType.resultType === 'winloss') {
    fields.push({ name: 'result', label: 'Result', type: 'select', value: valueOf('result'),
      options: [{ value: '', label: 'Not played yet' }, { value: 'win', label: 'Won' }, { value: 'loss', label: 'Lost' }] });
  }
  if (eventType.resultType === 'rank') fields.push({ name: 'rank', label: 'Rank', type: 'number', value: valueOf('rank') });
  if (eventType.hasPresident === 'yes') {
    fields.push({ row: [
      { name: 'presidentAllianceId', label: 'President\'s alliance', type: 'select', options: allianceOptions, value: valueOf('presidentAllianceId') },
      { name: 'presidentName', label: 'President (optional)', type: 'text', value: valueOf('presidentName') }
    ] });
  }
  fields.push({ name: 'note', label: 'Note (optional)', type: 'text', value: valueOf('note') });
  if (eventType.id === CANCELLABLE_EVENT_ID) fields.push({ name: 'cancelled', label: 'Cancel this date', type: 'checkbox', value: valueOf('cancelled') });

  openFormDialog({
    title: 'Edit this date',
    intro: eventDisplayName(eventType, schedule ? (schedule.label || groupLabel(eventType, schedule.groupNumber)) : '') +
      (schedule && schedule.allianceIds ? ' · ' + schedule.allianceIds.split(',').map(allianceTagById).join(', ') : '') +
      ', planned for ' + formatDayLong(originalDay) + '. To change every date, edit the schedule in Admin.' +
      (opponentSource ? ' The opponent is shared by every phase of this ' + (app.lookups.eventTypesById[eventType.partOf] || eventType).name + '.' : ''),
    fields: fields,
    saveLabel: 'Save',
    onSave: function (values) {
      // Keep every column of the existing row, then put the new values over it.
      const record = Object.assign({}, existing || {}, {
        id: existing ? existing.id : '',
        scheduleId: scheduleId,
        originalDate: originalDate,
        newDate: values.newDate === originalDate ? '' : values.newDate,
        newStartTimeUtc: schedule && values.newStartTimeUtc === schedule.startTimeUtc ? '' : values.newStartTimeUtc,
        newEndTimeUtc: schedule && values.newEndTimeUtc === schedule.endTimeUtc ? '' : values.newEndTimeUtc,
        cancelled: eventType.id === CANCELLABLE_EVENT_ID ? values.cancelled : '',
        note: values.note
      });
      ['stateAllianceId', 'result', 'rank', 'presidentAllianceId', 'presidentName'].forEach(function (column) {
        if (values.hasOwnProperty(column)) record[column] = values[column];
      });
      const opponentValues = {};
      for (let number = 1; number <= opponentCount; number++) {
        opponentValues['opponentState' + number] = values['opponentState' + number] || '';
        opponentValues['opponentAlliance' + number] = values['opponentAlliance' + number] || '';
      }
      if (!opponentSource) {
        Object.assign(record, opponentValues);
        return saveRecordAndRefresh('DateChanges', record);
      }
      // The opponent lives on another phase: save it there, and this date's own changes here.
      const sourceRow = changeFor(opponentSource.scheduleId, opponentSource.originalDay);
      const sourceRecord = Object.assign({}, sourceRow, opponentValues);
      return callServer('saveRecord', app.sessionToken, 'DateChanges', sourceRecord).then(function () {
        return saveRecordAndRefresh('DateChanges', record);
      });
    },
    onDelete: existing ? function () {
      return deleteRecordAndRefresh('DateChanges', existing.id, 'Back to the planned date, without notes or results.');
    } : null,
    deleteLabel: 'Clear this date'
  });
}

// Opens a dialog with the given fields. onSave gets the values and returns a promise;
// the dialog closes when it succeeds and shows the error when it fails.
function openFormDialog(options) {
  closeDialog();
  const backdrop = document.createElement('div');
  backdrop.className = 'dialog-backdrop';
  backdrop.id = 'dialogBackdrop';

  const fieldsHtml = options.fields.map(function (field) {
    if (field.row) return '<div class="form-row">' + field.row.map(fieldMarkup).join('') + '</div>';
    return fieldMarkup(field);
  }).join('');
  const extraButtonsHtml = (options.extraButtons || []).map(function (button, index) {
    if (button.href) return '<a class="' + button.className + '" href="' + escapeHtml(button.href) + '" target="_top" rel="noopener">' + escapeHtml(button.label) + '</a>';
    return '<button type="button" class="' + button.className + '" data-extra-button="' + index + '">' + escapeHtml(button.label) + '</button>';
  }).join('');

  backdrop.innerHTML = '<form class="dialog-box" role="dialog" aria-modal="true" aria-label="' + escapeHtml(options.title) + '" novalidate>' +
    '<h2>' + escapeHtml(options.title) + '</h2>' +
    (options.intro ? '<p class="admin-help">' + escapeHtml(options.intro) + '</p>' : '') +
    fieldsHtml +
    '<div class="form-message" data-form-message></div>' +
    '<div class="dialog-actions">' +
    (options.onDelete ? '<button type="button" class="danger-button" data-delete-button>' + escapeHtml(options.deleteLabel || 'Delete') + '</button>' : '') +
    extraButtonsHtml +
    '<button type="button" class="ghost-button" data-cancel-button>Cancel</button>' +
    '<button type="submit" class="primary-button">' + escapeHtml(options.saveLabel || 'Save') + '</button></div></form>';
  document.body.appendChild(backdrop);

  const form = backdrop.querySelector('form');
  const message = backdrop.querySelector('[data-form-message]');

  function runAction(action) {
    message.textContent = '';
    const buttons = form.querySelectorAll('button');
    buttons.forEach(function (button) { button.disabled = true; });
    Promise.resolve()
      .then(action)
      .then(function (result) {
        if (result === 'cancelled') {
          buttons.forEach(function (button) { button.disabled = false; });
          return;
        }
        if (result !== 'keep-open-replaced' && document.getElementById('dialogBackdrop') === backdrop) closeDialog();
      })
      .catch(function (error) {
        buttons.forEach(function (button) { button.disabled = false; });
        message.textContent = errorText(error);
      });
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    runAction(function () { return options.onSave(readFormValues(form, options.fields)); });
  });
  form.querySelector('[data-cancel-button]').addEventListener('click', closeDialog);
  if (options.onDelete) form.querySelector('[data-delete-button]').addEventListener('click', function () { runAction(options.onDelete); });
  (options.extraButtons || []).forEach(function (button, index) {
    if (button.href) return;
    form.querySelector('[data-extra-button="' + index + '"]').addEventListener('click', function () { runAction(button.onClick); });
  });
  form.addEventListener('click', function (event) {
    const iconButton = event.target.closest('[data-icon-choice]');
    if (!iconButton) return;
    iconButton.parentElement.querySelectorAll('[data-icon-choice]').forEach(function (button) {
      button.setAttribute('aria-pressed', String(button === iconButton));
    });
  });
  backdrop.addEventListener('click', function (event) { if (event.target === backdrop) closeDialog(); });

  const firstInput = form.querySelector('input, select');
  if (firstInput && window.innerWidth >= 700) firstInput.focus();
}

function closeDialog() {
  const existing = document.getElementById('dialogBackdrop');
  if (existing) existing.remove();
}

function fieldMarkup(field) {
  const id = 'field-' + field.name;
  const value = field.value === undefined || field.value === null ? '' : String(field.value);
  const help = field.help ? '<small>' + escapeHtml(field.help) + '</small>' : '';

  if (field.type === 'select') {
    return '<label class="form-field"><span>' + escapeHtml(field.label) + '</span><select class="text-input" id="' + id + '" name="' + field.name + '">' +
      field.options.map(function (option) {
        return '<option value="' + escapeHtml(option.value) + '"' + (option.value === value ? ' selected' : '') + '>' + escapeHtml(option.label) + '</option>';
      }).join('') + '</select>' + help + '</label>';
  }
  if (field.type === 'checks') {
    const chosen = value ? value.split(',') : [];
    const boxes = field.options.length ? field.options.map(function (option) {
      return '<label class="check-option"><input type="checkbox" name="' + field.name + '" value="' + escapeHtml(option.value) + '"' +
        (chosen.indexOf(option.value) !== -1 ? ' checked' : '') + '>' + escapeHtml(option.label) + '</label>';
    }).join('') : '<span class="admin-item-meta">No alliances yet.</span>';
    return '<div class="form-field"><span>' + escapeHtml(field.label) + '</span><div class="check-list">' + boxes + '</div>' + help + '</div>';
  }
  if (field.type === 'checkbox') {
    return '<label class="check-option" style="align-self:flex-start"><input type="checkbox" name="' + field.name + '"' + (value === 'yes' ? ' checked' : '') + '>' + escapeHtml(field.label) + '</label>';
  }
  if (field.type === 'icon') {
    return '<div class="form-field"><span>' + escapeHtml(field.label) + '</span><div class="icon-picker" data-icon-field="' + field.name + '">' +
      Object.keys(ICONS).map(function (iconName) {
        return '<button type="button" data-icon-choice="' + iconName + '" aria-pressed="' + (iconName === value) + '" aria-label="' + iconName + '">' + svgIcon(iconName) + '</button>';
      }).join('') + '</div></div>';
  }
  if (field.type === 'textarea') {
    return '<label class="form-field"><span>' + escapeHtml(field.label) + '</span><textarea class="text-input" id="' + id + '" name="' + field.name + '" rows="4">' + escapeHtml(value) + '</textarea>' + help + '</label>';
  }
  const inputType = field.type === 'number' ? 'text' : field.type;
  const extra = (field.type === 'number' ? ' inputmode="numeric"' : '') +
    (field.inputMode ? ' inputmode="' + field.inputMode + '"' : '') +
    (field.autocomplete ? ' autocomplete="' + field.autocomplete + '"' : '');
  return '<label class="form-field"><span>' + escapeHtml(field.label) + '</span><input class="text-input" id="' + id + '" name="' + field.name + '" type="' + inputType + '" value="' + escapeHtml(value) + '"' + extra + '>' + help + '</label>';
}

function readFormValues(form, fields) {
  const values = {};
  const flatFields = [];
  fields.forEach(function (field) {
    if (field.row) field.row.forEach(function (rowField) { flatFields.push(rowField); });
    else flatFields.push(field);
  });
  flatFields.forEach(function (field) {
    if (field.type === 'checks') {
      values[field.name] = Array.prototype.map.call(form.querySelectorAll('input[name="' + field.name + '"]:checked'), function (box) { return box.value; }).join(',');
    } else if (field.type === 'checkbox') {
      values[field.name] = form.querySelector('input[name="' + field.name + '"]').checked ? 'yes' : '';
    } else if (field.type === 'icon') {
      const chosen = form.querySelector('[data-icon-field="' + field.name + '"] [aria-pressed="true"]');
      values[field.name] = chosen ? chosen.getAttribute('data-icon-choice') : '';
    } else {
      const input = form.querySelector('[name="' + field.name + '"]');
      values[field.name] = input ? input.value.trim() : '';
    }
  });
  return values;
}

function eventDisplayName(eventType, label) {
  return eventType.name + (label ? ' · ' + label : '');
}

// "Legion 2" for schedule group 2 of an event with legions; empty when the event has no groups.
function groupLabel(eventType, groupNumber) {
  if (!groupNumber || !eventType.groupName || !Number(eventType.groupCount)) return '';
  return eventType.groupName + ' ' + groupNumber;
}

// Parts listed right after their main event (used by the admin lists).
function eventTypesWithPartsAfterMain() {
  const result = [];
  sortedEventTypes().forEach(function (eventType) {
    if (eventType.partOf && app.lookups.eventTypesById[eventType.partOf]) return;
    result.push(eventType);
    (app.lookups.partsByMain[eventType.id] || []).slice()
      .sort(function (a, b) { return (Number(a.sortOrder) || 99) - (Number(b.sortOrder) || 99); })
      .forEach(function (part) { result.push(part); });
  });
  return result;
}

// Event choices for the admin dialogs, parts indented under their main event.
function eventTypeOptions() {
  return eventTypesWithPartsAfterMain().map(function (eventType) {
    return { value: eventType.id, label: (isPartEvent(eventType) ? '— ' : '') + eventType.name };
  });
}

function isPartEvent(eventType) {
  return !!(eventType.partOf && app.lookups.eventTypesById[eventType.partOf]);
}

function describeSchedule(schedule) {
  const parts = ['From ' + formatDayShort(dayFromText(schedule.firstDate)) + ' ' + schedule.firstDate.slice(0, 4)];
  const every = Number(schedule.repeatEveryDays) || 0;
  parts.push(every > 0 ? 'every ' + every + ' days' : 'once');
  parts.push((Number(schedule.lengthDays) || 1) + ' day' + (Number(schedule.lengthDays) > 1 ? 's' : ''));
  if (schedule.startTimeUtc) parts.push(schedule.startTimeUtc + (schedule.endTimeUtc ? '–' + schedule.endTimeUtc : '') + ' UTC');
  parts.push(schedule.allianceIds ? schedule.allianceIds.split(',').map(allianceTagById).join(', ') : 'State');
  if (schedule.groupNumber && !schedule.label) {
    const eventType = app.lookups.eventTypesById[schedule.eventTypeId];
    if (eventType) parts.push(groupLabel(eventType, schedule.groupNumber));
  }
  if (schedule.untilDate) parts.push('until ' + schedule.untilDate);
  return parts.join(' · ');
}

function sortedEventTypes() {
  return app.data.eventTypes.slice().sort(function (a, b) {
    return (Number(a.sortOrder) || 99) - (Number(b.sortOrder) || 99) || a.name.localeCompare(b.name);
  });
}

// Main alliances in order, each followed by its academies.
function sortedAlliances() {
  const byOrder = function (a, b) { return (Number(a.sortOrder) || 99) - (Number(b.sortOrder) || 99) || a.name.localeCompare(b.name); };
  const mains = app.data.alliances.filter(function (alliance) { return !alliance.mainAllianceId; }).sort(byOrder);
  // My alliance first, so its times come first in day details.
  mains.sort(function (a, b) { return (b.id === app.myAllianceId) - (a.id === app.myAllianceId); });
  const result = [];
  mains.forEach(function (main) {
    result.push(main);
    app.data.alliances.filter(function (alliance) { return alliance.mainAllianceId === main.id; }).sort(byOrder)
      .forEach(function (academy) { result.push(academy); });
  });
  return result;
}

function allianceDisplayName(alliance) {
  return alliance.tag ? '[' + alliance.tag + '] ' + alliance.name : alliance.name;
}

function allianceTagById(allianceId) {
  const alliance = app.lookups.alliancesById[allianceId];
  if (!alliance) return '?';
  return alliance.tag || alliance.name;
}

// The logo's file name: the tag as written (capitals count, so "DVL" and its academy "dvl" get different files).
function allianceFileName(alliance) {
  return (alliance.tag || alliance.name).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '') || alliance.id;
}

function allianceLogoMarkup(alliance, size) {
  const base = alliance.baseColor || '#6F9BE6';
  const second = alliance.secondColor || '#AFC8F5';
  const style = 'width:' + size + 'px;height:' + size + 'px;background:linear-gradient(135deg,' + mixWithWhite(base, 0.35) + ',' + mixWithWhite(second, 0.35) + ');border-color:' + base;
  const initials = escapeHtml((alliance.tag || alliance.name).slice(0, 3));
  const imageUrl = alliance.logoUrl || (app.data.settings.imageBaseUrl ? app.data.settings.imageBaseUrl + allianceFileName(alliance) + '.png' : '');
  const image = imageUrl ? '<img src="' + escapeHtml(imageUrl) + '" alt="" onerror="this.remove()">' : '';
  return '<span class="alliance-logo" style="' + style + '">' + (image ? image : initials) + '</span>';
}

function svgIcon(iconName) {
  return '<svg class="event-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    (ICONS[iconName] || ICONS.star) + '</svg>';
}

// The event's icon at a set size, without a background ('' = 40 px, 'small' = 32 px, 'list' = 28 px).
// Drawn icons (used until the picture is in the repo) take the event's colour.
function eventBadgeMarkup(eventType, sizeClass) {
  return '<span class="event-badge' + (sizeClass ? ' ' + sizeClass : '') + '" style="color:' + escapeHtml(eventType.color || '#AFC8F5') + '">' + eventIconMarkup(eventType) + '</span>';
}

// Uses the repo image when there is one; falls back to the drawn icon if the file is missing.
function eventIconMarkup(eventType) {
  const imageUrl = eventType.iconUrl || eventImageUrl(eventImageFile(eventType));
  if (!imageUrl) return svgIcon(eventType.icon);
  return '<img class="event-icon" src="' + escapeHtml(imageUrl) + '" alt="" data-fallback-icon="' + escapeHtml(eventType.icon || 'star') + '" onerror="useDrawnIcon(this)">';
}

// The link of an event's picture file: in the image folder, or in another folder of the image repo when the name has
// one in front ("items/match-stake": Match Prediction uses the Match Stake picture).
function eventImageUrl(fileName) {
  if (!app.data || !app.data.settings.imageBaseUrl || !fileName) return '';
  if (fileName.indexOf('/') !== -1) return assetUrl(fileName.split('/').map(encodeURIComponent).join('/') + '.png');
  return app.data.settings.imageBaseUrl + encodeURIComponent(fileName) + '.png';
}

// The picture's file name in the image folder (several events can share one picture).
// A part without its own picture uses its main event's picture.
function eventImageFile(eventType) {
  if (eventType.imageFile) return eventType.imageFile;
  const mainType = eventType.partOf && app.lookups.eventTypesById[eventType.partOf];
  if (mainType) return mainType.imageFile || mainType.id;
  return eventType.id;
}

function useDrawnIcon(image) {
  const holder = document.createElement('span');
  holder.innerHTML = svgIcon(image.getAttribute('data-fallback-icon'));
  image.replaceWith(holder.firstChild);
}

function tintedPanelStyle(color) {
  return 'background:linear-gradient(135deg,' + colorWithAlpha(color, 0.36) + ',' + colorWithAlpha(color, 0.04) + ' 65%),var(--glass);' +
    'box-shadow:inset 0 1px 0 rgba(255,255,255,0.14),inset 0 -3px 0 ' + colorWithAlpha(color, 0.7) + ',0 10px 26px ' + colorWithAlpha(color, 0.12) + ';';
}

/* ================================================================== */
/* Dates (whole days counted from 1 Jan 1970, in UTC = game time)      */
/* ================================================================== */

const MILLISECONDS_PER_DAY = 86400000;

function dayFromParts(year, month, date) {
  return Math.round(Date.UTC(year, month, date) / MILLISECONDS_PER_DAY);
}

function dayFromText(text) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(text || '')) return NaN;
  const parts = text.split('-').map(Number);
  return dayFromParts(parts[0], parts[1] - 1, parts[2]);
}

function partsFromDay(day) {
  const date = new Date(day * MILLISECONDS_PER_DAY);
  return { year: date.getUTCFullYear(), month: date.getUTCMonth(), date: date.getUTCDate(), weekday: (date.getUTCDay() + 6) % 7 };
}

function textFromDay(day) {
  return new Date(day * MILLISECONDS_PER_DAY).toISOString().slice(0, 10);
}

// Today as shown: the UTC day, or this device's day for "Mine".
function todayDay() {
  return shownDayOf(nowMinute());
}

function nowMinute() {
  return Math.floor(Date.now() / 60000);
}

function mondayOf(day) {
  return day - partsFromDay(day).weekday;
}

function formatDayLong(day) {
  const parts = partsFromDay(day);
  return WEEKDAY_NAMES[parts.weekday] + ', ' + parts.date + ' ' + MONTH_SHORT[parts.month];
}

function formatDayShort(day) {
  const parts = partsFromDay(day);
  return WEEKDAY_SHORT[parts.weekday] + ' ' + parts.date + ' ' + MONTH_SHORT[parts.month];
}

// "2–8 Nov", or "30 Nov – 6 Dec" when the week crosses into the next month.
function weekTitle(monday) {
  const start = partsFromDay(monday);
  const end = partsFromDay(monday + 6);
  if (start.month === end.month) return start.date + '–' + end.date + ' ' + MONTH_SHORT[end.month];
  return start.date + ' ' + MONTH_SHORT[start.month] + ' – ' + end.date + ' ' + MONTH_SHORT[end.month];
}

function minutesFromTime(timeText) {
  if (!timeText) return -1;
  const parts = timeText.split(':').map(Number);
  return parts[0] * 60 + parts[1];
}

/* ---------- Times: kept in UTC (game time); shown in UTC or on this device's clock ("Mine") ---------- */

const MINUTES_PER_DAY = 1440;

function showsLocalTime() {
  return app.timeMode === 'local';
}

// How many minutes the shown clock is ahead of UTC at a moment (minutes since 1 Jan 1970 UTC); 0 for UTC.
function shiftAt(minute) {
  return showsLocalTime() ? -new Date(minute * 60000).getTimezoneOffset() : 0;
}

// A moment as minutes on the shown clock, the shown day it falls on, and its time ("14:05").
function shownMinute(minute) {
  return minute + shiftAt(minute);
}
function shownDayOf(minute) {
  return Math.floor(shownMinute(minute) / MINUTES_PER_DAY);
}
function clockText(minute) {
  const inDay = ((shownMinute(minute) % MINUTES_PER_DAY) + MINUTES_PER_DAY) % MINUTES_PER_DAY;
  return String(Math.floor(inDay / 60)).padStart(2, '0') + ':' + String(inDay % 60).padStart(2, '0');
}

// The moments a shown day starts and ends (with "Mine" in UTC+2: 22:00 UTC the day before to 22:00 UTC).
function dayWindow(day) {
  const start = day * MINUTES_PER_DAY, end = (day + 1) * MINUTES_PER_DAY;
  return { start: start - shiftAt(start), end: end - shiftAt(end) };
}

/* ---------- The clock in the top bar ---------- */

function startClock() {
  updateClock();
  setInterval(function () {
    updateClock();
    // A new day: today's mark and "Next up" move.
    if (app.data && app.page === 'calendar' && todayDay() !== app.shownToday) renderCalendarPage();
    // The open event's timeline: the "now" mark moves when the next row starts (unless a row was tapped).
    else if (app.data && app.page === 'calendar' && app.openEventKey && !isGroupKey(app.openEventKey) && !app.pickedRow) {
      const occurrence = findOccurrenceByKey(app.openEventKey, app.selectedDay);
      if (occurrence && buildEventTree(occurrence, app.selectedDay).nowRowKey !== app.shownCurrentRow) renderDayPanel();
    }
  }, 20000);
}

function updateClock() {
  document.getElementById('clockTime').textContent = clockText(nowMinute());
  document.querySelectorAll('[data-time-mode]').forEach(function (button) {
    button.setAttribute('aria-pressed', String(button.getAttribute('data-time-mode') === app.timeMode));
  });
  document.getElementById('localModeButton').title = 'Your time (' + localOffsetLabel() + ')';
}

function localOffsetLabel() {
  const offsetMinutes = -new Date().getTimezoneOffset();
  if (offsetMinutes === 0) return 'UTC';
  const hours = Math.floor(Math.abs(offsetMinutes) / 60);
  const minutes = Math.abs(offsetMinutes) % 60;
  return 'UTC' + (offsetMinutes > 0 ? '+' : '−') + hours + (minutes ? ':' + String(minutes).padStart(2, '0') : '');
}

/* ================================================================== */
/* Colours                                                             */
/* ================================================================== */

function hexToRgb(hex) {
  const value = parseInt(String(hex || '#AFC8F5').replace('#', ''), 16);
  return { red: (value >> 16) & 255, green: (value >> 8) & 255, blue: value & 255 };
}

function colorWithAlpha(hex, alpha) {
  const rgb = hexToRgb(hex);
  return 'rgba(' + rgb.red + ',' + rgb.green + ',' + rgb.blue + ',' + alpha + ')';
}

// Hue (0–1), saturation and lightness (0–1) of a colour, and back.
function hexToHsl(hex) {
  const rgb = hexToRgb(hex);
  const red = rgb.red / 255, green = rgb.green / 255, blue = rgb.blue / 255;
  const max = Math.max(red, green, blue), min = Math.min(red, green, blue);
  const lightness = (max + min) / 2;
  if (max === min) return { hue: 0, saturation: 0, lightness: lightness };
  const range = max - min;
  const saturation = lightness > 0.5 ? range / (2 - max - min) : range / (max + min);
  let hue = max === red ? (green - blue) / range + (green < blue ? 6 : 0) : max === green ? (blue - red) / range + 2 : (red - green) / range + 4;
  return { hue: hue / 6, saturation: saturation, lightness: lightness };
}

function hslToHex(hue, saturation, lightness) {
  lightness = Math.min(0.95, Math.max(0.05, lightness));
  const toChannel = function (shift) {
    const k = (shift + hue * 12) % 12;
    const amount = saturation * Math.min(lightness, 1 - lightness);
    const value = lightness - amount * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(value * 255).toString(16).padStart(2, '0');
  };
  return '#' + toChannel(0) + toChannel(8) + toChannel(4);
}

// Blends a colour towards white (amount 0 = same colour, 1 = white).
function mixWithWhite(hex, amount) {
  const rgb = hexToRgb(hex);
  const blend = function (channel) { return Math.round(channel + (255 - channel) * amount); };
  return '#' + [blend(rgb.red), blend(rgb.green), blend(rgb.blue)].map(function (channel) {
    return channel.toString(16).padStart(2, '0');
  }).join('');
}

/* ================================================================== */
/* Server, storage, messages                                           */
/* ================================================================== */

function callServer(functionName) {
  const serverArguments = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    runner[functionName].apply(runner, serverArguments);
  });
}

// Browser storage can be blocked (private mode, some embedded pages); the app then simply forgets on reload.
function readStorage(key) {
  try { return window.localStorage.getItem(key); } catch (error) { return null; }
}
function writeStorage(key, value) {
  try { window.localStorage.setItem(key, value); } catch (error) { /* storage not available */ }
}
function removeStorage(key) {
  try { window.localStorage.removeItem(key); } catch (error) { /* storage not available */ }
}

function safeJson(text) {
  try { return text ? JSON.parse(text) : null; } catch (error) { return null; }
}

function escapeHtml(text) {
  return String(text === undefined || text === null ? '' : text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function errorText(error) {
  const text = error && error.message ? error.message : String(error);
  return text.replace(/^Exception:\s*/, '').replace(/^Error:\s*/, '');
}

let toastTimer = null;
function showToast(text, isError) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.className = 'toast' + (isError ? ' error' : '');
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.hidden = true; }, isError ? 6000 : 2500);
}

function hideToast() {
  document.getElementById('toast').hidden = true;
}

function showError(error) {
  showToast(errorText(error), true);
}
</script>
