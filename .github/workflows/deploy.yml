# Builds the site and publishes it to GitHub Pages on every push to main.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # The pictures the site shows: a small WebP of every PNG in public/images
      # (tools/images/make-webp.py). Kept between builds, so only new or changed
      # pictures are made again.
      - uses: actions/cache@v4
        with:
          path: .webp-cache
          key: webp-${{ hashFiles('public/images/**/*.png', 'tools/images/make-webp.py') }}
          restore-keys: webp-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/images/make-webp.py public/images .webp-cache
      - run: cp -r .webp-cache/. dist/images/ && rm -f dist/images/.made-from.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
